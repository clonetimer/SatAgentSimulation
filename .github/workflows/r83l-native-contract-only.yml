name: R83l Multiwheel Native Source Contract Regression

on:
  pull_request:
    paths:
      - 'src/sat_sim/experiments/native_fsw_multicondition_fault_source_r83l.py'
      - 'tests/test_r83l_native_fsw_multicondition_fault_contract.py'
      - '.github/workflows/r83l-native-contract-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  declared-native-case-contract:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: windows-2025
            python-version: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pip install -e . --no-deps
      - name: Review native actuator readback, immutable 54-arm protocol and metadata shadow regression
        run: python -m pytest -q tests/test_r83l_native_fsw_multicondition_fault_contract.py

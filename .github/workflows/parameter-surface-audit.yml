name: Registered simulation parameter surface audit

on:
  pull_request:
    paths:
      - "src/sat_sim/capabilities/**"
      - "src/sat_sim/form_schema.py"
      - "src/sat_sim/capability_registry.py"
      - "src/sat_sim/bsk_engine/unified_native.py"
      - "src/sat_sim/interactive/continuous_initial_config.py"
      - "src/sat_sim/validation/parameter_surface_audit.py"
      - "tests/test_parameter_surface_audit.py"
      - ".github/workflows/parameter-surface-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-form-native-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install parameter-audit test dependencies (no simulated physics)
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Registry to form structural tests and negative regression
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q tests/test_parameter_surface_audit.py
      - name: Generate parameter inventory and explicit native gaps
        env:
          PYTHONPATH: "src:."
        run: |
          python -m sat_sim.validation.parameter_surface_audit
      - name: Publish audit matrix for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: parameter-surface-audit
          path: reports/parameter_surface_audit/
          if-no-files-found: warn

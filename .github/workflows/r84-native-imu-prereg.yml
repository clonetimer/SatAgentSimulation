name: R84 original Basilisk native IMU observability pilot

on:
  pull_request:
    paths:
      - "configs/research/r84_native_imu_observability_pilot.json"
      - "src/sat_sim/experiments/native_imu_rw_observability_r84.py"
      - "scripts/run_r84_native_imu_observability.py"
      - "scripts/audit_r83m_native_archive.py"
      - "tests/test_r84_native_imu_prereg_contract.py"
      - "tests/test_r84_native_imu_execution_contract.py"
      - "docs/R84_NATIVE_IMU_RW_OBSERVABILITY_PREREG_20261106.md"
      - ".github/workflows/r84-native-imu-prereg.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prereg-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install minimal project source and contract test dependency
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1"
          python -m pip install -e . --no-deps
      - name: Validate preregistration and native observer-only source contracts
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q \
            tests/test_r84_native_imu_prereg_contract.py \
            tests/test_r84_native_imu_execution_contract.py

  native-r84:
    needs: prereg-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create evidence directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r84/wheel" "$RUNNER_TEMP/r84/compat" "$RUNNER_TEMP/r84/evidence"
      - name: Download and verify the exact original R83m Basilisk upstream wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/r84/wheel" "bsk==2.11.0"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "r84/wheel").glob("bsk-2.11.0-*.whl"))
          expected = "d51fe1ffa1b0b03dc415034b210497b28a2504428d4d8e71b481542a08c08a0a"
          if len(wheels) != 1 or hashlib.sha256(wheels[0].read_bytes()).hexdigest() != expected:
              raise RuntimeError("R84_ORIGINAL_R83M_BASILISK_WHEEL_SHA256_MISMATCH")
          print("R84_ORIGINAL_BASILISK_WHEEL_SHA256", expected)
          PY
      - name: Build metadata-only satfix2 compatibility wheel and prove binary payload unchanged
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_bsk_compat_wheels.py \
            "$RUNNER_TEMP"/r84/wheel/bsk-2.11.0-*.whl \
            --output-dir "$RUNNER_TEMP/r84/compat" \
            --report "$RUNNER_TEMP/r84/evidence/compat_payload_review.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "r84/evidence/compat_payload_review.json").read_text())
          result = report["results"][0]
          if not result["payload_bytes_unchanged"] or result["payload_file_count"] < 800:
              raise RuntimeError("R84_BASILISK_COMPATIBILITY_PATCH_CHANGED_NATIVE_PAYLOAD")
          print("R84_BASILISK_NATIVE_PAYLOAD_FILES", result["payload_file_count"])
          PY
      - name: Install exact native Basilisk runtime and project source without dependency substitution
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$RUNNER_TEMP"/r84/compat/bsk-2.11.0+satfix2-*.whl
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1"
          python -m pip install -e . --no-deps
          python - <<'PY'
          from importlib.metadata import version
          import Basilisk
          from Basilisk.simulation import spacecraft, reactionWheelStateEffector, imuSensor, simpleNav
          from Basilisk.fswAlgorithms import inertial3D, attTrackingError, mrpFeedback, rwMotorTorque
          assert version("bsk") == "2.11.0+satfix2"
          print("R84_NATIVE_BASILISK_DISTRIBUTION", version("bsk"))
          print("R84_BASILISK_MODULES_IMPORTED", Basilisk.__version__)
          PY
      - name: Download the immutable original 54-case R83m Actions artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/clonetimer/SatAgentSimulation/actions/artifacts/12586915899/zip" \
            -o "$RUNNER_TEMP/r84/r83m-original.zip"
          echo "R83M_ARCHIVE_SHA256 $(sha256sum "$RUNNER_TEMP/r84/r83m-original.zip" | cut -d' ' -f1)"
          echo "db83c8b50a833d2f9c5074cb3f6f9d44c8e0109a2a7be4ddcec5f70bff754796  $RUNNER_TEMP/r84/r83m-original.zip" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/r84/evidence/source"
          cp "$RUNNER_TEMP/r84/r83m-original.zip" "$RUNNER_TEMP/r84/evidence/source/r83m-original.zip"
          printf "%s  r83m-original.zip\n" "$(sha256sum "$RUNNER_TEMP/r84/evidence/source/r83m-original.zip" | cut -d' ' -f1)" > "$RUNNER_TEMP/r84/evidence/source/r83m-original.sha256"
      - name: Execute eight unique native IMU/RW arms and one exact seeded replay
        env:
          PYTHONPATH: "src:."
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_r84_native_imu_observability.py \
            --r83m-archive "$RUNNER_TEMP/r84/r83m-original.zip" \
            --output-dir "$RUNNER_TEMP/r84/evidence"
      - name: Verify complete native evidence receipt and non-training boundary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "r84/evidence"
          manifest = json.loads((root / "r84_execution_manifest.json").read_text())
          case_manifest = json.loads((root / "r84_case_manifest.json").read_text())
          sensor = json.loads((root / "r84_sensor_observations.json").read_text())
          qa = json.loads((root / "r84_physics_qa.json").read_text())
          assert manifest["status"] == "PASS"
          assert manifest["unique_arm_count"] == 8
          assert manifest["native_execution_count_including_one_replay"] == 9
          assert len(case_manifest["records"]) == 9
          assert len(sensor["records"]) == 9
          assert len(qa["records"]) == 9
          assert manifest["checks"] and all(manifest["checks"].values())
          assert manifest["diagnostic_model_trained"] is False
          assert manifest["formal_training_or_test_eligible"] is False
          source_dir = root / "source"
          assert (source_dir / "r83m-original.zip").is_file()
          assert (source_dir / "r83m-original.sha256").is_file()
          print("R84_NATIVE_IMU_EXECUTION_PASS", manifest["checks"])
          PY
          (cd "$RUNNER_TEMP/r84/evidence/source" && sha256sum --check r83m-original.sha256)
      - name: Upload R84 native observations, separate QA and failure receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r84-native-imu-rw-observability
          path: ${{ runner.temp }}/r84/evidence/
          if-no-files-found: warn
          retention-days: 90

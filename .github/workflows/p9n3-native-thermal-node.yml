name: P9-N3 official Basilisk thermal node and delivery

on:
  pull_request:
    paths:
      - "src/components/thermal_node/**"
      - "src/sat_sim/adapters/component_thermal_node_native.py"
      - "src/sat_sim/adapters/component_source_native_misc.py"
      - "src/sat_sim/capabilities/component.thermal_node.v1.yaml"
      - "src/sat_sim/capability_backends.py"
      - "src/sat_sim/capability_registry.py"
      - "src/sat_sim/execution_planner.py"
      - "src/sat_sim/parameter_consumption.py"
      - "src/sat_sim/task_compiler.py"
      - "src/sat_sim/task_models.py"
      - "src/sat_sim/task_validator.py"
      - "src/sat_sim/run_bundle.py"
      - "src/sat_sim/form_schema.py"
      - "src/sat_sim/unified_agent.py"
      - "src/sat_sim/api.py"
      - "src/sat_sim/scenario_templates.py"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/workbench_quantity_names.py"
      - "src/sat_sim/workbench_quantity_dictionary_eps_thermal.json"
      - "examples/component_thermal_node_basilisk_native.yaml"
      - "tests/test_native_thermal_node_component.py"
      - "tests/test_capability_backend_profiles.py"
      - "tests/test_thermal_node_*.py"
      - "tests/test_fuel_tank_backend_browser.py"
      - "src/sat_sim/script_exporter.py"
      - "src/sat_sim/capability_agent.py"
      - "tests/test_agent_prompt_contract_closure.py"
      - "src/sat_sim/validation/parameter_surface_audit.py"
      - "tests/test_parameter_surface_audit.py"
      - ".github/workflows/p9n3-native-thermal-node.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-thermal-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install official Basilisk and focused contract/browser dependencies
        run: |
          python -m pip install \
            "bsk==2.11.0" "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" \
            "playwright==1.57.0" "psutil==7.2.2"
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Verify official Basilisk distribution provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          assert Basilisk.__version__ == version("bsk") == "2.11.0"
          print("OFFICIAL_BASILISK_NATIVE", Basilisk.__version__, version("bsk"))
          PY
      - name: Verify native temperatures, input boundaries and sealed Run Bundles
        env:
          PYTHONPATH: "src:."
        run: |
          node --check src/sat_sim/web/app.js
          python -m pytest -q tests/test_native_thermal_node_component.py tests/test_thermal_node_backend_contract.py tests/test_thermal_node_public_inputs.py tests/test_thermal_node_delivery.py tests/test_capability_backend_profiles.py tests/test_fuel_tank_form_input.py tests/test_fuel_tank_legacy_input.py tests/test_component_effect_batch.py tests/test_parameter_surface_audit.py tests/test_agent_prompt_contract_closure.py --disable-warnings
      - name: Verify actual Workbench backend switching and native template projection
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_thermal_node_backend_browser.py --disable-warnings

name: Independent native reaction wheel physical A/B probe

on:
  pull_request:
    paths:
      - "src/sat_sim/bsk_engine/native_rw_component.py"
      - "tests/test_native_rw_component_probe.py"
      - ".github/workflows/native-rw-component-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-basilisk-rw-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install official upstream Basilisk (not project Python physics)
        run: |
          python -m pip install \
            "bsk==2.11.0" "sgp4==2.25" "colorama==0.4.6" \
            "numpy==2.3.5" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "PyYAML==6.0.3" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "pytest==9.0.3" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Report actual distribution provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          assert version("bsk") == "2.11.0"
          print("OFFICIAL_BASILISK_NATIVE", Basilisk.__version__, version("bsk"))
          PY
      - name: Native SWIG RW state/torque/inertia physical A/B
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q -s tests/test_native_rw_component_probe.py

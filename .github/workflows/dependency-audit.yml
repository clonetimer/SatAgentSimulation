name: Weekly dependency audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - "constraints.txt"
      - "configs/security/**"
      - "scripts/check_script_dependency_governance.py"
      - "scripts/scan_dependencies.py"
      - ".github/workflows/dependency-audit.yml"
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install audit tool
        run: python -m pip install --upgrade pip==26.2.1 pip-audit==2.10.1
      - name: Check project governance
        run: >-
          python scripts/check_script_dependency_governance.py
          --strict
          --output reports/security/project_governance_report.json
      - name: Audit locked dependencies
        run: >-
          python scripts/scan_dependencies.py
          --requirements requirements-lock.txt
          --output reports/security/dependency_audit_report.json
          --raw-output reports/security/pip_audit_raw.json
          --fail-on-vulnerability
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: reports/security/*.json

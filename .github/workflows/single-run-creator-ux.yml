name: Single-run creator UX and real Basilisk finite-run regression

on:
  pull_request:
    paths:
      - "src/sat_sim/web/**"
      - "src/sat_sim/api.py"
      - "src/sat_sim/telemetry_overview.py"
      - "tests/interactive/test_finite_telemetry_overview.py"
      - "tests/interactive/test_single_run_creator_ux.py"
      - "tests/test_workbench_wizard.py"
      - "tests/test_conversational_workbench_shell.py"
      - "tests/test_wizard_low_friction_ux.py"
      - "tests/test_compact_graph_toolbar_browser.py"
      - "tests/test_guided_task_workspace_browser.py"
      - "tests/test_p7c_shared_workbench_context.py"
      - "tests/js/shared_context_vm.js"
      - ".github/workflows/single-run-creator-ux.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-workbench-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install real Chromium and workbench dependency slice
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" \
            "playwright==1.57.0" "psutil==7.2.2"
          python -m playwright install chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Test read-only single-run preflight and real browser navigation
        env:
          PYTHONPATH: "src:."
        run: |
          node --check src/sat_sim/web/app.js
          node tests/js/task_history_vm.js
          python -m pytest -q -s tests/test_workbench_wizard.py tests/test_conversational_workbench_shell.py tests/test_parameter_presentation.py tests/test_wizard_low_friction_ux.py tests/test_compact_graph_toolbar_browser.py tests/test_guided_task_workspace_browser.py tests/test_p7c_shared_workbench_context.py tests/interactive/test_single_run_creator_ux.py tests/interactive/test_finite_telemetry_overview.py

  finite-basilisk-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install genuine official Basilisk native runtime
        run: |
          python -m pip install \
            "bsk==2.11.0" "pytest==9.0.3" "numpy==2.3.5" \
            "colorama==0.4.6" "sgp4==2.25" "PyYAML==6.0.3" \
            "pydantic==2.13.4" "jsonschema==4.26.0" \
            "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Prepare and verify offline SPICE WMM and J2 assets
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/fetch_environment_assets.py
          python - <<'PY'
          from sat_sim.bsk_engine.orbital_environment import NativeOrbitalEnvironment
          NativeOrbitalEnvironment(
              {"environment_profile": "spice_wmm", "epoch_utc": "2026-01-01T00:00:00Z"},
              duration_s=2.0,
          )
          print("Strict spice_wmm resource preflight passed; native execution follows.")
          PY
      - name: Verify finite-duration real Basilisk single and segmented outputs
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q \
            tests/interactive/test_unified_segmented_execution.py \
            tests/interactive/test_single_run_creator_ux.py \
            tests/interactive/test_finite_telemetry_overview.py \
            -k 'not browser_path' --disable-warnings

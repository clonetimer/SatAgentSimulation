name: P9-L4 three simulation mode user journeys

on:
  pull_request:
    paths:
      - "src/sat_sim/web/**"
      - "src/sat_sim/api.py"
      - "src/sat_sim/run_bundle.py"
      - "src/sat_sim/interactive/**"
      - "src/sat_sim/telemetry_overview.py"
      - "src/sat_sim/dataset_writer.py"
      - "tests/test_p9c_satellite_scene.py"
      - "tests/test_p9f_native_browser.py"
      - "tests/test_p9l4_offline_native_ui_browser.py"
      - "tests/test_p7d_complete_user_journey.py"
      - "tests/interactive/test_single_run_creator_ux.py"
      - "tests/interactive/test_unified_segmented_execution.py"
      - "docs/superpowers/plans/2026-11-16-p9l4-three-mode-user-journeys.md"
      - "docs/development-experience/p9-browser-acceptance.md"
      - ".github/workflows/p9l4-three-mode-journeys.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9l4-three-mode-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guided-entry-and-dialog:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Chromium and guided-workbench dependencies
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" \
            "playwright==1.57.0"
          python -m playwright install chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Verify guided offline entry, scene task dialog and navigation
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/vendor_scene_assets.py
          python -m pytest -q \
            tests/test_p7d_complete_user_journey.py \
            tests/interactive/test_single_run_creator_ux.py \
            tests/test_p9c_satellite_scene.py

  genuine-basilisk-three-mode-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install genuine Basilisk and native browser dependencies
        run: |
          python -m pip install \
            "bsk==2.11.0" "pytest==9.0.3" "numpy==2.3.5" \
            "colorama==0.4.6" "sgp4==2.25" "PyYAML==6.0.3" \
            "pydantic==2.13.4" "jsonschema==4.26.0" \
            "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" \
            "uvicorn[standard]==0.39.0" "playwright==1.57.0"
          python -m playwright install chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Prepare and verify offline SPICE WMM and J2 resources
        env:
          PYTHONPATH: "src:."
        run: |
          python scripts/fetch_environment_assets.py
          python - <<'PY'
          from sat_sim.bsk_engine.orbital_environment import NativeOrbitalEnvironment
          NativeOrbitalEnvironment(
              {"environment_profile": "spice_wmm", "epoch_utc": "2026-01-01T00:00:00Z"},
              duration_s=2.0,
          )
          print("Native Basilisk environment resource preflight passed.")
          PY
      - name: Stage pinned local Globe.gl and Three.js assets
        run: python scripts/vendor_scene_assets.py
      - name: Execute all genuine Basilisk browser journeys
        env:
          PYTHONPATH: "src:."
          SAT_SIM_P9F_NATIVE_BROWSER_TEST: "1"
          SAT_SIM_P9F_EVIDENCE: "${{ runner.temp }}/p9l4-three-mode-evidence"
          SAT_SIM_P9L4_NATIVE_UI_TEST: "1"
          SAT_SIM_P9L4_EVIDENCE: "${{ runner.temp }}/p9l4-three-mode-evidence/offline-ui"
        run: |
          python -m pytest -q -s \
            tests/test_p9f_native_browser.py \
            tests/test_p9l4_offline_native_ui_browser.py \
            tests/interactive/test_unified_segmented_execution.py
      - name: Preserve three-mode browser and native execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9l4-three-mode-native-browser-evidence
          path: ${{ runner.temp }}/p9l4-three-mode-evidence
          if-no-files-found: ignore

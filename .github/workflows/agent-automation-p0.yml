name: Agent input and run consistency

on:
  pull_request:
    paths:
      - "src/sat_sim/web/**"
      - "src/sat_sim/api.py"
      - "src/sat_sim/agent_tools.py"
      - "src/sat_sim/agent_eval_attribution.py"
      - "src/sat_sim/experience_longitudinal_eval.py"
      - "src/sat_sim/model_router.py"
      - "src/sat_sim/experience_lessons.py"
      - "src/sat_sim/experiment_manager.py"
      - "src/sat_sim/task_source.py"
      - "src/sat_sim/unified_agent.py"
      - "src/sat_sim/canonical_transport.py"
      - "src/sat_sim/task_models.py"
      - "src/sat_sim/task_spec.py"
      - "src/sat_sim/explicit_parameters.py"
      - "src/sat_sim/capability_agent.py"
      - "src/sat_sim/agent_facade.py"
      - "src/sat_sim/form_schema.py"
      - "src/sat_sim/capabilities/**"
      - "src/sat_sim/run_bundle.py"
      - "tests/test_agent_*.py"
      - "tests/test_agent_prompt_contract_closure.py"
      - "tests/test_model_router*.py"
      - "tests/test_model_schema_rejection_repair.py"
      - "tests/test_experience_lessons.py"
      - "tests/test_workbench_agent_refinement_browser.py"
      - "tests/test_task_source_binding.py"
      - "tests/test_explicit_*.py"
      - "tests/test_refinement_*.py"
      - "tests/test_natural_language_refinement.py"
      - "tests/test_canonical_transport*.py"
      - "tests/test_task_center.py"
      - "tests/test_run_bundle_seal_binding.py"
      - "tests/fixtures/form_projection/**"
      - "pyproject.toml"
      - "tests/js/**"
      - ".github/workflows/agent-automation-p0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned control-plane and browser test dependencies
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" \
            "playwright==1.57.0" "psutil==7.2.2"
          python -m playwright install --with-deps chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Verify actual JavaScript flow, API receipts and refinement contracts
        env:
          PYTHONPATH: "src:."
        run: |
          node --check src/sat_sim/web/app.js
          python -m pytest -q \
            tests/test_agent_pending_input_vm.py \
            tests/test_agent_experiment_tools.py \
            tests/test_agent_eval_attribution.py \
            tests/test_agent_prompt_contract_closure.py \
            tests/test_workbench_agent_integration.py \
            tests/test_experience_lessons.py \
            tests/test_model_router_calibration.py \
            tests/test_model_schema_rejection_repair.py \
            tests/test_task_source_binding.py \
            tests/test_explicit_optional_parameter_refinement.py \
            tests/test_canonical_transport.py \
            tests/test_canonical_transport_api.py \
            tests/test_task_center.py \
            tests/test_run_bundle_seal_binding.py \
            tests/test_natural_language_refinement.py \
            tests/test_refinement_transaction.py \
            tests/test_explicit_user_parameter_contract.py \
            tests/test_explicit_parameter_output_guards.py \
            tests/test_refinement_units_and_intent.py \
            tests/test_refinement_negated_clauses_and_dimensions.py \
            tests/test_refinement_event_preservation.py \
            --junitxml=reports/agent-automation-contracts.xml
      - name: Exercise public Agent and Run controls in real Chromium
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q \
            tests/test_agent_pending_input_browser.py \
            tests/test_agent_run_generation_ownership_browser.py \
            tests/test_agent_generation_responsiveness_browser.py \
            tests/test_workbench_agent_refinement_browser.py \
            --junitxml=reports/agent-automation-browser.xml
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-automation-regression
          path: reports/agent-automation-*.xml

name: P9-N2 independent Basilisk sensor graphs

on:
  pull_request:
    paths:
      - "src/sat_sim/bsk_engine/native_sensor_component.py"
      - "src/components/imu/builder.py"
      - "src/components/star_tracker/builder.py"
      - "tests/test_native_sensor_component.py"
      - ".github/workflows/p9n2-native-sensors.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sensor-graphs:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned official Basilisk and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bsk==2.11.0" "numpy==2.3.5" "pytest==9.0.3"
      - name: Verify official Basilisk distribution provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          assert Basilisk.__version__ == "2.11.0"
          assert version("bsk") == "2.11.0"
          print("OFFICIAL_BASILISK_NATIVE", Basilisk.__version__, version("bsk"))
          PY
      - name: Execute independent native IMU and star tracker truth graphs
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_native_sensor_component.py --disable-warnings

name: P9 ownership and independent evaluation contracts

on:
  pull_request:
    paths:
      - "src/sat_sim/workbench_*.py"
      - "src/sat_sim/workbench_quantity_dictionary_*.json"
      - "src/sat_sim/performance_evaluation.py"
      - "src/sat_sim/web/object-workspace.js"
      - "tests/test_p9a_*.py"
      - "tests/js/object_workspace_vm.js"
      - "pyproject.toml"
      - ".github/workflows/p9a-evaluation-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Archive exact test source without credentials or runtime data
        run: |
          mkdir -p /tmp/p9-test-source
          git rev-parse HEAD > /tmp/p9-test-source/COMMIT.txt
          git archive --format=tar HEAD src tests scripts configs .github pyproject.toml README.md constraints.txt | gzip > /tmp/p9-test-source/source.tar.gz
          sha256sum /tmp/p9-test-source/source.tar.gz > /tmp/p9-test-source/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: p9-test-source
          path: /tmp/p9-test-source/
          retention-days: 3
  contracts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install contract test dependencies
        run: python -m pip install "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Verify new P9 ownership and evaluation tests
        run: python -m pytest -q tests/test_p9a_object_tree_quantities.py tests/test_p9a_evaluation_boundary.py

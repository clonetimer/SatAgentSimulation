capability_id: whole_spacecraft.comm_payload_mission_coupled.v1
schema_version: 0.1.0
name: Route-B communication/payload mission-coupled spacecraft model
level: whole_spacecraft
domain: whole_spacecraft
target: comm_payload_mission_coupled
trust_level: conformance_tested
status: agent_ready_candidate
summary: HF-6 medium-fidelity Route-B mission coupling of payload data generation, onboard storage, HF-3 ground access, transmitter
  downlink, and compact EPS power constraint. It is not a high-fidelity RF/contact-planning model.
adapter:
  class_path: sat_sim.adapters.whole_spacecraft_comm_payload_mission_coupled.CommPayloadMissionCoupledAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules:
  - sat_sim.coupled.comm_payload_mission
  - sat_sim.orbit.medium
  - sat_sim.time_systems
  - sat_sim.frames
  - sat_sim.state
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  mixed:
    supported: true
  degradation:
    supported: true
scope_exclusions:
- high_fidelity_rf_propagation
- doppler
- adaptive_coding_modulation
- multi_station_contact_planning
- antenna_pointing_dynamics
- payload_observation_geometry
dependencies:
- capability_id: orbit_environment.medium_fidelity.v1
  role: child
  alias: orbit_environment
  required: true
parameters:
  payload_data_rate_bps:
    type: number
    unit: bit/s
    required: false
    min: 0.0
    default: 2000000.0
  storage_capacity_bits:
    type: number
    unit: bit
    required: false
    min: 1.0
    default: 8000000000.0
  initial_stored_bits:
    type: number
    unit: bit
    required: false
    min: 0.0
    default: 1000000000.0
  downlink_rate_bps:
    type: number
    unit: bit/s
    required: false
    min: 0.0
    default: 12000000.0
  transmitter_power_w:
    type: number
    unit: W
    required: false
    min: 0.0
    default: 18.0
  payload_power_w:
    type: number
    unit: W
    required: false
    min: 0.0
    default: 35.0
  battery_capacity_wh:
    type: number
    unit: Wh
    required: false
    min: 1.0e-06
    default: 180.0
  initial_soc:
    type: number
    unit: ratio
    required: false
    min: 0.0
    max: 1.0
    default: 0.75
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
consumes:
- name: simulation.duration_s
  unit: s
- name: simulation.sample_s
  unit: s
- name: orbit_environment.ground_station
  unit: object
- name: parameters.payload_data_rate_bps
  unit: bit/s
- name: parameters.storage_capacity_bits
  unit: bit
- name: parameters.downlink_rate_bps
  unit: bit/s
- name: parameters.transmitter_power_w
  unit: W
produces:
- name: payload.generated_bits_step
- name: storage.stored_bits
- name: ground.has_access
- name: comm.downlinked_bits_step
- name: eps.battery.soc
- name: coupled.data.conservation_error_bits
time_grid:
  policy: shared_hf1_time_grid
  source: simulation
  duration_field: simulation.duration_s
  sample_field: simulation.sample_s
composition:
  chain:
  - capability_id: whole_spacecraft.comm_payload_mission_coupled.v1
    role: parent
  - capability_id: orbit_environment.medium_fidelity.v1
    role: child
    alias: orbit_environment
  field_mappings:
  - source: payload.generated_bps
    target: storage.stored_bits
    description: Payload generation increases storage backlog.
  - source: orbit_environment.trace.ground.has_access
    target: comm.transmitter.active
    description: Ground access gates downlink.
  - source: comm.transmitter.active
    target: eps.loads.requested.comm_w
    description: Active downlink adds EPS load.
  - source: eps.battery.soc
    target: mission.payload/downlink enable flags
    description: Low SOC can disable payload/downlink.
  - source: generated/downlinked/stored/overflow data
    target: coupled.data.conservation_error_bits
    description: Data conservation accounting.
  required_trace_fields:
  - spacecraft.time_s
  - ground.has_access
  - payload.generated_bits_step
  - comm.downlinked_bits_step
  - storage.stored_bits
  - coupled.data.conservation_error_bits
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
    description: 仿真时间轴。
  - name: spacecraft.time_s
    unit: s
    dtype: number
    description: 航天器时间时间。运行器实际输出字段；技术字段为 spacecraft.time_s，单位 s。
  - name: orbit.r_bn_n_m_x
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离X轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_x。
  - name: orbit.r_bn_n_m_y
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离Y轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_y。
  - name: orbit.r_bn_n_m_z
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离Z轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_z。
  - name: orbit.radius_m
    unit: m
    dtype: number
    description: 轨道轨道半径距离。运行器实际输出字段；技术字段为 orbit.radius_m，单位 m。
  - name: orbit.altitude_m
    unit: m
    dtype: number
    description: 轨道高度距离。运行器实际输出字段；技术字段为 orbit.altitude_m，单位 m。
  - name: environment.shadow_factor
    unit: ratio
    dtype: number
    description: 环境阴影系数。运行器实际输出字段；技术字段为 environment.shadow_factor，单位 ratio。
  - name: environment.eclipse_flag
    unit: bool
    dtype: number
    description: 环境食标志。运行器实际输出字段；技术字段为 environment.eclipse_flag，单位 bool。
  - name: ground.range_m
    unit: m
    dtype: number
    description: 地面站距离距离。运行器实际输出字段；技术字段为 ground.range_m，单位 m。
  - name: ground.elevation_deg
    unit: deg
    dtype: number
    description: 地面站仰角度。运行器实际输出字段；技术字段为 ground.elevation_deg，单位 deg。
  - name: ground.has_access
    unit: bool
    dtype: bool
    description: 地面站可见。运行器实际输出字段；技术字段为 ground.has_access，单位 bool。
  - name: payload.enabled
    unit: bool
    dtype: number
    description: 载荷启用。运行器实际输出字段；技术字段为 payload.enabled，单位 bool。
  - name: payload.generated_bps
    unit: bit/s
    dtype: number
    description: 载荷已生成比特率。运行器实际输出字段；技术字段为 payload.generated_bps，单位 bit/s。
  - name: payload.generated_bits_step
    unit: bit
    dtype: number
    description: 载荷已生成比特单步。运行器实际输出字段；技术字段为 payload.generated_bits_step，单位 bit。
  - name: payload.power_w
    unit: W
    dtype: number
    description: 载荷功率功率。运行器实际输出字段；技术字段为 payload.power_w，单位 W。
  - name: comm.transmitter.active
    unit: bool
    dtype: number
    description: 通信激活。运行器实际输出字段；技术字段为 comm.transmitter.active，单位 bool。
  - name: comm.downlink_rate_bps
    unit: bit/s
    dtype: number
    description: 通信下行角速度比特率。运行器实际输出字段；技术字段为 comm.downlink_rate_bps，单位 bit/s。
  - name: comm.downlinked_bits_step
    unit: bit
    dtype: number
    description: 通信已下行比特单步。运行器实际输出字段；技术字段为 comm.downlinked_bits_step，单位 bit。
  - name: comm.power_w
    unit: W
    dtype: number
    description: 通信功率功率。运行器实际输出字段；技术字段为 comm.power_w，单位 W。
  - name: storage.stored_bits
    unit: bit
    dtype: number
    description: 储能已存储比特。运行器实际输出字段；技术字段为 storage.stored_bits，单位 bit。
  - name: storage.next_stored_bits
    unit: bit
    dtype: number
    description: 储能已存储比特。运行器实际输出字段；技术字段为 storage.next_stored_bits，单位 bit。
  - name: storage.capacity_bits
    unit: bit
    dtype: number
    description: 储能容量比特。运行器实际输出字段；技术字段为 storage.capacity_bits，单位 bit。
  - name: storage.fill_fraction
    unit: ratio
    dtype: number
    description: 储能填充比例。运行器实际输出字段；技术字段为 storage.fill_fraction，单位 ratio。
  - name: storage.overflow_bits_step
    unit: bit
    dtype: number
    description: 储能溢出比特单步。运行器实际输出字段；技术字段为 storage.overflow_bits_step，单位 bit。
  - name: eps.solar.array_power_w
    unit: W
    dtype: number
    description: 能源太阳阵列阵列功率功率。运行器实际输出字段；技术字段为 eps.solar.array_power_w，单位 W。
  - name: eps.loads.requested.bus_w
    unit: W
    dtype: number
    description: 能源负载请求平台母线功率。运行器实际输出字段；技术字段为 eps.loads.requested.bus_w，单位 W。
  - name: eps.loads.requested.payload_w
    unit: W
    dtype: number
    description: 能源负载请求载荷功率。运行器实际输出字段；技术字段为 eps.loads.requested.payload_w，单位 W。
  - name: eps.loads.requested.comm_w
    unit: W
    dtype: number
    description: 能源负载请求通信功率。运行器实际输出字段；技术字段为 eps.loads.requested.comm_w，单位 W。
  - name: eps.loads.requested_power_w
    unit: W
    dtype: number
    description: 能源负载请求功率功率。运行器实际输出字段；技术字段为 eps.loads.requested_power_w，单位 W。
  - name: eps.battery.soc
    unit: ratio
    dtype: number
    description: 能源电池荷电状态。运行器实际输出字段；技术字段为 eps.battery.soc，单位 ratio。
  - name: eps.battery.storage_wh
    unit: Wh
    dtype: number
    description: 能源电池储能能量。运行器实际输出字段；技术字段为 eps.battery.storage_wh，单位 Wh。
  - name: eps.power.margin_w
    unit: W
    dtype: number
    description: 能源功率裕度功率。运行器实际输出字段；技术字段为 eps.power.margin_w，单位 W。
  - name: coupled.data.generated_bits_total_if_applied
    unit: mixed
    dtype: number
    description: 数据已生成比特总实际施加。运行器实际输出字段；技术字段为 coupled.data.generated_bits_total_if_applied。
  - name: coupled.data.downlinked_bits_total_if_applied
    unit: mixed
    dtype: number
    description: 数据已下行比特总实际施加。运行器实际输出字段；技术字段为 coupled.data.downlinked_bits_total_if_applied。
  - name: coupled.data.conservation_error_bits
    unit: bit
    dtype: number
    description: 数据守恒误差比特。运行器实际输出字段；技术字段为 coupled.data.conservation_error_bits，单位 bit。
  - name: label.access_active
    unit: bool
    dtype: number
    description: 状态标签可见激活。运行器实际输出字段；技术字段为 label.access_active，单位 bool。
  - name: label.downlink_active
    unit: bool
    dtype: number
    description: 状态标签下行激活。运行器实际输出字段；技术字段为 label.downlink_active，单位 bool。
  summary:
  - name: qoi.mission.data.generated_bits
    unit: bit
  - name: qoi.mission.data.downlinked_bits
    unit: bit
  - name: qoi.mission.data.conservation_error_bits
    unit: bit
source_binding:
  mode: route_b_model_library
  status: hf6_medium_mission_coupled_model_library
  primary_module: sat_sim.coupled.comm_payload_mission
  source_modules:
  - sat_sim.coupled.comm_payload_mission
  - sat_sim.orbit.medium
  - sat_sim.time_systems
  - sat_sim.frames
  - sat_sim.state
  public_api:
  - CommPayloadMissionCoupledAdapter.run
  - propagate_comm_payload_mission_coupled
  - summarize_comm_payload_mission_coupled
  - build_hf6_comm_payload_mission_payload
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
  rationale: Route-B HF-6 mission-coupled model library, not a legacy demo runner.
fidelity_level: medium
known_physics_limits:
- downlink is a constant-rate proxy, not high-fidelity RF propagation
- no Doppler, adaptive coding, weather loss, antenna pointing dynamics, or contact-plan optimizer
- EPS power is compact energy accounting, not a full electrical network
- HF-8 validation gates and HF-9 benchmark envelopes are pending
allowed_task_spec_sections:
- schema_version
- task_id
- task_type
- capability_id
- target
- simulation
- parameters
- spacecraft
- orbit_environment
- validation
- outputs
- metadata
- tags
lifecycle:
  status: active
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: Active product capability.
backend_type: local_physics_proxy
validation_basis: &id001
- internal_benchmark
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: local_physics_proxy
  basilisk_required: false
  current_agent_path_uses_basilisk: false
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/sat_sim/orbit/basilisk_hf.py
  validation_basis: *id001
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim flight validation, hardware calibration, or high-fidelity equivalence without external validation
    evidence.
  bsk0_notes: Source tree contains Basilisk-facing candidate modules, but this Agent capability does not currently require
    or guarantee Basilisk-native execution.
  planned_upgrade_path: []
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: project_deterministic_model
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - high_fidelity_rf_propagation
  - doppler
  - adaptive_coding_modulation
  - multi_station_contact_planning
  - antenna_pointing_dynamics
  - payload_observation_geometry
  - downlink is a constant-rate proxy, not high-fidelity RF propagation
  - no Doppler, adaptive coding, weather loss, antenna pointing dynamics, or contact-plan optimizer
  - EPS power is compact energy accounting, not a full electrical network
  - HF-8 validation gates and HF-9 benchmark envelopes are pending

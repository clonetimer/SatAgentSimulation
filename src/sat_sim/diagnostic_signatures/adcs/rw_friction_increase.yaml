schema_version: sat-sim.diagnostic-signature.v1
signature_id: adcs.rw_friction_increase.diagnostic.v1
fault_id: ADCS_RW_FRICTION_INCREASE
source_experiment_template_id: adcs.rw_friction_increase.basilisk.v1
required_channels:
- estimate.adcs.rw.friction_torque_nm_0
- sensor.adcs.rw.speed_rad_s_0
- estimate.adcs.pointing_error_deg
criteria:
- criterion_id: friction_level_shift
  channel: estimate.adcs.rw.friction_torque_nm_0
  metric: post_fault_mean_minus_nominal_gt
  threshold: 1.0e-06
  weight: 0.0
  required: true
  evidence_role: simulator_truth
  contributes_to_diagnostic_score: false
- criterion_id: wheel_speed_response
  channel: sensor.adcs.rw.speed_rad_s_0
  metric: post_pair_rms_delta_gt
  threshold: 1.0e-07
  weight: 0.7
  required: true
  evidence_role: observable_telemetry
  contributes_to_diagnostic_score: true
- criterion_id: applied_torque_response
  channel: estimate.adcs.rw.actual_torque_nm_0
  metric: post_pair_rms_delta_gt
  threshold: 1.0e-08
  weight: 0.15
  required: false
  evidence_role: operational_estimate
  contributes_to_diagnostic_score: true
- criterion_id: pointing_response
  channel: estimate.adcs.pointing_error_deg
  metric: post_pair_max_abs_delta_gt
  threshold: 1.0e-07
  weight: 0.15
  required: false
  evidence_role: operational_estimate
  contributes_to_diagnostic_score: true
qualification:
  minimum_diagnostic_score: 0.65
  require_all_required_criteria: true
  minimum_observable_criteria_passed: 1
  threshold_status: provisional_until_basilisk_18_case
  minimum_independent_basilisk_pairs_for_freeze: 3
claim_boundary:
  flight_calibrated: false
  threshold_freeze_requires_basilisk_18_case: true

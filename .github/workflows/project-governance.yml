name: Project script and dependency governance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "constraints.txt"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check script and dependency governance
        run: >-
          python scripts/check_script_dependency_governance.py
          --strict
          --output reports/security/project_governance_report.json
      - name: Upload governance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-governance
          path: reports/security/project_governance_report.json

name: R84-R2 multipulse multifeature native IMU observability

on:
  pull_request:
    paths:
      - "configs/research/r84r2_multipulse_multifeature_observability_prereg.json"
      - "docs/R84R2_MULTIPULSE_MULTIFEATURE_OBSERVABILITY_PREREG_20261106.md"
      - "src/sat_sim/experiments/native_imu_rw_observability_r84r2.py"
      - "scripts/run_r84r2_multipulse_multifeature_observability.py"
      - "scripts/audit_r83m_native_archive.py"
      - "scripts/build_bsk_compat_wheels.py"
      - "tests/test_r84r2_multipulse_multifeature_contract.py"
      - "scripts/SCRIPT_INVENTORY.md"
      - ".github/workflows/r84r2-multipulse-multifeature.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prereg-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned project and contract-test dependencies
        run: |
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1"
          python -m pip install -e . --no-deps
      - name: Validate R84-R2 frozen design, seeds and multi-feature contracts
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q tests/test_r84r2_multipulse_multifeature_contract.py
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("configs/research/r84r2_multipulse_multifeature_observability_prereg.json").read_text())
          assert p["status"] == "PREREGISTERED_NOT_EXECUTED"
          assert p["frozen_replication_design"]["unique_native_runs"] == 2862
          assert p["frozen_replication_design"]["total_native_executions"] == 2863
          print("R84R2_PREREGISTRATION_FROZEN")
          PY

  native-r84r2:
    needs: prereg-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create pinned native runtime and evidence directories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/r84r2/wheel" "$RUNNER_TEMP/r84r2/compat" \
            "$RUNNER_TEMP/r84r2/r84r1-reference" "$RUNNER_TEMP/r84r2/evidence"
      - name: Download and verify the exact original R83m Basilisk upstream wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m pip download --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/r84r2/wheel" "bsk==2.11.0"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          wheels = list((Path(os.environ["RUNNER_TEMP"]) / "r84r2/wheel").glob("bsk-2.11.0-*.whl"))
          expected = "d51fe1ffa1b0b03dc415034b210497b28a2504428d4d8e71b481542a08c08a0a"
          if len(wheels) != 1 or hashlib.sha256(wheels[0].read_bytes()).hexdigest() != expected:
              raise RuntimeError("R84R2_ORIGINAL_BASILISK_WHEEL_SHA256_MISMATCH")
          print("R84R2_ORIGINAL_BASILISK_WHEEL_SHA256", expected)
          PY
      - name: Build metadata-only satfix2 compatibility wheel and prove native payload unchanged
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_bsk_compat_wheels.py \
            "$RUNNER_TEMP"/r84r2/wheel/bsk-2.11.0-*.whl \
            --output-dir "$RUNNER_TEMP/r84r2/compat" \
            --report "$RUNNER_TEMP/r84r2/evidence/compat_payload_review.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "r84r2/evidence/compat_payload_review.json").read_text())
          result = report["results"][0]
          if not result["payload_bytes_unchanged"] or result["payload_file_count"] != 880:
              raise RuntimeError("R84R2_BASILISK_METADATA_PATCH_CHANGED_NATIVE_PAYLOAD")
          print("R84R2_BASILISK_NATIVE_PAYLOAD_FILES", result["payload_file_count"])
          PY
      - name: Install pinned native Basilisk runtime and project source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$RUNNER_TEMP"/r84r2/compat/bsk-2.11.0+satfix2-*.whl
          python -m pip install \
            "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" \
            "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "psutil==7.2.2" "numba==0.63.1"
          python -m pip install -e . --no-deps
          python - <<'PY'
          from importlib.metadata import version
          import Basilisk
          from Basilisk.simulation import spacecraft, reactionWheelStateEffector, imuSensor, simpleNav
          from Basilisk.fswAlgorithms import inertial3D, attTrackingError, mrpFeedback, rwMotorTorque
          assert version("bsk") == "2.11.0+satfix2"
          print("R84R2_NATIVE_BASILISK_DISTRIBUTION", version("bsk"))
          print("R84R2_BASILISK_MODULE_VERSION", Basilisk.__version__)
          PY
      - name: Download immutable R84-R1 evidence artifact and verify nested references
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/clonetimer/SatAgentSimulation/actions/artifacts/13498019393/zip" \
            -o "$RUNNER_TEMP/r84r2/r84r1-reference.zip"
          echo "4bc1f9d0f788dce5e8d33aace1fe8860d739158793bcf6fae28352c785742a8e  $RUNNER_TEMP/r84r2/r84r1-reference.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/r84r2/r84r1-reference.zip" -d "$RUNNER_TEMP/r84r2/r84r1-reference"
          test -f "$RUNNER_TEMP/r84r2/r84r1-reference/source/r83m-original.zip"
          echo "db83c8b50a833d2f9c5074cb3f6f9d44c8e0109a2a7be4ddcec5f70bff754796  $RUNNER_TEMP/r84r2/r84r1-reference/source/r83m-original.zip" | sha256sum --check -
          echo "5d1439272f651519fec011d9728165f3afc46b1b3d14d305357ae271b26752af  $RUNNER_TEMP/r84r2/r84r1-reference/source/r84-r0-reference.zip" | sha256sum --check -
      - name: Execute 2,862 unique 18-second native runs and one exact replay
        env:
          PYTHONPATH: "src:."
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_r84r2_multipulse_multifeature_observability.py \
            --r83m-archive "$RUNNER_TEMP/r84r2/r84r1-reference/source/r83m-original.zip" \
            --r84r1-artifact "$RUNNER_TEMP/r84r2/r84r1-reference.zip" \
            --output-dir "$RUNNER_TEMP/r84r2/evidence"
      - name: Verify complete R84-R2 evidence and physical source comparisons
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "r84r2/evidence"
          manifest = json.loads((root / "r84r2_execution_manifest.json").read_text())
          analysis = json.loads((root / "r84r2_multifeature_observability_analysis.json").read_text())
          def lines(name):
              return sum(1 for line in (root / name).open(encoding="utf-8") if line.strip())
          assert manifest["status"] == "PASS"
          assert manifest["unique_native_run_count"] == 2862
          assert manifest["unique_rng_seed_count"] == 2862
          assert manifest["native_execution_count_including_replay"] == 2863
          assert manifest["physical_comparison_count_including_replay"] == 2863
          assert manifest["r83m_first_six_second_comparison_count"] == 36
          assert manifest["max_abs_physics_delta_to_noise_free_baselines"] <= 1e-8
          assert all(manifest["checks"].values())
          assert lines("r84r2_sensor_observations.jsonl") == 2863
          assert lines("r84r2_case_manifest.jsonl") == 2863
          assert lines("r84r2_physics_qa.jsonl") == 2863
          assert lines("r84r2_features.jsonl") == 2862
          assert analysis["primary_context_count"] == 18
          assert analysis["sensitivity_context_count"] == 36
          assert manifest["diagnostic_model_trained"] is False
          assert manifest["formal_training_or_test_eligible"] is False
          for name in (
              "r83m-original.zip", "r83m-original.sha256",
              "r84r1-reference.zip", "r84r1-reference.sha256",
              "r84-r0-reference.zip", "r84-r0-reference.sha256",
          ):
              assert (root / "source" / name).is_file()
          print("R84R2_NATIVE_MULTIPULSE_MULTIFEATURE_PASS", manifest["checks"])
          PY
          (cd "$RUNNER_TEMP/r84r2/evidence/source" && sha256sum --check r83m-original.sha256)
          (cd "$RUNNER_TEMP/r84r2/evidence/source" && sha256sum --check r84r1-reference.sha256)
          (cd "$RUNNER_TEMP/r84r2/evidence/source" && sha256sum --check r84-r0-reference.sha256)
      - name: Upload R84-R2 native observations, full QA and failure receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r84r2-multipulse-multifeature-native-observability
          path: ${{ runner.temp }}/r84r2/evidence/
          if-no-files-found: warn
          retention-days: 90

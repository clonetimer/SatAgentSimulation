name: P9-G default entry convergence
on:
  pull_request:
    paths:
      - "src/sat_sim/web/**"
      - "tests/js/test_p9g_navigation.cjs"
      - "tests/test_p9g_navigation_browser.py"
      - "tests/interactive/test_continuous_console_browser.py"
      - "tests/test_graph_editor_containment_browser.py"
      - "tests/test_p8_local_acceptance_ux_contracts.py"
      - "docs/superpowers/plans/2026-11-14-p9g-default-entry-convergence.md"
      - ".github/workflows/p9g-navigation.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p9g-navigation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  navigation-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify primary navigation, V15 route and legacy reachability
        run: node --test tests/js/test_p9g_navigation.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Capture exact tracked source and offline acceptance dependencies
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/p9g-reproduction/wheels"
          git rev-parse HEAD > "$RUNNER_TEMP/p9g-reproduction/commit.txt"
          git archive --format=zip --output="$RUNNER_TEMP/p9g-reproduction/source.zip" HEAD
          python -m pip download --only-binary=:all: --no-deps --dest "$RUNNER_TEMP/p9g-reproduction/wheels" "sgp4==2.25" "colorama==0.4.6"
          cd "$RUNNER_TEMP/p9g-reproduction"
          sha256sum source.zip wheels/* > SHA256SUMS
      - name: Preserve reproducible source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9g-reproduction-source
          path: ${{ runner.temp }}/p9g-reproduction
          retention-days: 7
          if-no-files-found: error
  chromium-user-journeys:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install browser and API dependencies
        run: >-
          python -m pip install
          "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0"
          "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6"
          "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0"
          "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
          "playwright==1.57.0"
      - name: Install and verify Chinese screenshot font coverage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-match -f '%{family}\n' 'sans:lang=zh-cn' | tee "$RUNNER_TEMP/p9g-font-family.txt"
          grep -q 'Noto Sans CJK' "$RUNNER_TEMP/p9g-font-family.txt"
      - name: Install offline scene assets and Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/p9g-browser"
          cp "$RUNNER_TEMP/p9g-font-family.txt" "$RUNNER_TEMP/p9g-browser/font-family.txt"
          python scripts/vendor_scene_assets.py
          python -m playwright install chromium
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Verify real browser professional modeling and user journeys
        env:
          PYTHONPATH: "src:."
          SAT_SIM_P9G_EVIDENCE: "${{ runner.temp }}/p9g-browser"
        run: >-
          python -m pytest -q
          tests/test_p9g_navigation_browser.py
          tests/test_compact_graph_toolbar_browser.py
          tests/test_graph_editor_containment_browser.py
          tests/test_p7d_complete_user_journey.py
          tests/test_p7c_shared_workbench_context.py
          tests/test_p7c_c2_run_navigation.py
          tests/test_p8_local_acceptance_ux_contracts.py
          --basetemp=${{ runner.temp }}/p9g-browser/pytest
          --junitxml=${{ runner.temp }}/p9g-browser/junit.xml
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9g-browser-acceptance
          path: ${{ runner.temp }}/p9g-browser
          if-no-files-found: error

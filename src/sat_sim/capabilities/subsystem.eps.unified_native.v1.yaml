capability_id: subsystem.eps.unified_native.v1
schema_version: 0.1.0
name: EPS unified Basilisk runtime
level: subsystem
domain: eps
target: eps
trust_level: engineering_preview
status: agent_ready_candidate
summary: Focused EPS subsystem executed with Basilisk battery, solar/power-node, power-sink and recorder modules plus project-owned
  PDU request/load-shedding SysModels in one Process/Task. No external solver or curve-only proxy is used.
adapter:
  class_path: sat_sim.adapters.subsystem_eps_unified_native.EpsUnifiedNativeAdapter
  script_export: true
  runtime_run: true
implementation:
  native_multi_rate_telemetry: true
  model_modules:
  - subsystems.eps.builder
  - subsystems.eps.runner
  - sat_sim.adapters.subsystem_eps_unified_native
  uses_legacy_runner: false
  basilisk_required: true
  source_boundary: official_basilisk_eps_modules_plus_project_pdu_control
  mode: basilisk_unified_native_eps
  backend_type: basilisk_native_mixed
  accepted_task_backends:
  - basilisk
  requires_allow_proxy: false
  modifier_application: native_runtime_only
modes:
  nominal:
    supported: true
  fault:
    supported: true
    fault_types: [generation_storage_distribution_failure]
  degradation:
    supported: true
    degradation_types: [energy_margin_degradation]
parameters:
  battery_capacity_wh:
    type: number
    unit: Wh
    required: false
    default: 160.0
    min: 0.1
  initial_soc:
    type: number
    unit: '1'
    required: false
    default: 0.62
    min: 0.0
    max: 1.0
  solar_power_w:
    type: number
    unit: W
    required: false
    default: 95.0
    min: 0.0
  solar_efficiency:
    type: number
    unit: '1'
    required: false
    default: 0.25
    min: 0.0
    max: 1.0
  bus_power_w:
    type: number
    unit: W
    required: false
    default: 18.0
    min: 0.0
  payload_power_w:
    type: number
    unit: W
    required: false
    default: 38.0
    min: 0.0
  adcs_power_w:
    type: number
    unit: W
    required: false
    default: 20.0
    min: 0.0
  comm_power_w:
    type: number
    unit: W
    required: false
    default: 12.0
    min: 0.0
  payload_min_soc:
    type: number
    unit: '1'
    required: false
    default: 0.55
    min: 0.0
    max: 1.0
  comm_min_soc:
    type: number
    unit: '1'
    required: false
    default: 0.5
    min: 0.0
    max: 1.0
consumes:
- name: simulation.duration_s
  unit: s
- name: simulation.step_s
  unit: s
- name: parameters.initial_soc
  unit: '1'
produces:
- name: eps.*
- name: runtime_truth_status
time_grid:
  policy: task_spec_simulation_grid
  source: simulation
  duration_field: simulation.duration_s
  sample_field: simulation.sample_s
outputs:
  trace_fields:
  - time_s
  - eps.battery_storage_j
  - eps.battery_capacity_j
  - eps.battery_soc
  - eps.solar_power_w
  - eps.bus_load_w
  - eps.payload_load_enabled_w
  - eps.adcs_load_enabled_w
  - eps.comm_load_enabled_w
  - eps.net_power_w
  - eps.load_shed_active
  qoi:
  - runtime_truth_status
  - final_soc
  - load_shed_event_count
  - official_module_count
  - project_native_module_count
operator:
  owner: unified_native_eps
  effects:
  - effect_id: nominal
    kind: nominal
    owner: unified_native_eps
    implementation: basilisk_native
    evidence_fields:
    - eps.battery_soc
    - eps.solar_power_w
    - eps.net_power_w
    verification: declared
  - effect_id: generation_storage_distribution_failure
    kind: fault
    owner: unified_native_eps
    implementation: basilisk_native
    evidence_fields:
    - eps.battery_capacity_j
    - eps.solar_power_w
    - eps.net_power_w
    - label.fault_active
    verification: declared
  - effect_id: energy_margin_degradation
    kind: degradation
    owner: unified_native_eps
    implementation: basilisk_native
    evidence_fields:
    - eps.battery_capacity_j
    - eps.solar_power_w
    - eps.net_power_w
    - label.degradation_active
    verification: declared
  limitations:
  - Runtime fault and degradation effects use governed EPS aggregate scenarios and do not claim arbitrary electrical faults.
  - PDU control is project-native and parameters are engineering estimates.
lifecycle:
  status: active
  product_tier: recommended
  recommended: true
  replacement: subsystem.eps.source_native.v1
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
backend_type: basilisk_native_mixed
can_claim_high_fidelity: false
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: mixed_native_project
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations: []
model_projection:
  schema_version: sat-sim.capability-projection.v1
  projection_id: eps-unified-native-projection-v1
  model_ref: subsystem.eps_unified_native@1
  graph_ref: subsystem.eps_unified_native@1
  operations_object_ref: spacecraft.eps
  parameter_set_id: eps-unified-native-demo-v1
  implementation_id: subsystem.eps_unified_native.basilisk@1
  binding_set_id: eps-unified-native-bindings-v1
  generated_schemas: sat_sim.a5r.projection_api.projection_schema_bundle
  exposed_properties:
  - spacecraft.eps.soc
  - spacecraft.eps.power_balance_w
  - spacecraft.eps.load_shed_state
  exposed_actions: []
  exposed_effects:
  - spacecraft.eps.nominal
  - spacecraft.eps.generation_storage_distribution_failure
  - spacecraft.eps.energy_margin_degradation
  evidence:
  - spacecraft.eps.soc_evidence
execution:
  schema_version: sat-sim.model-asset-execution-policy.v1
  adapter_key: basilisk.eps_unified_graph
  model_ref: subsystem.eps_unified_native@1
  implementation_id: subsystem.eps_unified_native.basilisk@1
  parameter_set_id: eps-unified-native-demo-v1
  binding_set_id: eps-unified-native-bindings-v1
  legacy_fallback_adapter_key: legacy.capability
  legacy_fallback_enabled: false

name: Continuous satellite native Basilisk tests

on:
  pull_request:
    paths:
      - "src/sat_sim/bsk_engine/unified_native.py"
      - "src/sat_sim/interactive/**"
      - "tests/interactive/test_continuous_session.py"
      - "tests/interactive/test_continuous_persistence.py"
      - "tests/interactive/test_continuous_seal.py"
      - "tests/interactive/test_native_checkpoint_audit.py"
      - "tests/interactive/test_native_recovery_readiness.py"
      - "tests/interactive/test_native_state_pilot.py"
      - "tests/interactive/test_native_scheduler_pilot.py"
      - "tests/interactive/test_native_multitask_pilot.py"
      - "tests/interactive/test_native_multiprocess_pilot.py"
      - "tests/interactive/test_native_closed_loop_checkpoint.py"
      - "tests/interactive/test_native_whole_state_import_lab.py"
      - "tests/interactive/test_native_whole_clock_fsw_lab.py"
      - "tests/interactive/test_native_whole_first_tick_diagnostics.py"
      - "tests/interactive/test_native_whole_rw_ablation.py"
      - "tests/interactive/test_native_whole_held_command_ablation.py"
      - "tests/interactive/test_native_battery_reset_barrier.py"
      - "tests/interactive/test_basilisk211_battery_source_contract.py"
      - "scripts/apply_basilisk211_battery_checkpoint.py"
      - "tests/interactive/test_native_rw_fault_checkpoint.py"
      - "tests/interactive/test_native_tc_reconciliation.py"
      - "tests/interactive/test_native_joint_checkpoint.py"
      - "tests/interactive/test_native_supervised_process_barrier.py"
      - "tests/interactive/test_supervised_continuous_native_runtime.py"
      - "tests/interactive/test_native_parent_death_fence.py"
      - "tests/interactive/test_continuous_console.py"
      - "tests/interactive/test_continuous_initial_config.py"
      - "tests/test_native_vizard_recording.py"
      - "src/sat_sim/bsk_engine/vizard_native_export.py"
      - "scripts/export_native_vizard.py"
      - "src/sat_sim/bsk_engine/rw_geometry.py"
      - "tests/test_native_rw_geometry.py"
      - "tests/test_native_rw_per_wheel_torque.py"
      - "tests/test_native_rw_per_wheel_friction.py"
      - "tests/test_native_rw_momentum.py"
      - "tests/test_native_spacecraft_inertia.py"
      - "tests/test_native_solar_panel_normal.py"
      - "tests/test_native_solar_panel_tracking.py"
      - "src/sat_sim/bsk_engine/solar_tracking.py"
      - "tests/interactive/test_continuous_observability.py"
      - "tests/interactive/test_continuous_endurance.py"
      - "tests/interactive/test_continuous_endurance_audit.py"
      - "tests/interactive/test_windows_native_job.py"
      - "src/sat_sim/web/**"
      - "tests/interactive/test_interactive_api.py"
      - "tests/interactive/test_continuous_soak.py"
      - "tests/interactive/test_unified_segmented_execution.py"
      - ".github/workflows/continuous-satellite-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-whole-spacecraft:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install public upstream Basilisk and test requirements
        run: |
          python -m pip install \
            "bsk==2.11.0" "sgp4==2.25" "colorama==0.4.6" \
            "numpy==2.3.5" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "PyYAML==6.0.3" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "pytest==9.0.3" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Report installed Basilisk provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          print("Basilisk:", Basilisk.__version__)
          print("bsk distribution:", version("bsk"))
          PY
      - name: Run native continuous and segmented execution regression tests
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q \
            tests/interactive/test_continuous_session.py \
            tests/interactive/test_continuous_seal.py \
            tests/interactive/test_native_checkpoint_audit.py \
            tests/interactive/test_native_recovery_readiness.py \
            tests/interactive/test_native_state_pilot.py \
            tests/interactive/test_native_multitask_pilot.py \
            tests/interactive/test_native_multiprocess_pilot.py \
            tests/interactive/test_native_closed_loop_checkpoint.py \
            tests/interactive/test_native_whole_state_import_lab.py \
            tests/interactive/test_native_whole_clock_fsw_lab.py \
            tests/interactive/test_native_whole_first_tick_diagnostics.py \
            tests/interactive/test_native_whole_rw_ablation.py \
            tests/interactive/test_native_whole_held_command_ablation.py \
            tests/interactive/test_native_battery_reset_barrier.py \
            tests/interactive/test_basilisk211_battery_source_contract.py \
            tests/interactive/test_native_rw_fault_checkpoint.py \
            tests/interactive/test_native_tc_reconciliation.py \
            tests/interactive/test_native_joint_checkpoint.py \
            tests/interactive/test_native_supervised_process_barrier.py \
            tests/interactive/test_supervised_continuous_native_runtime.py \
            tests/interactive/test_native_parent_death_fence.py \
            tests/interactive/test_continuous_console.py \
            tests/interactive/test_continuous_initial_config.py \
            tests/interactive/test_continuous_observability.py \
            tests/interactive/test_continuous_endurance.py \
            tests/interactive/test_continuous_endurance_audit.py \
            tests/interactive/test_interactive_api.py \
            tests/interactive/test_unified_segmented_execution.py \
            tests/interactive/test_subsystem_persistent_runtimes.py \
            --disable-warnings
      - name: Official Vizard vizInterface genuine Basilisk .bin and no-physics-change A/B
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_vizard_recording.py
          --disable-warnings
      - name: Genuine Basilisk RW 3D position/axis SWIG and closed-loop physical response A/B
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_rw_geometry.py
          --disable-warnings
      - name: Genuine Basilisk independent RW hardware u_max, fault clamp and physical spin A/B
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_rw_per_wheel_torque.py
          --disable-warnings
      - name: Genuine Basilisk per-wheel friction coefficients and physical wheel speed A/B
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_rw_per_wheel_friction.py
          --disable-warnings
      - name: Real Basilisk HR16 per-wheel rated momentum and native spin-inertia A/B
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_rw_momentum.py
          --disable-warnings
      - name: Real Basilisk spacecraft principal inertia closed-loop A/B and invalid geometry
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_spacecraft_inertia.py
          --disable-warnings
      - name: Real Basilisk solar panel body-normal power A/B and fail-closed geometry
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_solar_panel_normal.py
          --disable-warnings
      - name: Real Basilisk opt-in panel tracking and slew-bound A/B validation
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_native_solar_panel_tracking.py
          --disable-warnings
      - name: Native propulsion geometry A/B with actual orbit and fuel response
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_propulsion_whole_coupling.py
          -k test_native_thruster_direction_ab_changes_trajectory_without_changing_fuel_rate
          --disable-warnings
      - name: Basilisk-scheduled project thermal heat-capacity A/B response
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_whole_thermal_heat_capacity_ab.py
          --disable-warnings
      - name: Basilisk-scheduled project radiator and heater A/B temperature response
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/test_thermal_radiator_heater_ab.py
          --disable-warnings
      - name: Publish real Basilisk first-tick divergence diagnostics
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/interactive/test_native_whole_first_tick_diagnostics.py
          -k test_r9f_real_basilisk_first_tick_negative_control
          --disable-warnings
      - name: Publish real Basilisk RW C++ owner-memory ablation
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/interactive/test_native_whole_rw_ablation.py
          -k test_r9g_full_basilisk_rw_cpp_memory_isolated_ablation
          --disable-warnings
      - name: Publish real Basilisk applied motor message multi-tick ablation
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/interactive/test_native_whole_held_command_ablation.py
          -k test_r9h_real_basilisk_four_native_ticks_applied_command_ablation
          --disable-warnings
      - name: Publish native Basilisk battery public-Reset negative-control evidence
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/interactive/test_native_battery_reset_barrier.py
          -k test_r9i_genuine_basilisk_battery_public_reset_must_not_be_called_recovery
          --disable-warnings
      - name: Run real Basilisk 8+ second wall-clock observation pilot
        env:
          PYTHONPATH: "src:."
        run: >-
          python -m pytest -q -s
          tests/interactive/test_continuous_observability.py
          -k test_native_basilisk_actual_wallclock_metrics_smoke
      - name: Run genuine 30+ second real-wall-clock Basilisk endurance and external audit
        env:
          PYTHONPATH: "src:."
          SAT_SIM_CONTINUOUS_WALLCLOCK_TARGET_S: "30"
        run: >-
          python -m pytest -q -s
          tests/interactive/test_continuous_observability.py
          -k test_native_basilisk_actual_wallclock_metrics_smoke
      - name: Run accelerated continuous full-spacecraft TC/TM soak (180 simulated seconds)
        env:
          PYTHONPATH: "src:."
          SAT_SIM_CONTINUOUS_SEGMENT_BYTES: "65536"
        run: |
          python -m pytest -q -s tests/interactive/test_continuous_soak.py --disable-warnings
      - name: Run long-horizon continuous TC/TM soak (3600 simulated seconds)
        env:
          PYTHONPATH: "src:."
          SAT_SIM_CONTINUOUS_SOAK_TARGET_S: "3600"
        run: |
          python -m pytest -q -s tests/interactive/test_continuous_soak.py --disable-warnings

  basilisk-battery-cpp-contract:
    # This validates C++ source compilation *against the authentic upstream*
    # v2.11.0 checkout. It does NOT produce an installed patched bsk wheel,
    # does NOT exercise SWIG Python runtime import, and must not qualify
    # production checkpoint resume.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install native header dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libeigen3-dev swig
      - name: Fetch exact upstream Basilisk 2.11.0 source
        run: |
          git clone --depth=1 --filter=blob:none --branch v2.11.0 https://github.com/AVSLab/basilisk.git /tmp/r9j-basilisk
          test "$(git -C /tmp/r9j-basilisk rev-parse HEAD)" = "6c1511f5385dccaa73c9ae24522a74adc24fe623"
      - name: Apply and prove native C++ source-only checkpoint patch
        run: |
          python scripts/apply_basilisk211_battery_checkpoint.py /tmp/r9j-basilisk --check
          python scripts/apply_basilisk211_battery_checkpoint.py /tmp/r9j-basilisk
          git -C /tmp/r9j-basilisk diff --check
          git -C /tmp/r9j-basilisk diff --stat
          git -C /tmp/r9j-basilisk diff -- src/simulation/power/simpleBattery/simpleBattery.h src/simulation/power/simpleBattery/simpleBattery.cpp | head -n 190
      - name: Compile actual pinned native C++ source without replacing wheel
        run: |
          c++ -std=c++17 -fsyntax-only \
            -I/tmp/r9j-basilisk/src -I/usr/include/eigen3 \
            /tmp/r9j-basilisk/src/simulation/power/simpleBattery/simpleBattery.cpp
      - name: Generate SWIG Python interface from patched native header
        run: |
          swig -c++ -python \
            -I/tmp/r9j-basilisk/src \
            -I/tmp/r9j-basilisk/src/architecture/_GeneralModuleFiles \
            -I/tmp/r9j-basilisk/src/simulation/power/simpleBattery \
            -outdir /tmp \
            -o /tmp/r9j_simpleBattery_wrap.cxx \
            /tmp/r9j-basilisk/src/simulation/power/simpleBattery/simpleBattery.i
          test -s /tmp/r9j_simpleBattery_wrap.cxx
          grep -q 'exportCheckpointState' /tmp/r9j_simpleBattery_wrap.cxx
          grep -q 'importCheckpointState' /tmp/r9j_simpleBattery_wrap.cxx
          echo "R9J_NATIVE_CPP_AND_SWIG_SOURCE_CONTRACT_COMPILED"
          echo "R9J_NOT_A_REBUILT_BASILISK_WHEEL_OR_RECOVERY_PARITY_PROOF"

  windows-job-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Windows process-guard test requirements
        run: python -m pip install pytest==9.0.3
      - name: Prove real Windows Job Object kill-on-close
        env:
          PYTHONPATH: "src;."
        run: python -m pytest -q tests/interactive/test_windows_native_job.py

name: R83m Original Basilisk 54-case RW 75pct Loss and Guidance Threshold

# Original 54-case genuine Basilisk run #40160788578 is complete.
# The source JSON and preregistration are SHA-frozen. GitHub PR path
# filtering can retrigger expensive physics on document-only changes;
# no automatic selective repeats. Explicit manual research reruns only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: windows-2025
            python-version: '3.11'
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build with only metadata/test requirements (no test simulator)
        run: |
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Reject unsafe schedules and unapproved motor override
        run: python -m pytest -q tests/test_r83m_native_guidance_threshold_contract.py tests/test_r83l_native_fsw_multicondition_fault_contract.py

  genuine-native-scheduled-fsw:
    needs: command-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin official bsk 2.11.0 original wheel before any native execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r83j/wheel" "$RUNNER_TEMP/r83j/compat" "$RUNNER_TEMP/r83j/evidence"
          python -m pip download --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/r83j/wheel" "bsk==2.11.0"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          files=list((Path(os.environ["RUNNER_TEMP"])/"r83j/wheel").glob("bsk-2.11.0-*.whl"))
          expected="d51fe1ffa1b0b03dc415034b210497b28a2504428d4d8e71b481542a08c08a0a"
          if len(files)!=1 or hashlib.sha256(files[0].read_bytes()).hexdigest()!=expected:
              raise RuntimeError("R83J_ORIGINAL_OFFICIAL_NATIVE_WHEEL_MISMATCH")
          print("R83J_PINNED_BASILISK_ORIGINAL_WHEEL_SHA256",expected)
          PY
          python scripts/build_bsk_compat_wheels.py \
            "$RUNNER_TEMP"/r83j/wheel/bsk-2.11.0-*.whl \
            --output-dir "$RUNNER_TEMP/r83j/compat" \
            --report "$RUNNER_TEMP/r83j/evidence/compat_payload_review.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"r83j/evidence/compat_payload_review.json").read_text())["results"][0]
          if not x["payload_bytes_unchanged"] or x["payload_file_count"]<800:
              raise RuntimeError("R83J_NATIVE_BASILISK_ORIGINAL_PAYLOAD_CHANGED")
          PY
      - name: Install actual native bsk and source with no dynamics proxy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$RUNNER_TEMP"/r83j/compat/bsk-2.11.0+satfix1-*.whl
          python -m pip install -e .
          python - <<'PY'
          from importlib.metadata import version
          from Basilisk.simulation import spacecraft, reactionWheelStateEffector
          from Basilisk.fswAlgorithms import inertial3D, attTrackingError, mrpFeedback, rwMotorTorque
          assert version("bsk") == "2.11.0+satfix1"
          print("R83J_NATIVE_FSW_DYNAMICS_CHAIN_MODULES_IMPORTED")
          PY
      - name: Execute exact 54 native prospective 75-percent derating source cases
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from sat_sim.experiments.native_fsw_guidance_threshold_source_r83m import run_native_multifactor_source_physics
          report=run_native_multifactor_source_physics()
          path=Path(os.environ["RUNNER_TEMP"])/"r83j/evidence/r83m_genuine_native_54_original.json"
          path.write_text(json.dumps(report,sort_keys=True,indent=2,allow_nan=False)+"\n")
          assert report["source_native_cases"]==54
          assert report["independent_wheel_and_initial_condition_groups"]==9
          assert report["healthy_source_cases"]==27
          assert report["paired_fault_vs_nominal_comparisons"]==27
          assert len(report["physical_source_cases"])==54
          assert len(report["native_physical_paired_outcomes"])==27
          assert report["fault_derating_verified_by_real_cpp_state"] is True
          assert report["actual_applied_motor_torque_verified_from_rwOutMsgs"] is True
          assert report["no_protected_validation_test_final_cases_generated"] is True
          assert report["not_a_generalizable_diagnostic_benchmark"] is True
          assert report["no_machine_learning_trained"] is True
          print("R83M_NATIVE_ORIGINAL_SHA256",hashlib.sha256(path.read_bytes()).hexdigest())
          print("R83M_REAL_NATIVE_CAPACITY_THRESHOLDS",report["predeclared_guidance_amplitude_deg"],
                report["original_native_request_by_reference_mode"])
          for key,r in sorted(report["native_physical_paired_outcomes"].items()):
              print("R83M_REAL_NATIVE_PAIR",key,r)
          print("R83M_RESEARCH_BOUNDS",
                report["max_original_native_allocator_request_nm"],
                report["max_original_native_wheel_speed_rad_s"],
                report["max_original_native_body_rate_rad_s"])
          if not report["predeclared_provisional_request_speed_envelope_passed"]:
              raise RuntimeError("R83M_PROVISIONAL_REQUEST_SPEED_OR_BODY_RATE_LIMIT_EXCEEDED")
          PY
      - name: Archive actual C-backed Basilisk FSW and RW source message evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83m-genuine-basilisk-54-native-guidance-threshold-75pct-loss
          if-no-files-found: warn
          retention-days: 21
          path: ${{ runner.temp }}/r83j/evidence/

capability_id: orbit_environment.basilisk_hf.v1
schema_version: 0.1.0
name: Basilisk-native high-fidelity orbit environment adapter
level: integrated
domain: orbit_environment
target: orbit_environment
trust_level: experimental
status: bsk_run3_spice_third_body_runtime_prepared
summary: BSK-ORB-1/2 explicit Basilisk-native orbit capability. BSK-ORB-1 added the Basilisk-required adapter; BSK-ORB-2 adds
  benchmark cases, readiness reports, and explicit local-proxy comparison baselines without treating those baselines as fallback
  or high-fidelity validation.
adapter:
  class_path: sat_sim.adapters.orbit_environment_basilisk_hf.OrbitEnvironmentBasiliskHfAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules:
  - sat_sim.orbit.basilisk_hf
  - sat_sim.time_systems
  - sat_sim.frames
  - sat_sim.state
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: true
  optional_dependency: bsk==2.10.2
modes:
  nominal:
    supported: true
  fault:
    supported: false
  degradation:
    supported: false
modifier_policy:
  faults: not_supported_for_bsk_orb1
  degradations: not_supported_for_bsk_orb1
parameters:
  central_body:
    type: string
    required: false
    enum:
    - earth
    - mars
    default: earth
  altitude_m:
    type: number
    unit: m
    required: false
    min: 120000.0
    max: 36000000.0
    default: 500000.0
  semi_major_axis_m:
    type: number
    unit: m
    required: false
  eccentricity:
    type: number
    unit: none
    required: false
    min: 0.0
    max: 0.95
    default: 0.0
  inclination_deg:
    type: number
    unit: deg
    required: false
    min: 0.0
    max: 180.0
    default: 51.6
  raan_deg:
    type: number
    unit: deg
    required: false
    default: 0.0
  arg_perigee_deg:
    type: number
    unit: deg
    required: false
    default: 0.0
  true_anomaly_deg:
    type: number
    unit: deg
    required: false
    default: 0.0
  force_models:
    type: object
    required: false
    description: Basilisk force-model configuration under orbit_environment.force_models.
    fields:
      spherical_harmonics:
        type: object_or_bool
        required: false
        description: Enables Basilisk spherical harmonics gravity via GravBodyData.useSphericalHarmonicsGravityModel.
      third_bodies:
        type: list[string]
        required: false
        description: Third-body gravity candidates such as sun and moon; runtime benchmark coverage is BSK-ORB-2 scope.
      spice_ephemeris:
        type: boolean
        required: false
        description: Requests SPICE ephemeris interface; runtime benchmark coverage is BSK-ORB-2 scope.
      atmosphere_model:
        type: string
        required: false
        description: Atmosphere model selector for drag configuration surface.
      drag:
        type: boolean
        required: false
      srp:
        type: boolean
        required: false
  spacecraft:
    type: object
    required: false
    description: Orbit-environment spacecraft properties under parameters.spacecraft.
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
  epoch_utc:
    unit: UTC
    required: false
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
  - name: orbit.r_bn_n_m_x
    unit: m
    dtype: number
  - name: orbit.r_bn_n_m_y
    unit: m
    dtype: number
  - name: orbit.r_bn_n_m_z
    unit: m
    dtype: number
  - name: orbit.v_bn_n_m_s_x
    unit: m/s
    dtype: number
  - name: orbit.v_bn_n_m_s_y
    unit: m/s
    dtype: number
  - name: orbit.v_bn_n_m_s_z
    unit: m/s
    dtype: number
  - name: orbit.radius_m
    unit: m
    dtype: number
  - name: orbit.speed_m_s
    unit: m/s
    dtype: number
  summary:
  - name: basilisk_status
    unit: none
  - name: physical_validation_status
    unit: none
  - name: qoi.orbit.altitude_min_m
    unit: m
  - name: qoi.orbit.altitude_delta_m
    unit: m
validation:
  conformance_tests:
  - test_basilisk_orbit_hf_capability_metadata_is_native
  - test_basilisk_orbit_hf_config_blueprint_supports_extended_force_surfaces
  - test_basilisk_orbit_hf_validation_reports_missing_dependency_without_fallback
  - test_basilisk_orbit_hf_run_returns_unavailable_summary_when_basilisk_missing
  - test_basilisk_orbit_benchmark_cases_cover_required_force_surfaces
  - test_basilisk_orbit_benchmark_report_is_honest_without_basilisk
produces:
- name: orbit.*
  destination: trace
- name: environment.*
  destination: trace
- name: bsk_orb1.blueprint
  destination: metadata
consumes:
- name: simulation.duration_s
  unit: s
  required: true
- name: simulation.sample_s
  unit: s
  required: true
- name: orbit_environment.force_models
  required: false
- name: parameters.spacecraft
  required: false
time_grid:
  policy: basilisk_task_step_from_simulation_sample_s
  time_field: time_s
  duration_source: simulation.duration_s
  sample_source: simulation.sample_s
source_binding:
  mode: basilisk_native
  status: bsk_run3_spice_third_body_runtime_prepared_explicit_basilisk_required
  primary_module: sat_sim.orbit.basilisk_hf
  source_modules:
  - sat_sim.orbit.basilisk_hf
  - sat_sim.adapters.orbit_environment_basilisk_hf
  public_api:
  - BasiliskOrbitHfConfig
  - check_basilisk_availability
  - build_basilisk_orbit_blueprint
  - build_bsk_orb1_payload
  - run_basilisk_orbit_hf_if_available
  - run_basilisk_orbit_benchmark
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: true
fidelity_level: high_fidelity_candidate
known_physics_limits:
- This capability requires Basilisk/bsk at runtime. Without Basilisk, BSK-ORB-2 benchmark artifacts are configuration/readiness
  evidence only, not a Basilisk runtime pass.
- BSK-RUN-3 adds an explicit SPICE/third-body runtime path for Sun/Moon when real kernels are available; atmosphere/drag,
  SRP and Mars extended runtime remain later scopes.
- Local orbit proxy comparisons are explicit baselines and are never implicit fallback for orbit_environment.basilisk_hf.v1.
- Current package does not include external truth ephemeris correlation, flight-data validation, or calibrated mission-specific
  tolerances.
- SPICE/third-body runtime depends on installed Basilisk modules and real SPICE kernels; missing kernels must be reported
  as runtime_unavailable or unavailable, not as a pass. Drag/SRP runtime remains configured_not_executed until BSK-RUN-4.
allowed_task_spec_sections:
- schema_version
- task_id
- task_type
- capability_id
- target
- simulation
- orbit_environment
- parameters
- outputs
- metadata
- tags
lifecycle:
  status: active
  replacement: null
  exposed_to_agent: false
  exposed_to_real_llm_eval: false
  reason: Explicit-only Basilisk-native candidate until real Basilisk benchmark runtime and later 6-DOF integration gates
    are available.
backend_type: basilisk_native
validation_basis: &id001
- conformance_tests
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: basilisk_native
  basilisk_required: true
  current_agent_path_uses_basilisk: true
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/sat_sim/orbit/basilisk_hf.py
  validation_basis: *id001
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim flight validation, hardware calibration, or high-fidelity equivalence without external validation
    evidence.
  bsk0_notes: Current Agent path requires Basilisk-native execution; validate with Basilisk-installed environment before claiming
    benchmark pass.
  planned_upgrade_path: []
comparison_baseline:
  local_proxy_capability_id: orbit_environment.orbit_fidelity.v1
  policy: explicit_only_no_implicit_fallback
  bsk_run3_report: reports/bsk_run3/basilisk_orbit_benchmark_spice_third_body/case_results.csv
benchmarking:
  route_version: BSK-ORB-2 + BSK-RUN-3
  scenario_manifest: evals/basilisk_orbit_benchmark/bsk_orb2_scenarios.json
  report_dir: reports/bsk_run3/basilisk_orbit_benchmark_spice_third_body
  runner: scripts/run_basilisk_orbit_benchmark.py
  benchmark_status_policy: benchmark_config_prepared is not basilisk_benchmark_passed; runtime_unavailable is not basilisk_benchmark_passed;
    a runtime pass requires installed Basilisk artifacts and real SPICE kernels when SPICE/third-body is requested
  local_proxy_comparison: orbit_environment.orbit_fidelity.v1 is used only as an explicit comparison baseline
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: mixed_native_project
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - This capability requires Basilisk/bsk at runtime. Without Basilisk, BSK-ORB-2 benchmark artifacts are configuration/readiness
    evidence only, not a Basilisk runtime pass.
  - BSK-RUN-3 adds an explicit SPICE/third-body runtime path for Sun/Moon when real kernels are available; atmosphere/drag,
    SRP and Mars extended runtime remain later scopes.
  - Local orbit proxy comparisons are explicit baselines and are never implicit fallback for orbit_environment.basilisk_hf.v1.
  - Current package does not include external truth ephemeris correlation, flight-data validation, or calibrated mission-specific
    tolerances.
  - SPICE/third-body runtime depends on installed Basilisk modules and real SPICE kernels; missing kernels must be reported
    as runtime_unavailable or unavailable, not as a pass. Drag/SRP runtime remains configured_not_executed until BSK-RUN-4.

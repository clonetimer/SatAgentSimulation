consumes:
- name: simulation.duration_s
  unit: s
  required: true
- name: simulation.sample_s
  unit: s
  required: true
- name: simulation.solver.step_s
  unit: s
  required: false
- name: parameters.environment_torques
  unit: configuration
  required: false
- name: parameters.sensor_dropout
  unit: configuration
  required: false
time_grid:
  policy: hf1_output_grid_with_hf2_internal_fixed_step
  time_field: time_s
  duration_source: simulation.duration_s
  sample_source: simulation.sample_s
  internal_step_source: simulation.solver.step_s
source_binding:
  mode: route_b_model_library
  status: adcs1_implemented_fidelity_proxy
  primary_module: sat_sim.adcs.fidelity
  source_modules:
  - sat_sim.adcs.fidelity
  - sat_sim.adcs.closed_loop
  - sat_sim.state
  - sat_sim.time_systems
  - sat_sim.solvers
  - sat_sim.frames
  public_api:
  - ADCSFidelityConfig
  - propagate_adcs_fidelity
  - summarize_adcs_fidelity
  - build_adcs1_fidelity_payload
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
fidelity_level: medium
known_physics_limits:
- Environmental torques are deterministic proxies, not a calibrated orbital disturbance model.
- Star tracker, sun sensor, and gyro are measurement proxies; no hardware calibration or detailed failure dynamics are modeled.
- Reaction-wheel allocation supports orthogonal-three, four-skew and symmetric four-wheel-pyramid geometry with a deterministic
  weighted-pseudoinverse allocator; motor electronics remain proxy-only.
- Controller is deterministic PD/controller-mode proxy, not flight software.
- ADCS-2 benchmark envelopes are internal regression tolerances, not flight-data validation.

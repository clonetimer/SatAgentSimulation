name: P9-N3 official Basilisk thruster component

on:
  pull_request:
    paths:
      - "src/components/thruster/**"
      - "src/components/fuel_tank/**"
      - "src/subsystems/propulsion/builder.py"
      - "src/subsystems/propulsion/schemas.py"
      - "src/sat_sim/adapters/component_thruster_native.py"
      - "src/sat_sim/adapters/component_source_native_misc.py"
      - "src/sat_sim/capabilities/component.thruster.v1.yaml"
      - "src/sat_sim/workbench_quantity_dictionary_comm_payload_propulsion.json"
      - "examples/component_thruster_basilisk_native.yaml"
      - "tests/test_native_thruster_component.py"
      - "tests/test_component_effect_completion.py"
      - ".github/workflows/p9n3-native-thruster.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-thruster:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned official Basilisk and focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "bsk==2.11.0" "numpy==2.3.5" "pydantic==2.13.4" "pytest==9.0.3"
      - name: Verify official Basilisk distribution provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          assert Basilisk.__version__ == "2.11.0"
          assert version("bsk") == "2.11.0"
          print("OFFICIAL_BASILISK_NATIVE", Basilisk.__version__, version("bsk"))
          PY
      - name: Execute native force, fuel and sealed Run Bundle acceptance
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_native_thruster_component.py tests/test_component_effect_completion.py --disable-warnings

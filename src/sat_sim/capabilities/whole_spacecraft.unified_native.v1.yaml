capability_id: whole_spacecraft.unified_native.v1
schema_version: 0.1.0
name: Whole-spacecraft unified Basilisk runtime
level: whole_spacecraft
domain: whole_spacecraft
target: whole_spacecraft
trust_level: engineering_preview
status: agent_ready_candidate
summary: Orbit, ADCS, eclipse, solar generation, electrical storage, runtime event control, payload data, downlink, storage,
  thermal response and optional propulsion execute in one Basilisk Process/Task. Faults and degradations are applied before
  official module updates through messages or owned model state. External solvers and curve-only proxies are excluded.
adapter:
  class_path: sat_sim.adapters.whole_spacecraft_unified_native.WholeSpacecraftUnifiedNativeAdapter
  script_export: true
  runtime_run: true
implementation:
  native_multi_rate_telemetry: true
  model_modules:
  - sat_sim.bsk_engine.unified_native
  - sat_sim.bsk_engine.project_native_modules
  - subsystems.comm_data.builder
  - subsystems.thermal.thermal_network
  - integration.resource_feedback
  uses_legacy_runner: false
  basilisk_required: true
  source_boundary: official_basilisk_modules_plus_project_sysmodels_and_runtime_event_injection_in_one_process_task
  mode: basilisk_unified_native_whole_spacecraft
  backend_type: basilisk_native_mixed
  accepted_task_backends:
  - basilisk
  requires_allow_proxy: false
  modifier_application: native_runtime_only
modes:
  nominal:
    supported: true
  fault:
    supported: true
    timed_events_supported: true
    effects:
    - adcs_rw_jamming
    - adcs_rw_motor_failure
    - gyro_bias_step
    - payload_instrument_off
    - comm_data_downlink_link_loss
    - eps_battery_capacity_loss
    - propulsion_thruster_ignition_failure
  degradation:
    supported: true
    timed_events_supported: true
    effects:
    - gyro_noise_increase
    - rw_friction_degradation
    - solar_panel_efficiency_loss
    - thermal_radiator_rejection_loss
    - propulsion_burn_impulse_loss
  constraint:
    supported: true
    timed_events_supported: true
    effects:
    - adcs_reaction_wheel_speed_limit
    - power_safe_mode_threshold

operator:
  owner: unified_native_whole_spacecraft
  effects:
  - effect_id: nominal
    kind: nominal
    owner: unified_native_whole_spacecraft
    implementation: basilisk_native
    evidence_fields:
    - runtime_truth_status
    - eps.battery_soc
    - data.storage_bits
    - thermal.payload_temp_k
    verification: candidate
  - effect_id: payload_instrument_off
    kind: fault
    owner: project_power_data_mode_gate
    implementation: basilisk_native
    evidence_fields:
    - payload.active
    - payload.generated_bps
    - data.storage_bits
    verification: declared
  - effect_id: adcs_rw_jamming
    kind: fault
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_torque_ratio_0
    - adcs.control.applied_torque_nm_0
    verification: declared
  - effect_id: adcs_rw_motor_failure
    kind: fault
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_max_torque_nm_0
    - adcs.control.applied_torque_nm_0
    verification: declared
  - effect_id: gyro_bias_step
    kind: fault
    owner: project_imu_fault_injector
    implementation: basilisk_native
    evidence_fields:
    - adcs.sensor.gyro_bias_norm_rad_s
    verification: declared
  - effect_id: comm_data_downlink_link_loss
    kind: fault
    owner: project_power_data_mode_gate
    implementation: basilisk_native
    evidence_fields:
    - comm.active
    - comm.downlink_bps
    - data.storage_bits
    verification: declared
  - effect_id: eps_battery_capacity_loss
    kind: fault
    owner: project_whole_parameter_event_controller
    implementation: basilisk_native
    evidence_fields:
    - eps.battery_capacity_ratio
    - eps.battery_capacity_j
    - eps.battery_soc
    verification: declared
  - effect_id: propulsion_thruster_ignition_failure
    kind: fault
    owner: project_propulsion_burn_controller
    implementation: basilisk_native
    evidence_fields:
    - propulsion.burn_active
    - propulsion.total_thrust_n
    - propulsion.fuel_mass_kg
    - orbit.radius_m
    verification: declared
  - effect_id: solar_panel_efficiency_loss
    kind: degradation
    owner: project_whole_parameter_event_controller
    implementation: basilisk_native
    evidence_fields:
    - eps.solar_array_efficiency_ratio
    - eps.solar_array_power_w
    - eps.battery_soc
    verification: declared
  - effect_id: gyro_noise_increase
    kind: degradation
    owner: project_imu_fault_injector
    implementation: basilisk_native
    evidence_fields:
    - adcs.sensor.gyro_noise_norm_rad_s
    verification: declared
  - effect_id: rw_friction_degradation
    kind: degradation
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_drag_nms_0
    verification: declared
  - effect_id: thermal_radiator_rejection_loss
    kind: degradation
    owner: project_whole_parameter_event_controller
    implementation: basilisk_native
    evidence_fields:
    - thermal.radiator_rejection_ratio
    - thermal.payload_temp_k
    verification: declared
  - effect_id: propulsion_burn_impulse_loss
    kind: degradation
    owner: project_propulsion_burn_controller
    implementation: basilisk_native
    evidence_fields:
    - propulsion.total_thrust_n
    - propulsion.fuel_mass_kg
    - propulsion.electrical_power_w
    - orbit.radius_m
    verification: declared
  - effect_id: power_safe_mode_threshold
    kind: constraint
    owner: project_power_data_mode_gate
    implementation: basilisk_native
    evidence_fields:
    - label.power_safe_mode_engaged
    - payload.active
    - comm.active
    - eps.battery_soc
    verification: declared
  - effect_id: adcs_reaction_wheel_speed_limit
    kind: constraint
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_max_speed_rad_s_0
    - adcs.rw.speed_rad_s_0
    verification: declared
  observability:
    qoi:
    - runtime_truth_status
    - coupling_integrity_pass
    - energy_bounds_pass
    - data_bounds_pass
    trace:
    - time_s
    - orbit.*
    - adcs.*
    - eps.*
    - payload.*
    - comm.*
    - data.*
    - thermal.*
    - propulsion.*
    - label.*
    - event.*
  limitations:
  - Current Sun/Earth ephemeris messages use a deterministic analytical setup rather than SPICE kernels.
  - Project sensor fusion, event managers and mode gate are native SysModels but not official Basilisk modules.
  - Only effects listed in modes.*.effects are accepted by the unified runtime.
  - Propulsion is opt-in and currently supports one scheduled burn gated by battery SOC, safe mode and timed ignition/impulse events.
lifecycle:
  status: active
  product_tier: recommended
  recommended: true
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: Recommended whole-spacecraft path for the currently supported orbit, ADCS, EPS, payload/data, communication, thermal
    and optional propulsion chain.
experiments:
  official_monte_carlo:
    supported: true
    registry: sat_sim.experiments.native_controller_registry
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: mixed_native_project
  couplings:
    supported:
    - orbit_sun_attitude_eclipse_to_eps_solar_power
    - eps_pdu_to_payload_activity
    - eps_pdu_to_comm_activity
    - eps_pdu_to_thermal_heaters
    - payload_activity_to_eps_thermal
    - adcs_control_effort_to_eps_thermal
    - propulsion_activity_to_eps_thermal
    - propulsion_effector_to_spacecraft
    - adcs_pointing_to_payload_gate
    - ground_access_to_comm_downlink
    - native_rf_quality_to_comm_downlink
    - thermal_safety_to_payload_comm_gate
    unsupported:
    - '*'
  limitations:
  - Communication uses native GroundLocation, SimpleAntenna, LinkBudget and DownlinkHandling; antenna and ground-station parameters
    remain engineering estimates until calibrated.
  - Thermal response uses an eight-node project deterministic network and is not a detailed finite-element thermal model.
  - Resource activity-to-power and power-to-heat bridges are engineering proxies with explicit provenance.
model_projection:
  schema_version: sat-sim.capability-projection.v1
  projection_id: whole-spacecraft-attitude-projection-v1
  model_ref: spacecraft.demo_satellite@1
  graph_ref: spacecraft.demo_satellite@1
  operations_object_ref: spacecraft.attitude_control
  parameter_set_id: demo-satellite-attitude-v1
  implementation_id: spacecraft.demo_satellite.basilisk_unified@1
  binding_set_id: attitude-control-bindings-v1
  generated_schemas: sat_sim.a3r.projection_api.projection_schema_bundle
  exposed_properties:
  - spacecraft.attitude_control.pointing_status
  - spacecraft.attitude_control.rw_speed
  exposed_actions:
  - spacecraft.attitude_control.enter_safe_mode
  exposed_effects:
  - spacecraft.attitude_control.inject_rw_jamming
  evidence:
  - spacecraft.attitude_control.pointing_evidence
execution:
  schema_version: sat-sim.model-asset-execution-policy.v1
  adapter_key: basilisk.attitude_control_graph
  model_ref: spacecraft.demo_satellite@1
  implementation_id: spacecraft.demo_satellite.basilisk_unified@1
  parameter_set_id: demo-satellite-attitude-v1
  binding_set_id: attitude-control-bindings-v1
  legacy_fallback_adapter_key: legacy.capability
  legacy_fallback_enabled: false

name: P9-I evidence-backed spatial asset contract

on:
  pull_request:
    paths:
      - "src/sat_sim/workbench_spatial_assets.py"
      - "src/sat_sim/schemas/spatial_asset_registry.schema.json"
      - "tests/test_p9i_spatial_asset_contract.py"
      - ".github/workflows/p9i-spatial-asset-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9i-spatial-assets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spatial-asset-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python -m pip install "pytest==9.0.3" "jsonschema==4.26.0" "PyYAML==6.0.3"
      - name: Validate evidence-gated asset and instance contract
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_p9i_spatial_asset_contract.py

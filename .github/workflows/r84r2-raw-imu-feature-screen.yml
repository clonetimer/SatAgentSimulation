name: R84-R2-E0 retrospective raw IMU feature screen

on:
  pull_request:
    paths:
      - "scripts/audit_r84r2_raw_imu_feature_screen.py"
      - "tests/test_r84r2_raw_imu_feature_screen.py"
      - "scripts/SCRIPT_INVENTORY.md"
      - ".github/workflows/r84r2-raw-imu-feature-screen.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  retrospective-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run feature and provenance contract tests
        run: |
          python -m pip install "pytest==9.0.3"
          python -m pytest -q tests/test_r84r2_raw_imu_feature_screen.py
      - name: Download and verify the immutable R84-R1 source artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r84r2"
          curl --fail --location --retry 3 --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/clonetimer/SatAgentSimulation/actions/artifacts/13498019393/zip" \
            -o "$RUNNER_TEMP/r84r2/r84r1-source.zip"
          echo "4bc1f9d0f788dce5e8d33aace1fe8860d739158793bcf6fae28352c785742a8e  $RUNNER_TEMP/r84r2/r84r1-source.zip" | sha256sum --check -
      - name: Recompute all fixed features and independent-control comparisons
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_r84r2_raw_imu_feature_screen.py \
            --artifact "$RUNNER_TEMP/r84r2/r84r1-source.zip" \
            --report "$RUNNER_TEMP/r84r2/r84r2-feature-screen.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "r84r2/r84r2-feature-screen.json").read_text())
          assert report["status"] == "EXPLORATORY_RETROSPECTIVE_ONLY"
          assert report["source_unique_native_runs"] == 3159
          assert report["multi_feature_aggregate"]["healthy_false_alarms"] == 48
          assert report["multi_feature_aggregate"]["loss50_exceedances"] == 49
          assert report["multi_feature_aggregate"]["loss75_exceedances"] == 62
          assert report["interpretation"]["independent_confirmation"] is False
          assert report["diagnostic_model_trained"] is False
          assert report["formal_training_or_test_eligible"] is False
          print("R84R2_E0_RETROSPECTIVE_SCREEN_PASS")
          PY
      - name: Upload reproducible exploratory report
        uses: actions/upload-artifact@v7
        with:
          name: r84r2-e0-raw-imu-feature-screen
          path: ${{ runner.temp }}/r84r2/r84r2-feature-screen.json
          if-no-files-found: error
          retention-days: 30

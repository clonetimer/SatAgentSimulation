name: P9-D object configuration panel acceptance

on:
  pull_request:
    paths:
      - "src/sat_sim/web/object-config-panel.js"
      - "src/sat_sim/web/satellite-scene.js"
      - "src/sat_sim/web/satellite-scene.css"
      - "src/sat_sim/web/index.html"
      - "src/sat_sim/web/app.js"
      - "tests/js/test_p9d_object_config_panel.cjs"
      - "tests/test_p9d_object_config_panel.py"
      - ".github/workflows/p9d-object-config-panel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-config:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python -m pip install "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" "setuptools==84.1.0" "wheel==0.46.2"
      - name: Verify P9-D renderer and controller syntax
        run: |
          node --check src/sat_sim/web/object-config-panel.js
          node --check src/sat_sim/web/app.js
          node --check src/sat_sim/web/satellite-scene.js
          node --test tests/js/test_p9d_object_config_panel.cjs
      - name: Verify real object tree, schema binding and TaskSpec boundary
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_p9d_object_config_panel.py tests/test_p9a_object_tree_quantities.py tests/test_p9a_workspace_adapter.py tests/test_wizard_low_friction_ux.py tests/test_workbench_wizard.py

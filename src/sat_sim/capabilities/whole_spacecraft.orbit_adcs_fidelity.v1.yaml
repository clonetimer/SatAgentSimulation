capability_id: whole_spacecraft.orbit_adcs_fidelity.v1
schema_version: 0.1.0
name: Orbit + ADCS fidelity integration gate
level: whole_spacecraft
domain: orbit_adcs
target: orbit_adcs
trust_level: conformance_tested
status: agent_ready_candidate
summary: INT-1 Route-B integration capability that aligns the active ORB-1 orbit-fidelity model and ADCS-1 fidelity model
  on one time grid with explicit ECI/LVLH/sun pointing target metadata, HF-8 physical validation summary, and internal INT-1
  benchmark envelopes. It is not a full 6-DOF flight-grade orbit-attitude simulation.
adapter:
  class_path: sat_sim.adapters.whole_spacecraft_orbit_adcs_fidelity.OrbitAdcsFidelityAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules:
  - sat_sim.coupled.orbit_adcs_fidelity
  - sat_sim.orbit.numerical
  - sat_sim.orbit.force_models
  - sat_sim.adcs.fidelity
  - sat_sim.adcs.closed_loop
  - sat_sim.validation.physical_checks
  - sat_sim.time_systems
  - sat_sim.frames
  - sat_sim.solvers
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  fault:
    supported: false
  degradation:
    supported: false
parameters:
  orbit_environment:
    type: object
    required: false
    description: ORB-1 orbit-fidelity configuration section.
  adcs:
    type: object
    required: false
    description: ADCS-1 fidelity parameters nested under parameters.adcs.
  integration:
    type: object
    required: false
    description: INT-1 frame/coupling policy such as pointing_target, frame_contract, and coupling_policy.
  target_mode:
    type: string
    required: false
    enum:
    - nadir
    - sun
    - detumble
    - inertial
    default: nadir
validation:
  conformance_tests:
  - test_int1_orbit_adcs_integration_trace_is_time_aligned
  - test_int1_capability_writes_manifest_metadata
  - test_int1_benchmark_passes_tolerance_envelopes
produces:
- name: int1.*
  destination: trace
- name: orbit.*
  destination: trace
- name: environment.*
  destination: trace
- name: adcs.*
  destination: trace
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
    description: 仿真时间轴。
  - name: orbit.r_bn_n_m_x
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离X轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_x。
  - name: orbit.r_bn_n_m_y
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离Y轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_y。
  - name: orbit.r_bn_n_m_z
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离Z轴。运行器实际输出字段；技术字段为 orbit.r_bn_n_m_z。
  - name: orbit.v_bn_n_m_s_x
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离时间X轴。运行器实际输出字段；技术字段为 orbit.v_bn_n_m_s_x。
  - name: orbit.v_bn_n_m_s_y
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离时间Y轴。运行器实际输出字段；技术字段为 orbit.v_bn_n_m_s_y。
  - name: orbit.v_bn_n_m_s_z
    unit: mixed
    dtype: number
    description: 轨道机体相对惯性参考系 N惯性系距离时间Z轴。运行器实际输出字段；技术字段为 orbit.v_bn_n_m_s_z。
  - name: orbit.radius_m
    unit: m
    dtype: number
    description: 轨道轨道半径距离。运行器实际输出字段；技术字段为 orbit.radius_m，单位 m。
  - name: orbit.altitude_m
    unit: m
    dtype: number
    description: 轨道高度距离。运行器实际输出字段；技术字段为 orbit.altitude_m，单位 m。
  - name: orbit.speed_m_s
    unit: m/s
    dtype: number
    description: 轨道速度距离时间。运行器实际输出字段；技术字段为 orbit.speed_m_s，单位 m/s。
  - name: orbit.specific_energy_j_kg
    unit: kg
    dtype: number
    description: 轨道比能量能量质量。运行器实际输出字段；技术字段为 orbit.specific_energy_j_kg，单位 kg。
  - name: environment.sun_vector_n_x
    unit: mixed
    dtype: number
    description: 环境太阳矢量惯性系X轴。运行器实际输出字段；技术字段为 environment.sun_vector_n_x。
  - name: environment.sun_vector_n_y
    unit: mixed
    dtype: number
    description: 环境太阳矢量惯性系Y轴。运行器实际输出字段；技术字段为 environment.sun_vector_n_y。
  - name: environment.sun_vector_n_z

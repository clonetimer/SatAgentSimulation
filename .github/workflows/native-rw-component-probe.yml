name: Independent native component and subsystem physical and Run Bundle acceptance

on:
  pull_request:
    paths:
      - "src/sat_sim/bsk_engine/unified_native.py"
      - "src/sat_sim/bsk_engine/project_native_modules.py"
      - "src/sat_sim/adapters/subsystem_adcs_unified_native.py"
      - "src/components/pdu/builder.py"
      - "src/components/pdu/faults.py"
      - "src/sat_sim/adapters/subsystem_eps_unified_native.py"
      - "src/sat_sim/adapters/subsystem_comm_data_unified_native.py"
      - "src/sat_sim/capabilities/subsystem.eps.unified_native.v1.yaml"
      - "src/sat_sim/capabilities/subsystem.comm_data.unified_native.v1.yaml"
      - "src/subsystems/event_severity.py"
      - "src/sat_sim/form_schema.py"
      - "configs/acceptance/scenario_baseline.json"
      - "tests/test_event_severity.py"
      - "tests/test_eps_unified_effects.py"
      - "tests/test_comm_data_unified_effects.py"
      - "tests/test_native_eps_comm_data_effects_bundle.py"
      - "tests/test_multi_rate_fmea_unified_subsystems.py"
      - "src/sat_sim/capabilities/subsystem.adcs_unified_native.v1.yaml"
      - "tests/test_unified_native_migration.py"
      - "tests/test_native_adcs_subsystem_bundle.py"
      - "tests/test_native_adcs_fault_effects.py"
      - "tests/test_p9n5_adcs_guided_event_catalog.py"
      - "src/sat_sim/evidence/effect_evidence_v32.json"
      - "tests/test_formal_effect_evidence_contracts.py"
      - "src/sat_sim/bsk_engine/native_rw_component.py"
      - "src/sat_sim/bsk_engine/native_rw_cluster.py"
      - "src/sat_sim/bsk_engine/rw_geometry.py"
      - "src/sat_sim/adapters/component_reaction_wheel.py"
      - "src/sat_sim/adapters/component_battery.py"
      - "src/sat_sim/adapters/component_solar_panel.py"
      - "src/sat_sim/adapters/component_thruster_native.py"
      - "src/sat_sim/adapters/component_fuel_tank_native.py"
      - "src/sat_sim/adapters/component_thermal_node_native.py"
      - "src/sat_sim/adapters/native_reaction_wheel_cluster.py"
      - "src/sat_sim/capabilities/component.reaction_wheel.v1.yaml"
      - "src/sat_sim/capabilities/component.battery.v1.yaml"
      - "src/sat_sim/capabilities/component.solar_panel.v1.yaml"
      - "src/sat_sim/capabilities/component.thruster.v1.yaml"
      - "src/sat_sim/capabilities/component.fuel_tank.v1.yaml"
      - "src/sat_sim/capabilities/component.thermal_node.v1.yaml"
      - "tests/test_p9n_n4_preflight.py"
      - "tests/test_native_sensor_component.py"
      - "tests/test_native_battery_component.py"
      - "tests/test_native_thruster_component.py"
      - "tests/test_native_fuel_tank_component.py"
      - "tests/test_native_thermal_node_component.py"
      - "src/sat_sim/scenario_templates.py"
      - "src/sat_sim/form_schema.py"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/web/index.html"
      - "src/sat_sim/web/styles.css"
      - "tests/test_p9n_component_simulation.py"
      - "tests/test_guided_task_workspace_browser.py"
      - "tests/test_native_rw_component_probe.py"
      - "tests/test_native_rw_cluster.py"
      - "tests/test_component_rw_native_entry.py"
      - "tests/test_component_rw_native_cluster_entry.py"
      - "tests/execution_contract/test_runtime_integration.py"
      - ".github/workflows/native-rw-component-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  official-basilisk-native-components:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install official upstream Basilisk (not project Python physics)
        run: |
          python -m pip install \
            "bsk==2.11.0" "sgp4==2.25" "colorama==0.4.6" \
            "numpy==2.3.5" "pydantic==2.13.4" "jsonschema==4.26.0" \
            "PyYAML==6.0.3" "joblib==1.5.3" "scikit-learn==1.9.0" \
            "pytest==9.0.3" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Report actual distribution provenance
        run: |
          python - <<'PY'
          import Basilisk
          from importlib.metadata import version
          assert version("bsk") == "2.11.0"
          print("OFFICIAL_BASILISK_NATIVE", Basilisk.__version__, version("bsk"))
          PY
      - name: Native SWIG reaction-wheel physical A/B
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q -s tests/test_native_rw_component_probe.py tests/test_native_rw_cluster.py tests/test_component_rw_native_entry.py tests/test_component_rw_native_cluster_entry.py
      - name: Verify TaskSpec to sealed Run Bundle component execution
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q -s tests/execution_contract/test_runtime_integration.py -k native_reaction_wheel_component_survives_full_sealed_run_bundle
      - name: Official Basilisk IMU, StarTracker and Magnetometer physical/Run Bundle contracts
        env:
          PYTHONPATH: "src:."
        run: |
          mkdir -p reports/native_component_sensor
          python -m pytest -q -s --junitxml=reports/native_component_sensor/junit.xml tests/test_native_sensor_component.py
      - name: Official Basilisk SimpleBattery and SimpleSolarPanel physical/Run Bundle contracts
        env:
          PYTHONPATH: "src:."
        run: |
          mkdir -p reports/native_eps_component
          python -m pytest -q -s --junitxml=reports/native_eps_component/junit.xml tests/test_native_battery_component.py
      - name: Official Basilisk Thruster, FuelTank and SensorThermal physical/Run Bundle contracts
        env:
          PYTHONPATH: "src:."
        run: |
          mkdir -p reports/native_propulsion_thermal
          python -m pytest -q -s --junitxml=reports/native_propulsion_thermal/junit.xml \
            tests/test_native_thruster_component.py \
            tests/test_native_fuel_tank_component.py \
            tests/test_native_thermal_node_component.py
      - name: Verify user-selectable native component template and form contract
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q -s tests/test_p9n_component_simulation.py tests/test_parameter_presentation.py
      - name: Verify P9-N4 native preflight rejection contract
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q -s tests/test_p9n_n4_preflight.py

      - name: Verify EPS and Comm/Data sealed Run Bundle and multi-rate API contracts
        env:
          PYTHONPATH: "src:."
        run: |
          mkdir -p reports/native_subsystem_eps_comm_data
          python -m pytest -q -s --junitxml=reports/native_subsystem_eps_comm_data/subsystem_api.xml tests/test_multi_rate_fmea_unified_subsystems.py
      - name: Verify EPS and Comm/Data event severity against native Basilisk inputs
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q -s --junitxml=reports/native_subsystem_eps_comm_data/effect_events.xml \
            tests/test_event_severity.py \
            tests/test_eps_unified_effects.py \
            tests/test_comm_data_unified_effects.py
      - name: Verify EPS and Comm/Data paired physical A/B with sealed Run Bundles
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q -s --junitxml=reports/native_subsystem_eps_comm_data/effect_ab.xml \
            tests/test_native_eps_comm_data_effects_bundle.py
      - name: Verify ADCS sensor-frame transformations and native closed-loop Run Bundle
        env:
          PYTHONPATH: "src:."
        run: |
          mkdir -p reports/native_adcs
          python -m pytest -q -s --junitxml=reports/native_adcs/adcs_closed_loop.xml tests/test_unified_native_migration.py -k "adcs_unified_runtime_is_closed_loop_and_recorder_grounded or adcs_fusion_transforms_non_identity_sensor_mounts_into_body_frame"
          python -m pytest -q -s --junitxml=reports/native_adcs/adcs_sealed_bundle.xml tests/test_native_adcs_subsystem_bundle.py
          python -m pytest -q -s --junitxml=reports/native_adcs/adcs_fault_effects.xml tests/test_native_adcs_fault_effects.py
          python -m pytest -q -s tests/test_formal_effect_evidence_contracts.py -k unified_effect_contracts_are_declared_and_registered
          python -m pytest -q -s --junitxml=reports/native_subsystem_eps_comm_data/formal_effects.xml \
            tests/test_formal_effect_evidence_contracts.py -k test_each_unified_effect_has_formal_runtime_pass
          python -m pytest -q -s tests/test_p9n5_adcs_guided_event_catalog.py
      - name: Determine whether the browser surface changed
        id: browser_scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags origin "$BASE_SHA" --depth=1
          changed_paths="$(git diff --name-only "$BASE_SHA" HEAD)"
          printf '%s\n' "$changed_paths"
          if printf '%s\n' "$changed_paths" | grep -Eq '^(src/sat_sim/web/|tests/test_guided_task_workspace_browser.py$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install Chromium for the guided component/subsystem workflow
        if: steps.browser_scope.outputs.run == 'true'
        run: |
          python -m pip install "playwright==1.57.0"
          python -m playwright install --with-deps chromium
      - name: Resolve Chromium executable for the guided workbench test
        if: steps.browser_scope.outputs.run == 'true'
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              print(f"SAT_SIM_BROWSER_EXECUTABLE={playwright.chromium.executable_path}")
          PY
      - name: Confirm the ADCS fault wizard browser test is selected
        if: steps.browser_scope.outputs.run == 'true'
        env:
          PYTHONPATH: "src:."
        run: |
          selected="$(python -m pytest --collect-only -q tests/test_guided_task_workspace_browser.py -k guided_native_adcs_wizard_runs_verified_torque_authority_degradation)"
          printf '%s\n' "$selected"
          printf '%s\n' "$selected" | grep -Fq '::test_guided_native_adcs_wizard_runs_verified_torque_authority_degradation'

      - name: Confirm EPS and Comm/Data subsystem browser journeys are selected
        if: steps.browser_scope.outputs.run == 'true'
        env:
          PYTHONPATH: "src:."
        run: |
          selected="$(python -m pytest --collect-only -q tests/test_guided_task_workspace_browser.py -k guided_native_subsystem_workbench_runs_eps_and_comm_data)"
          printf '%s\n' "$selected"
          printf '%s\n' "$selected" | grep -Fq '::test_guided_native_subsystem_workbench_runs_eps_and_comm_data'
      - name: Verify guided native component and subsystem selection and real Runs
        if: steps.browser_scope.outputs.run == 'true'
        env:
          PYTHONPATH: "src:."
        run: |
          python -m pytest -q -s tests/test_guided_task_workspace_browser.py \
            -k "guided_component_reaction_wheel or guided_single_component_shortcut or guided_native_rw_preflight or guided_native_sensor_workbench or guided_native_subsystem_workbench or guided_native_adcs_wizard_runs_verified_torque_authority_degradation"

      - name: Archive Basilisk-native component physical and test evidence
        uses: actions/upload-artifact@v7
        with:
          name: native-component-physical-evidence
          path: |
            reports/native_component_sensor/junit.xml
            reports/native_eps_component/junit.xml
            reports/native_propulsion_thermal/junit.xml
            reports/native_adcs/adcs_closed_loop.xml
            reports/native_adcs/adcs_sealed_bundle.xml
            reports/native_adcs/adcs_fault_effects.xml
            reports/native_subsystem_eps_comm_data/subsystem_api.xml
            reports/native_subsystem_eps_comm_data/effect_events.xml
            reports/native_subsystem_eps_comm_data/effect_ab.xml
            reports/native_subsystem_eps_comm_data/effect_ab.json
            reports/native_subsystem_eps_comm_data/formal_effects.xml
            reports/native_rw_component_probe/physical_ab.json
            reports/native_rw_cluster/physics_ab.json
          if-no-files-found: error

name: R83j Actual Basilisk Native Scheduled FSW Reference Pilot

on:
  pull_request:
    paths:
      - 'src/sat_sim/experiments/native_fsw_scheduled_reference_lab.py'
      - 'tests/test_r83j_native_fsw_reference_schedule.py'
      - '.github/workflows/r83j-native-fsw-reference-excitation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-contracts:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: '3.11'
          - os: ubuntu-24.04
            python-version: '3.12'
          - os: windows-2025
            python-version: '3.11'
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build with only metadata/test requirements (no test simulator)
        run: |
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Reject unsafe schedules and unapproved motor override
        run: python -m pytest -q tests/test_r83j_native_fsw_reference_schedule.py

  genuine-native-scheduled-fsw:
    needs: command-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Pin official bsk 2.11.0 original wheel before any native execution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r83j/wheel" "$RUNNER_TEMP/r83j/compat" "$RUNNER_TEMP/r83j/evidence"
          python -m pip download --only-binary=:all: --no-deps \
            --dest "$RUNNER_TEMP/r83j/wheel" "bsk==2.11.0"
          python - <<'PY'
          import hashlib,os
          from pathlib import Path
          files=list((Path(os.environ["RUNNER_TEMP"])/"r83j/wheel").glob("bsk-2.11.0-*.whl"))
          expected="d51fe1ffa1b0b03dc415034b210497b28a2504428d4d8e71b481542a08c08a0a"
          if len(files)!=1 or hashlib.sha256(files[0].read_bytes()).hexdigest()!=expected:
              raise RuntimeError("R83J_ORIGINAL_OFFICIAL_NATIVE_WHEEL_MISMATCH")
          print("R83J_PINNED_BASILISK_ORIGINAL_WHEEL_SHA256",expected)
          PY
          python scripts/build_bsk_compat_wheels.py \
            "$RUNNER_TEMP"/r83j/wheel/bsk-2.11.0-*.whl \
            --output-dir "$RUNNER_TEMP/r83j/compat" \
            --report "$RUNNER_TEMP/r83j/evidence/compat_payload_review.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"r83j/evidence/compat_payload_review.json").read_text())["results"][0]
          if not x["payload_bytes_unchanged"] or x["payload_file_count"]<800:
              raise RuntimeError("R83J_NATIVE_BASILISK_ORIGINAL_PAYLOAD_CHANGED")
          PY
      - name: Install actual native bsk and source with no dynamics proxy
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "$RUNNER_TEMP"/r83j/compat/bsk-2.11.0+satfix1-*.whl
          python -m pip install -e .
          python - <<'PY'
          from importlib.metadata import version
          from Basilisk.simulation import spacecraft, reactionWheelStateEffector
          from Basilisk.fswAlgorithms import inertial3D, attTrackingError, mrpFeedback, rwMotorTorque
          assert version("bsk") == "2.11.0+satfix1"
          print("R83J_NATIVE_FSW_DYNAMICS_CHAIN_MODULES_IMPORTED")
          PY
      - name: Execute physically coupled 2-arm Basilisk FSW schedule, preserve non-qualification
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from sat_sim.experiments.native_fsw_scheduled_reference_lab import compare_native_fsw_reference_experiment
          report=compare_native_fsw_reference_experiment()
          path=Path(os.environ["RUNNER_TEMP"])/"r83j/evidence/actual_original_native_fsw_schedule.json"
          path.write_text(json.dumps(report,indent=2,sort_keys=True,allow_nan=False)+"\n")
          assert report["source_physics_real_native"] is True
          assert report["pre_event_speed_abs_difference"]<1e-8
          assert report["post_event_max_rw_speed_difference_rad_s"]>1e-8
          assert report["post_event_max_motor_command_difference_nm"]>1e-8
          assert report["independent_hardware_safety_certified"] is False
          assert report["fault_diagnosis_generalization_measured"] is False
          print("R83J_REAL_BASILISK_REFERENCE_MESSAGE_TO_RW_PHYSICS",
                report["post_event_max_rw_speed_difference_rad_s"])
          if not report["limits_within_provisional_lab_envelope"]:
              raise RuntimeError("R83J_PROVISIONAL_REQUEST_OR_WHEEL_SPEED_LIMIT_EXCEEDED")
          PY
      - name: Archive actual C-backed Basilisk FSW and RW source message evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r83j-actual-native-basilisk-scheduled-reference-physics
          if-no-files-found: warn
          retention-days: 21
          path: ${{ runner.temp }}/r83j/evidence/

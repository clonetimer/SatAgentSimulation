[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-simulation-platform"
version = "0.7.8"
description = "Basilisk-based satellite simulation platform with a constrained TaskSpec Agent."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "bsk==2.11.0+satfix1",
  "colorama==0.4.6",
  "sgp4==2.25",
  "numpy==2.2.6; python_version < '3.11'",
  "numpy==2.3.5; python_version >= '3.11'",
  "joblib==1.5.3",
  "scikit-learn==1.9.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
api = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "uvicorn==0.48.0",
  "httpx==0.28.1",
]
dev = [
  "pytest==9.0.3",
  "build==1.5.0",
  "ruff==0.15.22",
  "pip-audit==2.10.1",
  "wheel==0.46.2",
]
ui-test = [
  "playwright==1.57.0",
]

[project.scripts]
sat-sim = "sat_sim.cli:main"
sat-agent = "sat_sim.agent_cli:main"
sat-experience = "sat_sim.experience_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"sat_sim" = ["release_manifest.json", "release_baseline.json", "web/*.html", "web/*.css", "web/*.js"]
"sat_sim.schemas" = ["*.json"]
"sat_sim.capabilities" = ["*.yaml", "*.yml"]
"sat_sim.evals" = ["*.json"]
"sat_sim.evidence" = ["*.json"]
"sat_sim.calibration_data" = ["*.json"]
"sat_sim.experiment_templates.adcs" = ["*.yaml", "*.yml"]
"sat_sim.diagnostic_signatures.adcs" = ["*.yaml", "*.yml"]
"sat_sim.fault_mechanisms.adcs" = ["*.yaml", "*.yml"]
"sat_sim.fault_mechanisms.eps" = ["*.yaml", "*.yml"]
"sat_sim.telemetry_feature_contracts.adcs" = ["*.yaml", "*.yml"]
"sat_sim.telemetry_feature_contracts.eps" = ["*.yaml", "*.yml"]
"sat_sim.diagnostic_pipelines.adcs" = ["*.yaml", "*.yml"]
"sat_sim.diagnostic_pipelines.eps" = ["*.yaml", "*.yml"]
"sat_sim.actuator_contracts.adcs" = ["*.json"]
"parameters" = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

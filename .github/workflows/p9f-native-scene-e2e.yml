name: P9-F genuine native UI to scene acceptance
on:
  push:
    branches: [audit/p9f-native-browser-20261114]
  pull_request:
    paths:
      - 'src/sat_sim/web/**'
      - 'src/sat_sim/interactive/**'
      - 'tests/test_p9f_native_browser.py'
      - 'tests/test_p9f_wheel_assets.py'
      - 'pyproject.toml'
      - '.github/workflows/p9f-native-scene-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:.'
      SAT_SIM_P9F_NATIVE_BROWSER_TEST: '1'
      SAT_SIM_P9F_EVIDENCE: reports/p9f-native
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact native browser and build dependencies
        run: >-
          python -m pip install bsk==2.11.0 sgp4==2.25 colorama==0.4.6
          numpy==2.3.5 pydantic==2.13.4 jsonschema==4.26.0 PyYAML==6.0.3
          joblib==1.5.3 scikit-learn==1.9.0 psutil==7.2.2 numba==0.63.1
          pytest==9.0.3 fastapi==0.139.2 starlette==1.3.1 httpx==0.28.1
          playwright==1.57.0 uvicorn==0.48.0 websockets==17.4
          build==1.5.0 setuptools==84.1.0 wheel==0.46.2
      - name: Stage pinned scene assets and real browser
        run: |
          python scripts/vendor_scene_assets.py
          python -m playwright install --with-deps chromium
      - name: Native bounded and supervised continuous UI journeys
        run: |
          python -c "import Basilisk; print(Basilisk.__version__)"
          python -m pytest -q tests/test_p9f_native_browser.py --junitxml=reports/p9f-native/junit.xml
      - name: Verify real wheel contains scene module
        env:
          SAT_SIM_P9F_WHEEL_DIR: dist-p9f
        run: |
          python -m build --wheel --no-isolation --outdir dist-p9f
          python -m pytest -q tests/test_p9f_wheel_assets.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p9f-native-scene-evidence
          path: reports/p9f-native/

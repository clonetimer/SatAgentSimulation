operator:
  owner: unified_native_adcs
  effects:
  - effect_id: nominal
    kind: nominal
    owner: unified_native_adcs
    implementation: basilisk_native
    evidence_fields:
    - runtime_truth_status
    - adcs.pointing_error_deg
    - adcs.fusion.estimated_mrp_BN_*
    - adcs.fusion.estimated_omega_BN_B_*
    - adcs.fusion.magnetometer_used
    - adcs.rw.speed_rad_s_0
    verification: candidate
  - effect_id: adcs_rw_jamming
    kind: fault
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_torque_ratio_0
    - adcs.control.applied_torque_nm_0
    - adcs.rw.speed_rad_s_0
    verification: declared
  - effect_id: adcs_rw_motor_failure
    kind: fault
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_torque_ratio_0
    - adcs.rw.effective_max_torque_nm_0
    - adcs.control.applied_torque_nm_0
    verification: declared
  - effect_id: gyro_bias_step
    kind: fault
    owner: project_imu_fault_injector
    implementation: basilisk_native
    evidence_fields:
    - adcs.sensor.gyro_bias_norm_rad_s
    - adcs.sensor.gyro_measured_rad_s_x
    verification: declared
  - effect_id: gyro_noise_increase
    kind: degradation
    owner: project_imu_fault_injector
    implementation: basilisk_native
    evidence_fields:
    - adcs.sensor.gyro_noise_norm_rad_s
    verification: declared
  - effect_id: rw_friction_degradation
    kind: degradation
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_drag_nms_0
    - adcs.rw.speed_rad_s_0
    verification: declared
  - effect_id: adcs_rw_torque_authority_loss
    kind: degradation
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_torque_ratio_0
    - adcs.rw.effective_max_torque_nm_0
    - adcs.control.applied_torque_nm_0
    verification: candidate
  - effect_id: adcs_reaction_wheel_speed_limit
    kind: constraint
    owner: project_rw_command_fault_manager
    implementation: basilisk_native
    evidence_fields:
    - adcs.rw.effective_max_speed_rad_s_0
    - adcs.rw.speed_rad_s_0
    verification: declared
  observability:
    qoi:
    - runtime_truth_status
    - official_module_count
    - project_native_module_count
    - adcs_closed_loop_improved
    trace:
    - time_s
    - orbit.*
    - adcs.*
    - label.*
    - event.*
  limitations:
  - Project attitude estimation is deterministic star/Sun/magnetic-vector TRIAD plus quaternion SLERP; it is not an MEKF/Kalman filter or flight-correlated estimator.
  - StarTracker uses the official module's truth-driven attitude measurement; star catalog, centroiding, optical image formation and FOV occultation are not modelled.
  - SunDirectionSensor and EarthHorizonSensor are ideal project-native geometry measurements derived from environment/spacecraft state; they are not official CSS three-axis outputs.
  - IMU angular rate is transformed from platform frame P to body frame B; this is not a full strapdown navigation solution.
  - Magnetometer TAMSensorMsg is transformed from sensor frame S to body frame B and fused with the inertial magnetic-field reference.
  - Wheel jamming is represented by a scheduled braking/locking torque in the command path; bearing structural dynamics are not modelled.
  - The subsystem uses a dedicated spacecraft hub and orthogonal reaction-wheel fixture; it is not the full CAD-derived spacecraft inertia or a cross-subsystem integrated spacecraft run.
lifecycle:
  status: active
  product_tier: recommended
  recommended: true
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: 'Recommended ADCS path: official Basilisk modules and project SysModels
    share one Process/Task, message graph and recorder chain.'
experiments:
  official_monte_carlo:
    supported: true
    registry: sat_sim.experiments.native_controller_registry
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: mixed_native_project
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations: []
telemetry:
- adcs.rw.motor_current_a_*

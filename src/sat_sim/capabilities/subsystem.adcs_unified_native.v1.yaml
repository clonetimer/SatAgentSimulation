capability_id: subsystem.adcs_unified_native.v1
schema_version: 0.1.0
name: ADCS unified Basilisk runtime
level: subsystem
domain: adcs
target: adcs
trust_level: engineering_preview
status: agent_ready_candidate
summary: Unified ADCS closed loop and runtime fault/degradation chain executed in
  one Basilisk Process/Task. Official StarTracker, ImuSensor, Magnetometer, guidance/control,
  reaction wheels and spacecraft modules are connected through Basilisk messages. Project
  SysModels transform sensor measurements into body frame B and perform deterministic
  star/Sun/magnetic-vector attitude estimation. Sun/Earth vector sensors are ideal
  project-native geometry measurements, not official CSS direction outputs. No external
  solver or curve-only proxy is used.
adapter:
  class_path: sat_sim.adapters.subsystem_adcs_unified_native.AdcsUnifiedNativeAdapter
  script_export: true
  runtime_run: true
implementation:
  native_multi_rate_telemetry: true
  model_modules:
  - sat_sim.bsk_engine.unified_native
  - sat_sim.bsk_engine.project_native_modules
  uses_legacy_runner: false
  basilisk_required: true
  source_boundary: official_basilisk_modules_plus_project_sysmodels_and_runtime_event_injection_in_one_process_task
  mode: basilisk_unified_native_adcs
  backend_type: basilisk_native_mixed
  accepted_task_backends:
  - basilisk
  requires_allow_proxy: false
  modifier_application: native_runtime_only
modes:
  nominal:
    supported: true
  fault:
    supported: true
    timed_events_supported: true
    effects:
    - adcs_rw_jamming
    - adcs_rw_motor_failure
    - gyro_bias_step
  degradation:
    supported: true
    timed_events_supported: true
    effects:
    - gyro_noise_increase
    - rw_friction_degradation
    - adcs_rw_torque_authority_loss
  constraint:
    supported: true
    timed_events_supported: true
    effects:
    - adcs_reaction_wheel_speed_limit
parameters:
  environment_profile:
    type: string
    default: simplified
    enum: [simplified, spice_wmm]
    description: Explicit reference environment or offline DE430, Earth J2, Sun/Moon gravity and WMM2025. No fallback.
  epoch_utc:
    type: string
    default: '2026-01-01T00:00:00Z'
  spacecraft_mass_kg:
    type: number
    unit: kg
    default: 100.0
    min: 1.0
    max: 2000.0
  eccentricity:
    type: number
    unit: '1'
    default: 0.001
    min: 0.0
    max: 0.999
  raan_deg:
    type: number
    unit: deg
    default: 0.0
    min: 0.0
    max: 360.0
  arg_perigee_deg:
    type: number
    unit: deg
    default: 0.0
    min: 0.0
    max: 360.0
  initial_true_anomaly_rad:
    type: number
    unit: rad
    default: 0.0
    min: 0.0
    max: 6.283185307179586
  initial_pointing_error_deg:
    type: number
    unit: deg
    required: false
    default: 8.0
    min: 0.0
    max: 60.0
  inclination_deg:
    type: number
    unit: deg
    required: false
    default: 35.0
    min: 0.0
    max: 180.0
  orbit_radius_m:
    type: number
    unit: m
    required: false
    default: 7000000.0
    min: 6478000.0
    max: 100000000.0
  controller_k:
    type: number
    required: false
    default: 3.5
    min: 0.0
  controller_p:
    type: number
    required: false
    default: 30.0
    min: 0.0
  rw_max_torque_nm:
    type: number
    unit: N*m
    required: false
    default: 0.2
    min: 1.0e-06
    max: 0.2
  simulation_seed:
    type: integer
    required: false
    default: 0
    min: 0
    description: Deterministic seed used by project-native sensor and event modules.
  gyro_base_noise_std_rad_s:
    type: number
    unit: rad/s
    required: false
    default: 1.0e-05
    min: 0.0
    description: Baseline gyro white-noise standard deviation used before runtime
      degradations.
  star_tracker_mount_yaw_deg:
    type: number
    label: 星敏安装航向角
    description: 机体系 B 到星敏机壳系 C 的 3-2-1 欧拉角第一项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  star_tracker_mount_pitch_deg:
    type: number
    label: 星敏安装俯仰角
    description: 机体系 B 到星敏机壳系 C 的 3-2-1 欧拉角第二项。
    unit: deg
    default: 0.0
    min: -89.0
    max: 89.0
  star_tracker_mount_roll_deg:
    type: number
    label: 星敏安装横滚角
    description: 机体系 B 到星敏机壳系 C 的 3-2-1 欧拉角第三项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  star_tracker_noise_std_arcsec:
    type: number
    label: 星敏白噪声标准差
    description: 官方 Basilisk StarTracker 姿态测量噪声标准差；不代表光学星表识别精度。
    unit: arcsec
    default: 0.0
    min: 0.0
    max: 3600.0
  imu_mount_yaw_deg:
    type: number
    label: IMU 安装航向角
    description: 机体系 B 到 IMU 平台系 P 的 3-2-1 欧拉角第一项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  imu_mount_pitch_deg:
    type: number
    label: IMU 安装俯仰角
    description: 机体系 B 到 IMU 平台系 P 的 3-2-1 欧拉角第二项。
    unit: deg
    default: 0.0
    min: -89.0
    max: 89.0
  imu_mount_roll_deg:
    type: number
    label: IMU 安装横滚角
    description: 机体系 B 到 IMU 平台系 P 的 3-2-1 欧拉角第三项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  imu_position_b_x_m:
    type: number
    label: IMU 本体系位置 X
    unit: m
    default: 0.0
    min: -2.0
    max: 2.0
  imu_position_b_y_m:
    type: number
    label: IMU 本体系位置 Y
    unit: m
    default: 0.0
    min: -2.0
    max: 2.0
  imu_position_b_z_m:
    type: number
    label: IMU 本体系位置 Z
    unit: m
    default: 0.0
    min: -2.0
    max: 2.0
  imu_gyro_bias_rad_s_x:
    type: number
    label: IMU 陀螺 X 轴偏置
    unit: rad/s
    default: 0.0
    min: -0.1
    max: 0.1
  imu_gyro_bias_rad_s_y:
    type: number
    label: IMU 陀螺 Y 轴偏置
    unit: rad/s
    default: 0.0
    min: -0.1
    max: 0.1
  imu_gyro_bias_rad_s_z:
    type: number
    label: IMU 陀螺 Z 轴偏置
    unit: rad/s
    default: 0.0
    min: -0.1
    max: 0.1
  imu_accel_bias_m_s2_x:
    type: number
    label: IMU 加速度计 X 轴偏置
    unit: m/s^2
    default: 0.0
    min: -1.0
    max: 1.0
  imu_accel_bias_m_s2_y:
    type: number
    label: IMU 加速度计 Y 轴偏置
    unit: m/s^2
    default: 0.0
    min: -1.0
    max: 1.0
  imu_accel_bias_m_s2_z:
    type: number
    label: IMU 加速度计 Z 轴偏置
    unit: m/s^2
    default: 0.0
    min: -1.0
    max: 1.0
  imu_gyro_white_noise_std_rad_s:
    type: number
    label: IMU 陀螺白噪声标准差
    unit: rad/s
    default: 0.0
    min: 0.0
    max: 0.1
  imu_accel_white_noise_std_m_s2:
    type: number
    label: IMU 加速度计白噪声标准差
    unit: m/s^2
    default: 0.0
    min: 0.0
    max: 1.0
  magnetometer_mount_yaw_deg:
    type: number
    label: 磁强计安装航向角
    description: 机体系 B 到磁强计传感器系 S 的 3-2-1 欧拉角第一项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  magnetometer_mount_pitch_deg:
    type: number
    label: 磁强计安装俯仰角
    description: 机体系 B 到磁强计传感器系 S 的 3-2-1 欧拉角第二项。
    unit: deg
    default: 0.0
    min: -89.0
    max: 89.0
  magnetometer_mount_roll_deg:
    type: number
    label: 磁强计安装横滚角
    description: 机体系 B 到磁强计传感器系 S 的 3-2-1 欧拉角第三项。
    unit: deg
    default: 0.0
    min: -180.0
    max: 180.0
  magnetometer_bias_tesla_x:
    type: number
    label: 磁强计 X 轴偏置
    unit: T
    default: 0.0
    min: -0.0001
    max: 0.0001
  magnetometer_bias_tesla_y:
    type: number
    label: 磁强计 Y 轴偏置
    unit: T
    default: 0.0
    min: -0.0001
    max: 0.0001
  magnetometer_bias_tesla_z:
    type: number
    label: 磁强计 Z 轴偏置
    unit: T
    default: 0.0
    min: -0.0001
    max: 0.0001
  magnetometer_scale_factor:
    type: number
    label: 磁强计比例系数
    default: 1.0
    min: 0.000001
    max: 2.0
  rw_wheel_inertia_kg_m2:
    type: number
    default: 0.015
    minimum: 1.0e-09
    description: Reaction-wheel spin-axis inertia used by the diagnostic actuator
      contract.
  rw_motor_torque_constant_nm_per_a:
    type: number
    default: 0.02
    minimum: 1.0e-09
    description: Explicit simulation torque constant Kt used to derive signed motor
      current I=tau/Kt.
  rw_motor_current_limit_a:
    type: number
    default: 10.0
    minimum: 1.0e-09
    description: Signed motor-current saturation magnitude after I=tau/Kt derivation.

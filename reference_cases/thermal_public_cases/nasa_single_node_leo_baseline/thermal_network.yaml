schema_version: therm1b.thermal_network_template.v1
template_id: nasa_single_node_leo_baseline
display_name: Single-node LEO thermal balance engineering baseline
node_topology:
  type: single_node
  description: Single lumped external/internal-equivalent node for broad sanity checks.
nodes:
  internal:
    heat_capacity_j_k: 5000.0
    initial_temp_c: 20.0
    area_m2: 0.03
    external: true
    absorptivity: 0.6
    emissivity: 0.82
    radiator_multiplier: 1.0
conductive_links: []
radiative_links: []
environment:
  solar_flux_w_m2: 1361.0
  albedo_flux_w_m2: 120.0
  earth_ir_flux_w_m2: 237.0
  deep_space_temp_k: 3.0
  shadow_factor: 1.0
  eclipse_period_s: 5400.0
  eclipse_duration_s: 0.0
  eclipse_start_s: 0.0
  face_solar_exposure:
    internal: 0.25
  face_albedo_exposure:
    internal: 0.2
  face_earth_ir_exposure:
    internal: 0.35
attitude:
  mode: sun_pointing
internal_power_by_node_w:
  internal: 5.0
heater:
  node: internal
  power_w: 4.0
  setpoint_c: 2.0
  deadband_c: 2.0
  control:
    mode: threshold
    node: internal
    max_power_w: 4.0
    setpoint_c: 2.0
    deadband_c: 2.0
limits:
  min_temp_c_by_node:
    internal: -40.0
  max_temp_c_by_node:
    internal: 85.0
source_case:
  claim_level: public_reference_informed_not_flight_validated
  source_urls:
  - https://www.nasa.gov/smallsat-institute/sst-soa/thermal-control/
  project_sources:
  - src/subsystems/thermal/network.py
  - src/subsystems/thermal/templates.py
  notes: Topology and numerical values are conservative project engineering assumptions
    informed by public thermal-control guidance; not copied flight-correlated data.
  flight_validated: false
  case_name: NASA-guidance-informed single-node LEO engineering example
validation_limits:
  node_count: 1
  temperature_sanity_c:
  - -120.0
  - 180.0
  purpose: broad numerical sanity gate only

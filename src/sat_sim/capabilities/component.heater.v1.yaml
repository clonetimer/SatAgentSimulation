capability_id: component.heater.v1
schema_version: 0.1.0
name: Heater component simulation
level: component
domain: thermal
target: heater
trust_level: conformance_tested
status: agent_ready_candidate
summary: Source-native heater thermostat capability using components.heater.builder step_heater.
adapter:
  class_path: sat_sim.adapters.component_source_native_misc.HeaterAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules: &id001
  - components.heater.builder
  - components.heater.degradation
  - components.heater.faults
  legacy_demo_runner: components.heater.runner
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  fault:
    supported: true
    fault_types: [stuck_off, stuck_on, relay_chatter]
  degradation:
    supported: true
    degradation_types: [heating_efficiency_decay, resistance_drift]
parameters:
  max_power_w:
    type: number
    unit: W
    required: false
    default: 25.0
    min: 0.0
  setpoint_k:
    type: number
    unit: K
    required: false
    default: 285.0
    min: 0.0
  hysteresis_k:
    type: number
    unit: K
    required: false
    default: 2.0
    min: 0.0
  node_temp_k:
    type: number
    unit: K
    required: false
    default: 280.0
    min: 0.0
  node_temp_profile_k:
    type: array[number]
    unit: K
    required: false
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
consumes:
- name: simulation.duration_s
  unit: s
- name: simulation.sample_s
  unit: s
- name: parameters.max_power_w
  unit: W
- name: parameters.setpoint_k
  unit: K
- name: parameters.hysteresis_k
  unit: K
- name: parameters.node_temp_k
  unit: K
produces:
- name: thermal.heater.*
- name: label.health_state
time_grid:
  policy: task_spec_simulation_grid
  source: simulation
  duration_field: simulation.duration_s
  sample_field: simulation.sample_s
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
  - name: sample_index
    unit: count
    dtype: integer
  - name: label.health_state
    unit: enum
    dtype: string
  summary:
  - name: qoi.*
    unit: mixed
validation:
  conformance_tests:
  - test_c2c3_heater_parameter_effect_and_manifest
  - test_c2c3_heater_capability_python_export_runs
source_binding:
  mode: source_native
  status: c2c3_new_source_native_adapter
  primary_module: components.heater.builder
  source_modules: *id001
  public_api:
  - build_nominal_heater_config
  - step_heater
  legacy_demo_runner: components.heater.runner
  uses_legacy_runner: false
  basilisk_required: false
  rationale: Added in C2/C3 coverage completion as a low-risk wrapper around existing pure-Python component builder/model
    API.
fidelity_level: basic
known_physics_limits:
- source-native wrapper of existing src public API; no additional high-fidelity physics added
operator:
  owner: heater
  effects:
  - {effect_id: nominal, kind: nominal, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.power_w], verification: declared}
  - {effect_id: stuck_off, kind: fault, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.power_w, label.fault_active], verification: declared}
  - {effect_id: stuck_on, kind: fault, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.heater_on, label.fault_active], verification: declared}
  - {effect_id: relay_chatter, kind: fault, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.effective_max_power_w, label.fault_active], verification: declared}
  - {effect_id: heating_efficiency_decay, kind: degradation, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.effective_max_power_w, label.degradation_active], verification: declared}
  - {effect_id: resistance_drift, kind: degradation, owner: heater, implementation: source_native, evidence_fields: [thermal.heater.effective_max_power_w, label.degradation_active], verification: declared}
lifecycle:
  status: active
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: Active product capability.
backend_type: orchestration_wrapper
validation_basis: &id002
- conformance_tests
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: orchestration_wrapper
  basilisk_required: false
  current_agent_path_uses_basilisk: false
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/components/heater/builder.py
  validation_basis: *id002
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim flight validation, hardware calibration, or high-fidelity equivalence without external validation
    evidence.
  bsk0_notes: Current thermal capability is source/local reduced lumping or component wrapper; general high-fidelity thermal
    network is outside current claim and planned under THERM.
  planned_upgrade_path: []
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: project_deterministic_model
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - source-native wrapper of existing src public API; no additional high-fidelity physics added

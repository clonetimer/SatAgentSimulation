name: P9-E sealed Run object-result association

on:
  pull_request:
    paths:
      - "src/sat_sim/run_bundle.py"
      - "src/sat_sim/web/object-run-results.js"
      - "src/sat_sim/web/object-config-panel.js"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/web/index.html"
      - "src/sat_sim/web/satellite-scene.css"
      - "tests/js/test_p9e_object_run_results.cjs"
      - "tests/test_p9e_object_run_results.py"
      - "tests/test_capability_issue_closure.py"
      - "docs/superpowers/plans/2026-11-14-p9e-object-run-results.md"
      - ".github/workflows/p9e-object-run-results.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  object-results:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python -m pip install "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" "setuptools==84.1.0" "wheel==0.46.2" "playwright==1.57.0"
      - name: Install Chromium for browser acceptance
        if: runner.os == 'Linux'
        run: python -m playwright install chromium
      - name: Verify P9-E JavaScript resolver and existing controllers
        run: |
          node --check src/sat_sim/web/object-run-results.js
          node --check src/sat_sim/web/object-config-panel.js
          node --check src/sat_sim/web/app.js
          node --test tests/js/test_p9e_object_run_results.cjs tests/js/test_p9d_object_config_panel.cjs
      - name: Verify Run Bundle association provenance and regressions
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_p9e_object_run_results.py tests/test_capability_issue_closure.py tests/test_p9d_object_config_panel.py tests/test_p9a_object_tree_quantities.py tests/test_wizard_low_friction_ux.py tests/test_workbench_wizard.py
      - name: Verify Chromium object result panel
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: "src:."
          SAT_SIM_P9E_BROWSER_TEST: "1"
        run: python -m pytest -q tests/test_p9e_object_run_results.py -k chromium

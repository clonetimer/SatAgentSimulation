capability_id: component.power_sink.v1
schema_version: 0.1.0
name: Power Sink component simulation
level: component
domain: eps
target: power_sink
trust_level: conformance_tested
status: agent_ready_candidate
summary: Source-native simple load/power-sink capability using components.power_sink.builder demand_w.
adapter:
  class_path: sat_sim.adapters.component_source_native_misc.PowerSinkAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules: &id001
  - components.power_sink.builder
  - components.power_sink.model
  legacy_demo_runner: components.power_sink.runner
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  fault:
    supported: true
    fault_types: [overload, intermittent_load, open_load]
  degradation:
    supported: true
    degradation_types: [load_drift, efficiency_decay]
parameters:
  base_w:
    type: number
    unit: W
    required: false
    default: 10.0
    min: 0.0
  nominal_power_w:
    type: number
    unit: W
    required: false
    default: 10.0
    min: 0.0
  enabled:
    type: bool
    unit: bool
    required: false
    default: true
  mode:
    type: string
    unit: none
    required: false
    default: ''
  enabled_profile:
    type: array[bool]
    unit: bool
    required: false
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
consumes:
- name: simulation.duration_s
  unit: s
- name: simulation.sample_s
  unit: s
- name: parameters.base_w
  unit: W
- name: parameters.nominal_power_w
  unit: W
- name: parameters.enabled
  unit: bool
- name: parameters.mode
  unit: none
produces:
- name: eps.power_sink.*
- name: label.health_state
time_grid:
  policy: task_spec_simulation_grid
  source: simulation
  duration_field: simulation.duration_s
  sample_field: simulation.sample_s
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
  - name: sample_index
    unit: count
    dtype: integer
  - name: label.health_state
    unit: enum
    dtype: string
  summary:
  - name: qoi.*
    unit: mixed
validation:
  conformance_tests:
  - test_c2c3_power_sink_parameter_effect_and_manifest
  - test_c2c3_power_sink_capability_python_export_runs
source_binding:
  mode: source_native
  status: c2c3_new_source_native_adapter
  primary_module: components.power_sink.builder
  source_modules: *id001
  public_api:
  - build_nominal_power_sink_config
  - PowerSinkState
  - demand_w
  legacy_demo_runner: components.power_sink.runner
  uses_legacy_runner: false
  basilisk_required: false
  rationale: Added in C2/C3 coverage completion as a low-risk wrapper around existing pure-Python component builder/model
    API.
fidelity_level: basic
known_physics_limits:
- source-native wrapper of existing src public API; no additional high-fidelity physics added
operator:
  owner: power_sink
  effects:
  - {effect_id: nominal, kind: nominal, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w], verification: declared}
  - {effect_id: overload, kind: fault, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w, label.fault_active], verification: declared}
  - {effect_id: intermittent_load, kind: fault, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w, label.fault_active], verification: declared}
  - {effect_id: open_load, kind: fault, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w, label.fault_active], verification: declared}
  - {effect_id: load_drift, kind: degradation, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w, label.degradation_active], verification: declared}
  - {effect_id: efficiency_decay, kind: degradation, owner: power_sink, implementation: source_native, evidence_fields: [eps.power_sink.demand_w, label.degradation_active], verification: declared}
lifecycle:
  status: active
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: Active product capability.
backend_type: orchestration_wrapper
validation_basis: &id002
- conformance_tests
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: orchestration_wrapper
  basilisk_required: false
  current_agent_path_uses_basilisk: false
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/components/power_sink/builder.py
  validation_basis: *id002
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim flight validation, hardware calibration, or high-fidelity equivalence without external validation
    evidence.
  bsk0_notes: Source tree contains Basilisk-facing candidate modules, but this Agent capability does not currently require
    or guarantee Basilisk-native execution.
  planned_upgrade_path: []
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: project_deterministic_model
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - source-native wrapper of existing src public API; no additional high-fidelity physics added

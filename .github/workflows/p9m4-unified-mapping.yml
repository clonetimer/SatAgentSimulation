name: P9-M4 unified engineering asset mapping contract

on:
  pull_request:
    paths:
      - "src/sat_sim/engineering_asset_mapping.py"
      - "tests/cad/test_engineering_asset_mapping.py"
      - "docs/superpowers/plans/2026-11-17-p9m4-unified-asset-mapping.md"
      - ".github/workflows/p9m4-unified-mapping.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9m4-unified-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unified-mapping-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install test runner
        run: python -m pip install "pytest==9.0.3" "PyYAML==6.0.3"
      - name: Validate unified engineering asset mapping gates
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/cad/test_engineering_asset_mapping.py

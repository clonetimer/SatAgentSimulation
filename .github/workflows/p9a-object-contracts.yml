name: P9-A object and parameter contracts

on:
  push:
    branches: [feat/p9a-object-parameter-contracts-20261113]
  pull_request:
    paths:
      - 'src/sat_sim/workbench_catalog.py'
      - 'src/sat_sim/presentation_objects.py'
      - 'src/sat_sim/quantity_dictionary.py'
      - 'src/sat_sim/local_workbench.py'
      - 'src/sat_sim/schemas/*catalog*'
      - 'src/sat_sim/schemas/quantity_dictionary*'
      - 'scripts/start_local*'
      - 'scripts/audit_p9a_catalog.py'
      - 'tests/test_p9a*'
      - '.github/workflows/p9a-object-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Archive exact tracked source for reproducible review
        run: |
          mkdir -p p9a-source
          git rev-parse HEAD > p9a-source/source-commit.txt
          git archive --format=zip HEAD -o p9a-source/source.zip
          sha256sum p9a-source/source.zip > p9a-source/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: p9a-source-${{ github.sha }}
          path: p9a-source/
          retention-days: 7

  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned non-native test dependencies
        run: >-
          python -m pip install pytest==9.0.3 pydantic==2.13.4 jsonschema==4.26.0
          numpy==2.3.5 PyYAML==6.0.3 colorama==0.4.6 sgp4==2.25 joblib==1.5.3
          scikit-learn==1.9.0 psutil==7.2.2 fastapi==0.139.2 starlette==1.3.1
          httpx==0.28.1 uvicorn==0.48.0
      - name: Verify object semantics, exact bindings and local launch defaults
        run: >-
          python -m pytest -q tests/test_p9a_objects.py tests/test_p9a_quantities.py
          tests/test_p9a_local_workbench.py tests/test_parameter_presentation.py
          tests/test_component_primary_capabilities.py::test_all_24_components_have_active_direct_primary_capabilities
          tests/test_component_primary_capabilities.py::test_new_primary_adapters_and_contracts_declare_all_three_modes
          tests/test_workbench_wizard.py
          tests/test_script_dependency_governance.py
          --junitxml=reports/p9a/contracts.xml
      - name: Export actual registry coverage
        run: python scripts/audit_p9a_catalog.py --output-dir reports/p9a/catalog
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p9a-contracts-${{ matrix.os }}
          path: reports/p9a/
          retention-days: 14

  native-launch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: 'src'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install genuine upstream Basilisk and control-plane dependencies
        run: >-
          python -m pip install bsk==2.11.0 pytest==9.0.3 pydantic==2.13.4
          jsonschema==4.26.0 numpy==2.3.5 PyYAML==6.0.3 colorama==0.4.6
          sgp4==2.25 joblib==1.5.3 scikit-learn==1.9.0 psutil==7.2.2
          numba==0.63.1 fastapi==0.139.2 starlette==1.3.1 httpx==0.28.1
          uvicorn==0.48.0
      - name: Prepare native environment assets
        run: python scripts/fetch_environment_assets.py
      - name: Verify real ADCS and whole-spacecraft live first frames
        run: python -m pytest -q tests/test_p9a_native_launch.py --junitxml=reports/p9a/native-launch.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p9a-native-launch
          path: reports/p9a/
          retention-days: 14

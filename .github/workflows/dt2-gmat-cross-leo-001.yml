name: DT2 CROSS-LEO-001 real GMAT R2026a independent execution

on:
  pull_request:
    paths:
      - ".github/workflows/dt2-gmat-cross-leo-001.yml"
      - "scripts/dt2_cross_leo_001.py"
      - "scripts/dt2_sun_anchor.py"
      - "tests/test_dt2_sun_anchor.py"
      - "tests/test_dt2_cross_leo_001.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-gmat-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install exact genuine Basilisk source runtime
        run: |
          python -m pip install "bsk==2.11.0" "numpy==2.3.5" "pytest==9.0.3"
          python -m pytest -q tests/test_dt2_cross_leo_001.py tests/test_dt2_sun_anchor.py
      - name: Run actual Basilisk and freeze source-state CSV
        run: |
          python scripts/dt2_cross_leo_001.py basilisk \
            --output reports/dt2-cross-leo-001 \
            --checkout-sha "$(git rev-parse HEAD)"
      - name: Download and record official GMAT R2026a Ubuntu binary archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gmat-release"
          release="https://downloads.sourceforge.net/project/gmat/GMAT/GMAT-R2026a/gmat-ubuntu-x64-R2026a.tar.gz"
          archive="$RUNNER_TEMP/gmat-ubuntu-x64-R2026a.tar.gz"
          curl -fLsS --retry 3 --retry-delay 6 --connect-timeout 30 --max-time 900 \
            --write-out "effective_url=%{url_effective}\nhttp_code=%{http_code}\n" \
            -o "$archive" "$release" > reports/dt2-cross-leo-001/gmat_archive_download.txt
          python - "$archive" <<'PY'
          import hashlib, json, pathlib, sys
          src=pathlib.Path(sys.argv[1])
          size=src.stat().st_size
          if size < 250_000_000:
              raise RuntimeError(f"GMAT_RELEASE_TOO_SMALL_OR_HTML: {size}")
          info={
            "release": "GMAT R2026a (official published Ubuntu archive)",
            "url": "https://downloads.sourceforge.net/project/gmat/GMAT/GMAT-R2026a/gmat-ubuntu-x64-R2026a.tar.gz",
            "bytes": size,
            "archive_sha256": hashlib.file_digest(src.open("rb"), "sha256").hexdigest(),
            "note": "SHA documents the fetched bytes; independent publisher signature not established",
          }
          pathlib.Path("reports/dt2-cross-leo-001/gmat_release_archive.json").write_text(
              json.dumps(info, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print("REAL_GMAT_RELEASE_ARCHIVE", json.dumps(info, sort_keys=True))
          PY
          # Observe the official archive's actual layout instead of assuming
          # that its launcher is a regular file named exactly GmatConsole.
          # On failure, the file inventories are uploaded as immutable evidence.
          tar -tzf "$archive" > reports/dt2-cross-leo-001/gmat_archive_filelist.txt
          tar -xzf "$archive" -C "$RUNNER_TEMP/gmat-release"
          find "$RUNNER_TEMP/gmat-release" -maxdepth 8 -print \
            > reports/dt2-cross-leo-001/gmat_extracted_filelist.txt
          grep -i 'console' reports/dt2-cross-leo-001/gmat_archive_filelist.txt | head -40 || true
          binary="$(find "$RUNNER_TEMP/gmat-release" -iname '*gmatconsole*' -print -quit)"
          if [ -z "$binary" ]; then
            echo "GMAT_CONSOLE_NOT_FOUND: inspect the archived original file listing"
            sed -n '1,80p' reports/dt2-cross-leo-001/gmat_archive_filelist.txt
            exit 1
          fi
          if [ -d "$binary" ]; then echo "GMAT_CONSOLE_MATCH_IS_DIRECTORY=$binary"; exit 1; fi
          binary="$(readlink -f "$binary")"
          if [ ! -f "$binary" ]; then echo "GMAT_CONSOLE_SYMLINK_TARGET_MISSING=$binary"; exit 1; fi
          chmod +x "$binary"
          printf 'GMAT_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
          echo "ACTUAL_GMAT_BINARY=$binary"
          sha256sum "$binary" | tee reports/dt2-cross-leo-001/gmat_console_binary_sha256.txt
          ldd "$binary" > reports/dt2-cross-leo-001/gmat_binary_ldd.txt 2>&1 || true
      - name: Execute actual GMATConsole and require authentic 91-state report
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py gmat \
            --output reports/dt2-cross-leo-001 \
            --executable "$GMAT_BIN" --timeout-s 600
      - name: Execute genuine GMAT matched Earth-Mu control using same initial state
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py gmat-mu-control \
            --output reports/dt2-cross-leo-001 \
            --executable "$GMAT_BIN" --timeout-s 600
      - name: Compare genuine dual-engine state traces without claiming flight PASS
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py compare --output reports/dt2-cross-leo-001
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          info=json.loads((root/"gmat_execution.json").read_text())
          manifest=json.loads((root/"case_manifest.json").read_text())
          result=json.loads((root/"comparison_diagnostic.json").read_text())
          assert info["status"]=="GMAT_EXECUTED_UNQUALIFIED_ALIGNMENT"
          assert info["rows"]==91
          assert info["report_present"]
          assert info["binary_sha256"]==hashlib.sha256(Path(info["binary_path"]).read_bytes()).hexdigest()
          assert info["report_sha256"]==hashlib.sha256((root/"gmat_raw.txt").read_bytes()).hexdigest()
          assert manifest["evidence"]["basilisk_executed"]
          assert manifest["evidence"]["gmat_executed"]
          assert any("actual GMAT executed" in note
                     for note in manifest["limitations"])
          assert not any("no external GMAT execution" in note
                         for note in manifest["limitations"])
          assert manifest["external_vv_status"]=="INCONCLUSIVE"
          assert manifest["evidence"]["gmat_report_sha256"]==info["report_sha256"]
          assert not manifest["frames"]["independent_alignment_approved"]
          assert result["paired_samples"]==91 and result["aligned_samples"]==0
          assert result["status"]=="INCONCLUSIVE"
          assert result["time_alignment_status"]=="UNAPPROVED_RAW_ENGINE_TIME_SKEW_RETAINED"
          assert 0. <= result["reported_gmat_time_skew_max_abs_s"] <= result["input_representation_budget_s"]
          print("DT2_REAL_GMAT_EXECUTED rows=91 status=INCONCLUSIVE "
                "flight_validation=false independent_time_frame_mu_alignment=false")
          PY
      - name: Diagnose actual GMAT constant-sensitivity without declaring V-and-V PASS
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py compare-mu-control \
            --output reports/dt2-cross-leo-001
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          m=json.loads((root/"case_manifest.json").read_text())
          c=json.loads((root/"gmat_mu_control_execution.json").read_text())
          d=json.loads((root/"mu_control_diagnostic.json").read_text())
          assert m["evidence"]["gmat_executed"]
          assert m["evidence"]["gmat_mu_control_executed"]
          assert c["status"]=="GMAT_MU_CONTROL_EXECUTED_UNQUALIFIED_ALIGNMENT"
          assert c["rows"]==91
          assert c["return_code"]==0
          assert c["release_r2026a_verified"]
          assert hashlib.sha256((root/"gmat_mu_control_raw.txt").read_bytes()).hexdigest()==c["report_sha256"]
          assert d["status"]=="INCONCLUSIVE" and d["paired_samples"]==91
          assert d["approved_aligned_samples"]==0
          assert d["mu_actual_basilisk_m3_s2"]==d["mu_overridden_in_actual_gmat_m3_s2"]
          assert not d["model_acceptance_limits_approved"]
          assert not d["independent_frame_time_alignment_approved"]
          print("DT2_REAL_GMAT_MU_CONTROL "
                f"original_final_m={d['original_final_pos_m']:.9e} "
                f"matched_final_m={d['matched_mu_final_pos_m']:.9e} "
                "status=INCONCLUSIVE approval=false")
          PY

      - name: Independently diagnose real three-state evidence against exact circular two-body solution
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py analytic-reference --output reports/dt2-cross-leo-001
          python - <<'PY'
          import csv,json,math
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          d=json.loads((root/"analytic_reference_diagnostic.json").read_text())
          with (root/"analytic_reference_difference_rows.csv").open() as f:
              rows=list(csv.DictReader(f))
          assert d["status"]=="INCONCLUSIVE" and len(rows)==91
          assert d["paired_samples"]==91 and d["approved_frame_time_aligned_samples"]==0
          assert not d["independent_frame_mapping_approved"]
          assert not d["absolute_time_scale_mapping_approved"]
          assert not d["mission_residual_acceptance_limits_approved"]
          assert not d["reference_is_flight_measurement"]
          pos=d["nominal_time_closed_form_position_m"]
          raw=d["raw_reported_time_closed_form_position_m"]
          assert all(math.isfinite(pos[name]["max"]) and pos[name]["max"]>=0
                     for name in ("basilisk","gmat_default_mu","gmat_basilisk_mu_control"))
          assert math.isfinite(raw["gmat_basilisk_mu_control"]["max"])
          print("DT2_CLOSED_FORM_ACTUAL_DIAGNOSTIC "
                f"bsk_nominal_max_m={pos['basilisk']['max']:.9e} "
                f"gmat_matched_nominal_max_m={pos['gmat_basilisk_mu_control']['max']:.9e} "
                f"gmat_matched_raw_clock_max_m={raw['gmat_basilisk_mu_control']['max']:.9e} "
                "status=INCONCLUSIVE frame_time_approved=false")
          PY

      - name: Execute actual GMAT EarthMJ2000Eq ICRF UTC TAI TT frame-time probe
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py gmat-frame-time-probe \
            --output reports/dt2-cross-leo-001 \
            --executable "$GMAT_BIN" --timeout-s 600
      - name: Verify real GMAT two-frame and absolute numerical epoch report without scientific PASS
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          manifest=json.loads((root/"case_manifest.json").read_text())
          receipt=json.loads((root/"gmat_frame_time_execution.json").read_text())
          diag=json.loads((root/"gmat_frame_time_diagnostic.json").read_text())
          assert receipt["status"]=="GMAT_FRAME_TIME_REPORTED_UNQUALIFIED_ABSOLUTE_TIE"
          assert receipt["return_code"]==0 and receipt["rows"]==91
          assert receipt["executable_sha256"]==manifest["evidence"]["gmat_binary_sha256"]
          assert manifest["evidence"]["gmat_frame_time_probe_executed"]
          assert hashlib.sha256((root/"gmat_frame_time_raw.txt").read_bytes()).hexdigest()==receipt["frame_time_report_sha256"]
          assert hashlib.sha256((root/"gmat_frame_time_executed.script").read_bytes()).hexdigest()==receipt["script_sha256"]
          with (root/"gmat_frame_time_rows.csv").open() as stream:
              rows=list(csv.DictReader(stream))
          assert len(rows)==91
          assert diag["status"]=="INCONCLUSIVE"
          assert diag["gmat_epoch_jd_offset"]==2430000.
          assert diag["certified_basilisk_n_axis_aligned_samples"]==0
          assert not diag["independent_basilisk_n_to_gmat_axis_mapping_approved"]
          assert not diag["independent_absolute_basilisk_clock_alignment_approved"]
          assert not diag["mission_accuracy_budget_approved"]
          print("DT2_ACTUAL_GMAT_FRAME_TIME "
                f"tai_utc_s={diag['tai_minus_utc_s']:.9f} "
                f"tt_tai_s={diag['tt_minus_tai_s']:.9f} "
                f"mj_icrf_max_delta_m={diag['max_same_gmat_mj2000eq_icrf_position_difference_m']:.9e} "
                "status=INCONCLUSIVE cross_engine_frame_certified=false")
          PY
      - name: Execute actual pinned-DE421 Sun and Luna vectors in GMAT Basilisk and NAIF
        shell: bash
        run: |
          python -m pip install "spiceypy==8.4.0"
          python scripts/dt2_sun_anchor.py \
            --output reports/dt2-cross-leo-001 \
            --gmat-root "$RUNNER_TEMP/gmat-release/GMAT/R2026a" \
            --gmat-executable "$GMAT_BIN"
      - name: Verify authentic three-engine celestial evidence without declaring frame PASS
        shell: bash
        run: |
          python - <<'PY'
          import csv,hashlib,json,math
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          r=json.loads((root/"sun_anchor_execution.json").read_text())
          assert r["status"]=="REAL_THREE_ENGINE_CELESTIAL_SOURCE_OBSERVED_INCONCLUSIVE"
          assert r["gmat_exit_code"]==0
          assert r["real_sample_count"]==3
          assert r["real_moon_sample_count"]==3
          assert r["same_process_native_clock_real_sample_count"]==3
          assert r["same_process_native_spacecraft_real_sample_count"]==91
          assert r["spacecraft_N_axis_independently_certified"] is False
          clock=json.loads((root/"basilisk_same_process_clock_diagnostic.json").read_text())
          assert clock["status"]=="INCONCLUSIVE"
          assert clock["native_spacecraft_replay_rows"]==91
          assert clock["native_spice_time_message_rows"]==3
          assert not clock["original_spacecraft_baseline_mutated"]
          assert not clock["absolute_Basilisk_spacecraft_N_to_EarthICRF_approved"]
          assert not clock["absolute_GMAT_A1_to_Basilisk_ET_approved"]
          assert clock["independently_qualified_cross_engine_samples"]==0
          assert not clock["mission_accuracy_budget_approved"]
          for file,sha in (
              ("basilisk_same_process_spacecraft.csv",r["same_process_native_replay_states_sha256"]),
              ("basilisk_same_process_clock.csv",r["same_process_native_clock_rows_sha256"]),
              ("basilisk_same_process_clock_diagnostic.json",r["same_process_native_clock_diagnostic_sha256"]),
              ("basilisk_state.csv",clock["source_baseline_sha256"]),
              ("gmat_frame_time_rows.csv",clock["original_GMAT_frame_time_csv_sha256"])):
              assert hashlib.sha256((root/file).read_bytes()).hexdigest()==sha
          with (root/"basilisk_same_process_clock.csv").open(newline="") as f:
              clock_rows=list(csv.DictReader(f))
          assert [int(float(x["sample_index"])) for x in clock_rows]==[0,45,90]
          assert all(math.isfinite(float(x["native_minus_naif_ET_s"])) for x in clock_rows)
          print("DT2_NATIVE_BSK_SAME_PROCESS_CLOCK "
                f"native_naif_et_delta_max_s={clock['max_native_spice_ET_minus_naif_ET_abs_s']:.9e} "
                f"replay_position_max_m={clock['max_native_spacecraft_replay_position_vs_sealed_baseline_m']:.9e} "
                f"replay_velocity_max_m_s={clock['max_native_spacecraft_replay_velocity_vs_sealed_baseline_m_s']:.9e} "
                "status=INCONCLUSIVE certified_absolute_N=false")
          assert r["gmat_moon_report_produced"]
          assert hashlib.sha256((root/"gmat_moon_anchor_raw.txt").read_bytes()).hexdigest()==r["gmat_moon_report_sha256"]
          assert hashlib.sha256((root/"moon_anchor_three_engines.csv").read_bytes()).hexdigest()==r["moon_anchor_comparison_csv_sha256"]
          with (root/"moon_anchor_three_engines.csv").open(newline="") as f:
              moon_rows=list(csv.DictReader(f))
          assert [int(row["time_s"]) for row in moon_rows]==[0,2700,5400]
          assert all(math.isfinite(float(v)) for row in moon_rows for v in row.values())
          pair=r["sun_moon_direction_geometry"]
          bridge=json.loads((root/"gmat_mj_naif_frame_probe.json").read_text())
          assert hashlib.sha256((root/"gmat_mj_naif_frame_probe.json").read_bytes()).hexdigest()==r["frame_bridge_diagnostic_sha256"]
          assert hashlib.sha256((root/"gmat_mj_naif_frame_probe_rows.csv").read_bytes()).hexdigest()==r["frame_bridge_rows_sha256"]
          assert hashlib.sha256((root/"gmat_mj_naif_frame_probe_rows.csv").read_bytes()).hexdigest()==bridge["holdout_rows_csv_sha256"]
          assert bridge["status"]=="INCONCLUSIVE"
          assert bridge["spacecraft_holdout_samples"]==91
          assert bridge["original_pointmass_orbit_frame_time_qualified_samples"]==0
          assert not bridge["original_basilisk_N_to_ICRF_approved"]
          assert not bridge["mission_accuracy_budget_approved"]
          assert math.isclose(bridge["reference_rotation_determinant"],1.,rel_tol=0,abs_tol=1e-12)
          assert all(math.isfinite(v) and v>=0 for v in (
              bridge["max_position_residual_m"],bridge["max_velocity_residual_m_s"]))
          for source_file,sha in (
              ("gmat_sun_anchor_raw.txt",bridge["source_sha256"]["gmat_sun_raw"]),
              ("gmat_moon_anchor_raw.txt",bridge["source_sha256"]["gmat_moon_raw"]),
              ("gmat_frame_time_rows.csv",bridge["source_sha256"]["gmat_frame_time_rows"])):
              assert hashlib.sha256((root/source_file).read_bytes()).hexdigest()==sha
          with (root/"gmat_mj_naif_frame_probe_rows.csv").open(newline="") as f:
              heldout=list(csv.DictReader(f))
          assert len(heldout)==91
          assert float(heldout[-1]["gmat_original_elapsed_s"])<5400
          assert len(pair["sun_moon_separation_deg_by_epoch"])==3
          assert len(pair["rotation_information_condition_by_epoch"])==3
          assert pair["scientific_verdict"]=="INCONCLUSIVE"
          assert pair["original_pointmass_n_axes_externally_certified"] is False
          assert r["basilisk_spice_kernel_pool_verified"] is True
          assert r["basilisk_spice_pinned_kernel_count"]==3
          geometry=r["sun_direction_triplet_geometry"]
          assert geometry["absolute_inertial_frame_tie_approved"] is False
          assert len(geometry["normalized_sun_direction_singular_values"])==3
          assert len(geometry["rotation_information_eigenvalues"])==3
          assert all(math.isfinite(v) and v>=0
                     for v in geometry["rotation_information_eigenvalues"])
          assert all(math.isfinite(v) and v>=0
                     for v in geometry["normalized_sun_direction_singular_values"])
          assert 0<=geometry["max_pairwise_sun_direction_separation_deg"]<=180
          assert r["scientific_verdict"]=="INCONCLUSIVE"
          assert not r["independent_physical_basilisk_n_to_icrf_tie_approved"]
          assert not r["original_pointmass_n_axes_externally_certified"]
          for name,field in (("gmat_sun_anchor_executed.script","gmat_script_sha256"),
                              ("gmat_sun_anchor_raw.txt","gmat_sun_report_sha256"),
                              ("sun_anchor_three_engines.csv","sun_anchor_comparison_csv_sha256")):
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==r[field]
          with (root/"sun_anchor_three_engines.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert [int(row["time_s"]) for row in rows]==[0,2700,5400]
          assert all(math.isfinite(float(v)) for row in rows for v in row.values())
          print("DT2_REAL_SUN_FRAME_ANCHOR "
                f"gmat_naif_arcsec={r['max_gmat_icrf_vs_naif_j2000_angle_arcsec']:.9e} "
                f"bsk_naif_arcsec={r['max_basilisk_n_vs_naif_j2000_angle_arcsec']:.9e} "
                f"sun_max_sep_deg={geometry['max_pairwise_sun_direction_separation_deg']:.9e} "
                f"sun_triplet_condition={geometry['sun_triplet_condition_number']} "
                f"rotation_information_condition={geometry['rotation_information_condition_number']} "
                f"sun_moon_sep_deg={pair['sun_moon_separation_deg_by_epoch']} "
                f"moon_gmat_naif_max_m={r['max_gmat_moon_icrf_vs_naif_j2000_pos_m']:.9e} "
                f"moon_bsk_naif_max_m={r['max_basilisk_moon_n_vs_naif_j2000_pos_m']:.9e} "
                f"mj_naif_heldout_max_pos_m={bridge['max_position_residual_m']:.9e} "
                f"mj_naif_heldout_max_vel_m_s={bridge['max_velocity_residual_m_s']:.9e} "
                "status=INCONCLUSIVE original_pointmass_n_axis_certified=false")
          PY
      - name: Execute genuine EarthICRF GMAT numeric-state control, hold original baseline fixed
        shell: bash
        run: |
          python scripts/dt2_cross_leo_001.py gmat-icrf-numeric-control \
            --output reports/dt2-cross-leo-001 \
            --executable "$GMAT_BIN" --timeout-s 600
          python - <<'PY'
          import csv,hashlib,json,math
          from pathlib import Path
          root=Path("reports/dt2-cross-leo-001")
          receipt=json.loads((root/"gmat_icrf_numeric_execution.json").read_text())
          d=json.loads((root/"gmat_icrf_numeric_diagnostic.json").read_text())
          assert receipt["status"]=="GMAT_ICRF_NUMERIC_INITIAL_EXECUTED_UNQUALIFIED_N_TIE"
          assert receipt["scientific_verdict"]=="INCONCLUSIVE"
          assert receipt["rows"]==91 and receipt["return_code"]==0
          assert receipt["state_input_frame_declared_in_GMAT"]=="EarthICRF"
          assert not receipt["original_basilisk_N_to_EarthICRF_tie_independently_approved"]
          assert not receipt["absolute_time_alignment_approved"]
          assert not receipt["mission_accuracy_budget_approved"]
          assert d["status"]=="INCONCLUSIVE"
          assert d["paired_samples"]==91 and d["independently_frame_time_aligned_samples"]==0
          assert d["frozen_source_initial_components_unchanged"]
          assert d["no_rotation_or_state_adjustment_applied"]
          assert d["raw_reported_gmat_times_retained"]
          assert not d["mission_accuracy_budget_approved"]
          assert not d["original_basilisk_N_to_EarthICRF_tie_independently_approved"]
          for name, sha in (
              ("gmat_icrf_numeric_executed.script",receipt["script_sha256"]),
              ("gmat_icrf_numeric_raw.txt",receipt["raw_report_sha256"]),
              ("gmat_icrf_numeric_state.csv",receipt["normalized_csv_sha256"]),
              ("gmat_icrf_numeric_difference_rows.csv",receipt["difference_rows_sha256"]),
              ("gmat_icrf_numeric_diagnostic.json",receipt["diagnostic_sha256"])):
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          for name,sha in receipt["source_sha256"].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
          script=(root/"gmat_icrf_numeric_executed.script").read_text()
          assert "CrossSat.CoordinateSystem = EarthICRF;" in script
          assert "CrossSat.EarthICRF.X" in script
          assert "CrossGravity.Drag = None;" in script
          assert "CrossGravity.SRP = Off;" in script
          assert all(math.isfinite(d[k]) and d[k]>=0 for k in (
              "position_delta_m_first","position_delta_m_mid","position_delta_m_last",
              "position_delta_m_max","velocity_delta_m_s_max",
              "max_reported_gmat_time_skew_s"))
          with (root/"gmat_icrf_numeric_difference_rows.csv").open(newline="") as stream:
              rows=list(csv.DictReader(stream))
          assert len(rows)==91
          assert float(rows[-1]["gmat_original_elapsed_s"])<5400.
          print("DT2_REAL_GMAT_ICRF_NUMERIC_CONTROL "
                f"position_final_m={d['position_delta_m_last']:.9e} "
                f"position_max_m={d['position_delta_m_max']:.9e} "
                f"velocity_max_m_s={d['velocity_delta_m_s_max']:.9e} "
                "status=INCONCLUSIVE independent_N_tie=false")
          PY

      - name: Upload all acquired raw provenance and engine outputs including failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dt2-cross-leo-001-real-gmat-attempt
          path: reports/dt2-cross-leo-001/
          if-no-files-found: warn

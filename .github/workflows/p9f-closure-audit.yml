name: P9-F closure audit (isolated branch)
on:
  push:
    branches: [audit/p9f-contract-closure-20261114]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p9f-closure-audit
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install exact native test dependencies
        run: >-
          python -m pip install bsk==2.11.0 sgp4==2.25 colorama==0.4.6
          numpy==2.3.5 pydantic==2.13.4 jsonschema==4.26.0 PyYAML==6.0.3
          joblib==1.5.3 scikit-learn==1.9.0 psutil==7.2.2 numba==0.63.1
          pytest==9.0.3 fastapi==0.139.2 starlette==1.3.1 httpx==0.28.1
      - name: Prove installed native runtime
        run: python -c "import Basilisk; print(Basilisk.__version__)"
      - name: Reproduce actual native publication contract failures
        id: native
        continue-on-error: true
        env:
          PYTHONPATH: 'src:.'
        run: python -m pytest -q tests/interactive/test_p9f_live_publication.py
      - name: Reproduce scene binding contract failures
        id: scene
        continue-on-error: true
        run: node --test tests/js/test_p9f_scene_contract.cjs
      - name: Require the expected red baseline
        env:
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          SCENE_OUTCOME: ${{ steps.scene.outcome }}
        run: |
          test "$NATIVE_OUTCOME" = failure
          test "$SCENE_OUTCOME" = failure

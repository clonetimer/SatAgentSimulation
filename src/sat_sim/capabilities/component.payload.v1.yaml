capability_id: component.payload.v1
schema_version: 0.1.0
name: Payload component simulation
level: component
domain: payload
target: payload
trust_level: conformance_tested
status: agent_ready_candidate
summary: Source-native payload instrument capability using components.payload.builder simulate_payload_profile.
adapter:
  class_path: sat_sim.adapters.component_source_native_misc.PayloadAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules: &id001
  - components.payload.builder
  - components.payload.model
  legacy_demo_runner: components.payload.runner
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  fault:
    supported: true
    fault_types: [instrument_off, saturation, pointing_limit]
  degradation:
    supported: true
    degradation_types: [sensitivity_decay, dark_current_growth]
parameters:
  name:
    type: string
    unit: none
    required: false
    default: nadir_imager
  observation_power_w:
    type: number
    unit: W
    required: false
    default: 18.0
    min: 0.0
  standby_power_w:
    type: number
    unit: W
    required: false
    default: 3.0
    min: 0.0
  data_rate_bps:
    type: number
    unit: bit/s
    required: false
    default: 250000.0
    min: 0.0
  heat_fraction:
    type: number
    unit: ratio
    required: false
    default: 0.85
    min: 0.0
  max_pointing_error_deg:
    type: number
    unit: deg
    required: false
    default: 0.25
    min: 0.0
  requested:
    type: bool
    unit: bool
    required: false
    default: true
  pointing_error_deg:
    type: number
    unit: deg
    required: false
    default: 0.05
    min: 0.0
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
consumes:
- name: simulation.duration_s
  unit: s
- name: simulation.sample_s
  unit: s
- name: parameters.name
  unit: none
- name: parameters.observation_power_w
  unit: W
- name: parameters.standby_power_w
  unit: W
- name: parameters.data_rate_bps
  unit: bit/s
- name: parameters.heat_fraction
  unit: ratio
- name: parameters.max_pointing_error_deg
  unit: deg
- name: parameters.requested
  unit: bool
- name: parameters.pointing_error_deg
  unit: deg
produces:
- name: payload.payload.*
- name: label.health_state
time_grid:
  policy: task_spec_simulation_grid
  source: simulation
  duration_field: simulation.duration_s
  sample_field: simulation.sample_s
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
  - name: sample_index
    unit: count
    dtype: integer
  - name: label.health_state
    unit: enum
    dtype: string
  summary:
  - name: qoi.*
    unit: mixed
validation:
  conformance_tests:
  - test_c2c3_payload_parameter_effect_and_manifest
  - test_c2c3_payload_capability_python_export_runs
source_binding:
  mode: source_native
  status: c2c3_new_source_native_adapter
  primary_module: components.payload.builder
  source_modules: *id001
  public_api:
  - build_nominal_payload_config
  - PayloadInstrumentStepInput
  - simulate_payload_profile
  legacy_demo_runner: components.payload.runner
  uses_legacy_runner: false
  basilisk_required: false
  rationale: Added in C2/C3 coverage completion as a low-risk wrapper around existing pure-Python component builder/model
    API.
fidelity_level: basic
known_physics_limits:
- source-native wrapper of existing src public API; no additional high-fidelity physics added
operator:
  owner: payload
  effects:
  - {effect_id: nominal, kind: nominal, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.generated_bps], verification: declared}
  - {effect_id: instrument_off, kind: fault, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.enabled, label.fault_active], verification: declared}
  - {effect_id: saturation, kind: fault, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.generated_bps, label.fault_active], verification: declared}
  - {effect_id: pointing_limit, kind: fault, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.block_reasons, label.fault_active], verification: declared}
  - {effect_id: sensitivity_decay, kind: degradation, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.effective_rate_factor, label.degradation_active], verification: declared}
  - {effect_id: dark_current_growth, kind: degradation, owner: payload, implementation: source_native, evidence_fields: [payload.instrument.effective_rate_factor, label.degradation_active], verification: declared}
lifecycle:
  status: active
  replacement: null
  exposed_to_agent: true
  exposed_to_real_llm_eval: true
  reason: Active product capability.
backend_type: orchestration_wrapper
validation_basis: &id002
- conformance_tests
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: orchestration_wrapper
  basilisk_required: false
  current_agent_path_uses_basilisk: false
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/components/payload/basilisk_impl.py
  - src/components/payload/builder.py
  validation_basis: *id002
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim flight validation, hardware calibration, or high-fidelity equivalence without external validation
    evidence.
  bsk0_notes: Source tree contains Basilisk-facing candidate modules, but this Agent capability does not currently require
    or guarantee Basilisk-native execution.
  planned_upgrade_path: []
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: project_deterministic_model
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - source-native wrapper of existing src public API; no additional high-fidelity physics added

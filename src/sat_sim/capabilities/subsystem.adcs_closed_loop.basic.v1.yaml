capability_id: subsystem.adcs_closed_loop.basic.v1
schema_version: 0.1.0
name: Basic closed-loop ADCS attitude-control simulation
level: subsystem
domain: adcs
target: adcs_closed_loop
trust_level: conformance_tested
status: agent_ready_candidate
summary: Route-B HF-4 basic closed-loop ADCS capability using HF-1/HF-2 time, attitude-state, frame, and solver foundations.
  It propagates quaternion attitude error, body angular rate, a PD pointing/detumble controller, reaction-wheel torque/speed
  proxy, and simple gyro/sun-sensor/star-tracker readiness metadata. It is not full FSW or high-fidelity sensor/actuator physics.
adapter:
  class_path: sat_sim.adapters.subsystem_adcs_closed_loop_basic.AdcsClosedLoopBasicAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules:
  - sat_sim.adcs.closed_loop
  - sat_sim.state
  - sat_sim.time_systems
  - sat_sim.solvers
  - sat_sim.frames
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
modes:
  nominal:
    supported: true
  fault:
    supported: false
  degradation:
    supported: false
parameters:
  inertia_kg_m2:
    type: vector3_or_number
    unit: kg*m^2
    required: false
    default:
    - 12.0
    - 10.0
    - 8.0
  initial_attitude_error_deg:
    type: number
    unit: deg
    required: false
    min: 0.0
    default: 10.0
  initial_error_axis:
    type: vector3
    unit: unit
    required: false
    default:
    - 0.0
    - 0.0
    - 1.0
  initial_rate_deg_s:
    type: vector3_or_number
    unit: deg/s
    required: false
    default:
    - 0.0
    - 0.0
    - 0.0
  target_mode:
    type: string
    required: false
    enum:
    - inertial
    - nadir
    - sun
    - detumble
    default: inertial
  control_kp_nm_per_rad:
    type: number
    unit: N*m/rad
    required: false
    min: 0.0
    default: 0.1
  control_kd_nm_per_rad_s:
    type: number
    unit: N*m/(rad/s)
    required: false
    min: 0.0
    default: 0.85
  pointing_requirement_deg:
    type: number
    unit: deg
    required: false
    min: 0.0
    default: 1.0
  disturbance_torque_nm:
    type: vector3_or_number
    unit: N*m
    required: false
    default:
    - 0.0
    - 0.0
    - 0.0
  num_reaction_wheels:
    type: integer
    unit: count
    required: false
    min: 1
    max: 8
    default: 3
  wheel_inertia_kg_m2:
    type: number
    unit: kg*m^2
    required: false
    min: 1.0e-06
    default: 0.08
  max_wheel_torque_nm:
    type: number
    unit: N*m
    required: false
    min: 1.0e-09
    default: 0.05
  max_wheel_speed_rad_s:
    type: number
    unit: rad/s
    required: false
    min: 1.0e-06
    default: 900.0
  initial_wheel_speed_rad_s:
    type: vector3_or_number
    unit: rad/s
    required: false
    default:
    - 60.0
    - 60.0
    - 60.0
  gyro_bias_deg_s:
    type: vector3_or_number
    unit: deg/s
    required: false
    default:
    - 0.0
    - 0.0
    - 0.0
  gyro_noise_std_deg_s:
    type: number
    unit: deg/s
    required: false
    min: 0.0
    default: 0.0
  sun_sensor_noise_deg:
    type: number
    unit: deg
    required: false
    min: 0.0
    default: 0.0
  sun_sensor_available:
    type: boolean
    required: false
    default: true
  star_tracker_available:
    type: boolean
    required: false
    default: false
simulation_parameters:
  duration_s:
    unit: s
    required: true
    min: 1.0
  sample_s:
    unit: s
    required: true
    min: 0.001
  epoch_utc:
    unit: UTC
    required: false
  solver:
    required: false
    description: HF-2 fixed-step solver metadata. solver.step_s is used as the internal ADCS integration step and must be
      <= sample_s.
outputs:
  trace:
  - name: time_s
    unit: s
    dtype: number
  - name: utc
    unit: UTC
    dtype: string
  - name: adcs.attitude.q_bn_0
    unit: unit
    dtype: number
  - name: adcs.attitude.quaternion_norm
    unit: ratio
    dtype: number
  - name: adcs.pointing.error_deg
    unit: deg
    dtype: number
  - name: adcs.rate.omega_bn_b_rad_s_0
    unit: rad/s
    dtype: number
  - name: adcs.sensor.gyro_measured_rad_s_0
    unit: rad/s
    dtype: number
  - name: adcs.control.command_torque_nm_0
    unit: N*m
    dtype: number
  - name: adcs.control.applied_torque_nm_0
    unit: N*m
    dtype: number
  - name: adcs.rw.speed_rad_s_0
    unit: rad/s
    dtype: number
  - name: adcs.rw.saturation_flag
    unit: bool
    dtype: bool
  - name: adcs.power.rw_power_w
    unit: W
    dtype: number
  - name: label.pointing_state
    unit: enum
    dtype: string
  summary:
  - name: qoi.adcs.initial_pointing_error_deg
    unit: deg
  - name: qoi.adcs.final_pointing_error_deg
    unit: deg
  - name: qoi.adcs.settled_time_s
    unit: s
  - name: qoi.adcs.quaternion_norm_max_error
    unit: ratio
  - name: qoi.adcs.saturation_count
    unit: count
validation:
  conformance_tests:
  - test_hf4_capability_registered_as_basic_not_high_fidelity
  - test_hf4_closed_loop_reduces_pointing_error_and_preserves_quaternion_norm
  - test_hf4_reaction_wheel_torque_limit_sets_saturation
  - test_hf4_capability_writes_manifest_metadata
  - test_hf4_capability_python_export_runs
  - test_hf4_template_backend_routes_basic_closed_loop_request
produces:
- name: adcs.attitude.*
  destination: trace
- name: adcs.pointing.*
  destination: trace
- name: adcs.rate.*
  destination: trace
- name: adcs.sensor.*
  destination: trace
- name: adcs.control.*
  destination: trace
- name: adcs.rw.*
  destination: trace
- name: adcs.power.rw_power_w
  unit: W
  destination: trace
consumes:
- name: simulation.duration_s
  unit: s
  required: true
- name: simulation.sample_s
  unit: s
  required: true
- name: simulation.epoch_utc
  unit: UTC
  required: false
- name: simulation.solver.step_s
  unit: s
  required: false
- name: parameters.initial_attitude_error_deg
  unit: deg
  required: false
- name: parameters.initial_rate_deg_s
  unit: deg/s
  required: false
- name: parameters.control_kp_nm_per_rad
  unit: N*m/rad
  required: false
- name: parameters.control_kd_nm_per_rad_s
  unit: N*m/(rad/s)
  required: false
- name: parameters.max_wheel_torque_nm
  unit: N*m
  required: false
time_grid:
  policy: hf1_output_grid_with_hf2_internal_fixed_step
  time_field: time_s
  duration_source: simulation.duration_s
  sample_source: simulation.sample_s
  internal_step_source: simulation.solver.step_s
source_binding:
  mode: route_b_model_library
  status: hf4_implemented_basic_closed_loop
  primary_module: sat_sim.adcs.closed_loop
  source_modules:
  - sat_sim.adcs.closed_loop
  - sat_sim.state
  - sat_sim.time_systems
  - sat_sim.solvers
  - sat_sim.frames
  public_api:
  - ADCSClosedLoopConfig
  - propagate_adcs_closed_loop
  - summarize_adcs_closed_loop
  - build_hf4_adcs_closed_loop_payload
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: false
fidelity_level: basic
known_physics_limits:
- Basic diagonal rigid-body dynamics only; products of inertia are ignored.
- PD quaternion-error proxy is not full flight software.
- Gyro, sun-sensor, and star-tracker behavior is proxy/readiness metadata, not calibrated sensor physics.
- Reaction-wheel assembly maps first three wheel proxies to body XYZ axes; no wheel geometry matrix or motor electronics are
  modeled.
- No environmental torque model beyond user-supplied disturbance_torque_nm.
- HF-8 validation gates and HF-9 benchmark tolerance envelopes are pending.
allowed_task_spec_sections:
- schema_version
- task_id
- task_type
- capability_id
- target
- simulation
- parameters
- outputs
- metadata
- tags
lifecycle:
  status: deprecated
  replacement: subsystem.adcs_fidelity.v1
  exposed_to_agent: false
  exposed_to_real_llm_eval: false
  reason: Superseded by ADCS-1/ADCS-2 fidelity capability; retained for explicit legacy compatibility.
backend_type: local_physics_proxy
validation_basis: &id001
- conformance_tests
can_claim_high_fidelity: false
backend_boundary:
  schema_version: bsk0.native_proxy_boundary.v1
  backend_type: local_physics_proxy
  basilisk_required: false
  current_agent_path_uses_basilisk: false
  source_has_basilisk_facing_candidates: true
  basilisk_candidate_files:
  - src/sat_sim/adcs/basilisk_fsw.py
  validation_basis: *id001
  can_claim_high_fidelity: false
  claim_guardrail: Do not claim high-fidelity or flight validation until the planned Basilisk-native/public-reference upgrade
    path is implemented and benchmarked.
  bsk0_notes: Source tree contains Basilisk-facing candidate modules, but this Agent capability does not currently require
    or guarantee Basilisk-native execution.
  planned_upgrade_path:
  - BSK-ADCS-1 comparison baseline
integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: project_deterministic_model
  couplings:
    supported: []
    unsupported:
    - '*'
  limitations:
  - Basic diagonal rigid-body dynamics only; products of inertia are ignored.
  - PD quaternion-error proxy is not full flight software.
  - Gyro, sun-sensor, and star-tracker behavior is proxy/readiness metadata, not calibrated sensor physics.
  - Reaction-wheel assembly maps first three wheel proxies to body XYZ axes; no wheel geometry matrix or motor electronics
    are modeled.
  - No environmental torque model beyond user-supplied disturbance_torque_nm.
  - HF-8 validation gates and HF-9 benchmark tolerance envelopes are pending.

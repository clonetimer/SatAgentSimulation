name: P9-H native attitude truth contract
on:
  pull_request:
    paths:
      - "src/sat_sim/bsk_engine/unified_native.py"
      - "src/sat_sim/dataset_writer.py"
      - "src/sat_sim/telemetry_overview.py"
      - "src/sat_sim/api.py"
      - "src/sat_sim/interactive/api.py"
      - "src/sat_sim/web/satellite-scene.js"
      - "src/sat_sim/web/index.html"
      - "src/sat_sim/web/satellite-scene.css"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/web/continuous.js"
      - "tests/test_p9h_attitude_truth.py"
      - "tests/interactive/test_native_attitude_truth_telemetry.py"
      - "tests/interactive/test_p9h_finite_run_attitude.py"
      - "tests/interactive/test_finite_telemetry_overview.py"
      - "tests/test_p9f_telemetry_globe.py"
      - "tests/interactive/test_p9h_attitude_frame_oracle.py"
      - "tests/test_p9f_native_browser.py"
      - "tests/js/test_p9c_scene_lifecycle.cjs"
      - "tests/js/test_p9h_attitude_frames.cjs"
      - ".github/workflows/p9h-native-attitude.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p9h-attitude-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  attitude-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install unit contract dependencies
        run: |
          python -m pip install \
            "pytest==9.0.3" "numpy==2.3.5" "colorama==0.4.6" \
            "sgp4==2.25" "numba==0.63.1" "joblib==1.5.3" \
            "scikit-learn==1.9.0" "pydantic==2.13.4" \
            "PyYAML==6.0.3" "jsonschema==4.26.0" "psutil==7.2.2" \
            "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
      - name: Verify MRP truth conversion and source separation
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_p9h_attitude_truth.py
      - name: Verify sealed Run inspector and independent physical basis directions
        run: node --test tests/js/test_p9c_scene_lifecycle.cjs tests/js/test_p9h_attitude_frames.cjs
  basilisk-native-recorder:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install official Basilisk and test dependencies
        run: |
          python -m pip install \
            "bsk==2.11.0" "pytest==9.0.3" "numpy==2.3.5" \
            "colorama==0.4.6" "sgp4==2.25" "PyYAML==6.0.3" \
            "pydantic==2.13.4" "jsonschema==4.26.0" \
            "joblib==1.5.3" "scikit-learn==1.9.0" "psutil==7.2.2" "numba==0.63.1"
      - name: Require real Basilisk before native tests
        run: python -c "from Basilisk.utilities import RigidBodyKinematics; print('Basilisk rigid-body oracle available')"
      - name: Prove actual state recorder, finite Run archive, and independent DCM-to-renderer parity
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/interactive/test_native_attitude_truth_telemetry.py tests/interactive/test_p9h_finite_run_attitude.py tests/interactive/test_p9h_attitude_frame_oracle.py

name: P9-C Globe.gl offline satellite scene acceptance

on:
  pull_request:
    paths:
      - "scripts/vendor_scene_assets.py"
      - "src/sat_sim/web/satellite-scene.js"
      - "src/sat_sim/web/birds-cad-viewer.js"
      - "src/sat_sim/web/satellite-scene.css"
      - "src/sat_sim/web/index.html"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/api.py"
      - "src/sat_sim/reference_rw_cad.py"
      - "src/sat_sim/web/rw-reference-overlay.js"
      - "tests/test_dt41_rw_reference_cad.py"
      - "pyproject.toml"
      - "tests/test_p9c_satellite_scene.py"
      - "tests/js/test_p9c_scene_lifecycle.cjs"
      - "docs/guides_zh/P9C_卫星数字场景本地运行.md"
      - ".github/workflows/p9c-globe-scene.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p9c-globe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  globe-offline-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify scene lifecycle and camera ownership
        run: |
          set -o pipefail
          mkdir -p reports/p9c/lifecycle
          node --test tests/js/test_p9c_scene_lifecycle.cjs | tee reports/p9c/lifecycle/node-tests.log
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Python and browser test dependencies
        run: >-
          python -m pip install
          "pytest==9.0.3" "build==1.5.0"
          "pydantic==2.13.4" "jsonschema==4.26.0"
          "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6"
          "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0"
          "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
          "playwright==1.57.0"
      - name: Stage pinned Globe.gl runtime and offline textures
        run: python scripts/vendor_scene_assets.py
      - name: Stage SHA-pinned standalone BIRDS-4 RW GLB from prior CI artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import Request, urlopen
          import hashlib, os, zipfile
          # Artifact contains the full FM and other independent subassemblies;
          # extract ONLY the standalone RW GLB, never a subtree of the 61 MB FM.
          url = "https://api.github.com/repos/clonetimer/SatAgentSimulation/actions/artifacts/14153195945/zip"
          req = Request(url, headers={
              "Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(req, timeout=90) as response:
              artifact_zip = response.read()
          with zipfile.ZipFile(BytesIO(artifact_zip)) as archive:
              data = archive.read("build/birds4/output/B4_RW_Assembly_v55.glb")
          expected = "3019d97d4990553bcfab39d9cbe0ea15bad9a294f517481b65df1ec71ce4d795"
          observed = hashlib.sha256(data).hexdigest()
          assert len(data) == 1410016, f"RW_SIZE_MISMATCH: {len(data)}"
          assert observed == expected, f"RW_SHA256_MISMATCH: {observed}"
          output = Path("build/birds4/output/B4_RW_Assembly_v55.glb")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(data)
          print(f"DT41_REAL_RW_CAD_STAGED path={output} bytes={len(data)} sha256={observed}")
          PY
      - name: Install headless Chromium
        run: python -m playwright install chromium
      - name: Install Chinese fonts for visual acceptance
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-match -f '%{family}\n' 'Noto Sans CJK SC' | tee reports/p9c/lifecycle/chinese-font.txt | grep -F 'Noto Sans CJK SC'
      - name: Verify local assets, CSP, browser scene and camera controls
        env:
          PYTHONPATH: "src:."
          SAT_SIM_SCENE_EVIDENCE_DIR: reports/p9c/lifecycle
          SAT_SIM_BIRDS4_RW_GLB: build/birds4/output/B4_RW_Assembly_v55.glb
        run: |
          SAT_SIM_BROWSER_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python -m pytest -q tests/test_p9c_satellite_scene.py tests/test_p9i_cad_viewer_contract.py tests/test_dt41_rw_reference_cad.py --junitxml=reports/p9c/lifecycle/browser-tests.xml
      - name: Build wheel with bundled Globe.gl runtime
        env:
          PYTHONPATH: "src:."
        run: |
          python -m build --wheel
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          wheel = next(Path("dist").glob("*.whl"))
          required = [
              "sat_sim/web/vendor/globe/globe.gl.min.js",
              "sat_sim/web/vendor/globe/three.module.js",
              "sat_sim/web/vendor/globe/three.core.js",
              "sat_sim/web/vendor/globe/loaders/GLTFLoader.js",
              "sat_sim/web/vendor/globe/loaders/meshopt_decoder.module.js",
              "sat_sim/web/vendor/globe/utils/BufferGeometryUtils.js",
              "sat_sim/web/vendor/globe/utils/SkeletonUtils.js",
              "sat_sim/web/vendor/globe/textures/earth-blue-marble.jpg",
              "sat_sim/web/vendor/globe/vendor-manifest.json",
              "sat_sim/web/vendor/globe/licenses/globe.gl-LICENSE",
              "sat_sim/web/vendor/globe/licenses/three-globe-LICENSE",
              "sat_sim/web/vendor/globe/licenses/three-LICENSE",
          ]
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          missing = [item for item in required if item not in names]
          if missing:
              raise SystemExit(f"wheel is missing Globe.gl runtime assets: {missing}")
          print(f"wheel contains {len([n for n in names if '/vendor/globe/' in n])} offline globe assets")
          PY
      - name: Preserve lifecycle and browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: p9c-scene-lifecycle-evidence
          path: reports/p9c/lifecycle/
          if-no-files-found: warn

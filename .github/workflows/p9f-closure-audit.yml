name: P9-F closure audit (isolated branch)
on:
  push:
    branches: [audit/p9f-contract-closure-20261114]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: p9f-closure-audit
  cancel-in-progress: true
env:
  PYTHONPATH: 'src:.'
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact-anchor candidate after verified red baseline
        run: python reports/p9f-contract-closure/apply_checked_patch.py
      - name: Install exact native and browser dependencies
        run: >-
          python -m pip install bsk==2.11.0 sgp4==2.25 colorama==0.4.6
          numpy==2.3.5 pydantic==2.13.4 jsonschema==4.26.0 PyYAML==6.0.3
          joblib==1.5.3 scikit-learn==1.9.0 psutil==7.2.2 numba==0.63.1
          pytest==9.0.3 fastapi==0.139.2 starlette==1.3.1 httpx==0.28.1
          playwright==1.57.0
      - name: Stage pinned scene assets and browser
        run: |
          python scripts/vendor_scene_assets.py
          python -m playwright install chromium
      - name: Verify native publication and contract regressions
        run: |
          python -c "import Basilisk; print(Basilisk.__version__)"
          python -m pytest -q tests/interactive/test_p9f_live_publication.py tests/interactive/test_scene_metadata.py tests/test_p9f_realtime_scene.py tests/test_p9e_object_run_results.py tests/test_p9d_object_config_panel.py tests/test_p9c_satellite_scene.py
      - name: Verify actual height binding and scene lifecycle
        run: |
          node --check src/sat_sim/web/app.js
          node --check src/sat_sim/web/satellite-scene.js
          node --test tests/js/test_p9f_scene_contract.cjs tests/js/test_p9f_realtime_orbit.mjs tests/js/test_p9c_scene_lifecycle.cjs
      - name: Verify existing Chromium scene component behavior
        env:
          SAT_SIM_P9F_BROWSER_TEST: '1'
        run: python -m pytest -q tests/test_p9f_realtime_scene.py -k chromium
      - name: Store verified candidate blobs only, never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.request, hashlib, subprocess
          paths=json.loads(pathlib.Path('candidate_files.json').read_text())
          out=[]
          for path in paths:
              content=pathlib.Path(path).read_text(encoding='utf-8')
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':content,'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              out.append({'path':path,'mode':'100644','type':'blob','sha':result['sha'],'sha256':hashlib.sha256(content.encode()).hexdigest()})
          manifest={'base':'b95bebb495e088324bc21b0665e00d3902f41f9a','run_id':os.environ['GITHUB_RUN_ID'],'files':out,'scope':'native API publication and renderer/component checks; full live UI E2E still pending'}
          pathlib.Path('reports/p9f-contract-closure/candidate-manifest.json').write_text(json.dumps(manifest,indent=2))
          print('VERIFIED_CANDIDATE_MANIFEST='+json.dumps(manifest))
          pathlib.Path('reports/p9f-contract-closure/candidate.diff').write_bytes(subprocess.check_output(['git','diff','--',*paths]))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p9f-contract-closure-evidence
          path: reports/p9f-contract-closure/

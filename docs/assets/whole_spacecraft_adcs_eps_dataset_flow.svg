<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">整星 ADCS 配对数据集生成流程</title>
  <desc id="desc">三任务场景、正常与三十四个单异常条件、五至十个蒙特卡洛样本的笛卡尔积，经统一 Basilisk 整星任务生成全字段遥测。</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#172033"/></marker>
  <style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#172033}.h{font-size:30px;font-weight:700}.s{font-size:15px}.b{font-size:17px;font-weight:600}.py{fill:#c9f7f4;stroke:#172033;stroke-width:2}.sim{fill:#bff5b5;stroke:#172033;stroke-width:2}.fsw{fill:#fff7ad;stroke:#172033;stroke-width:2}.prj{fill:#cfe2ff;stroke:#172033;stroke-width:2}.data{fill:#f3d0ff;stroke:#172033;stroke-width:2}.box{fill:#f8fafc;stroke:#64748b;stroke-width:2;stroke-dasharray:8 6}.p{fill:none;stroke:#172033;stroke-width:2;marker-end:url(#a)}.d{fill:none;stroke:#172033;stroke-width:2;stroke-dasharray:8 6;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="1080" fill="white"/><text x="800" y="42" text-anchor="middle" class="h">整星 ADCS 配对数据集生成流程</text>
  <text x="800" y="70" text-anchor="middle" class="s">任务 × 条件 × Monte Carlo · 共享正常基线 · 单故障/退化/约束 · 全整星字段导出</text>
  <rect x="35" y="92" width="38" height="18" class="py"/><text x="84" y="107" class="s">Python Task</text><rect x="225" y="92" width="38" height="18" class="sim"/><text x="274" y="107" class="s">SIM module</text><rect x="420" y="92" width="38" height="18" class="fsw"/><text x="469" y="107" class="s">FSW module</text><rect x="620" y="92" width="38" height="18" class="prj"/><text x="669" y="107" class="s">Project module</text><rect x="835" y="92" width="38" height="18" class="data"/><text x="884" y="107" class="s">Dataset</text>

  <rect x="35" y="140" width="1530" height="165" rx="18" class="box"/>
  <rect x="60" y="172" width="220" height="70" rx="10" class="py"/><text x="170" y="198" text-anchor="middle" class="b">3 个任务场景 M</text><text x="170" y="222" text-anchor="middle" class="s">捕获 / 稳态载荷 / 推进机动</text>
  <rect x="340" y="172" width="250" height="70" rx="10" class="py"/><text x="465" y="198" text-anchor="middle" class="b">35 个条件 C</text><text x="465" y="222" text-anchor="middle" class="s">正常 + 34 个 ADCS 单异常</text>
  <rect x="650" y="172" width="250" height="70" rx="10" class="py"/><text x="775" y="198" text-anchor="middle" class="b">5–10 个样本 K</text><text x="775" y="222" text-anchor="middle" class="s">轻微参数扰动；默认 K=5</text>
  <rect x="960" y="172" width="260" height="70" rx="10" class="py"/><text x="1090" y="198" text-anchor="middle" class="b">参考标定 + 共享种子</text><text x="1090" y="222" text-anchor="middle" class="s">来源/可信度 · 配对参数一致</text>
  <rect x="1280" y="162" width="245" height="90" rx="10" class="py"/><text x="1402" y="188" text-anchor="middle" class="b">TaskSpec + 时基校验</text><text x="1402" y="212" text-anchor="middle" class="s">300 s / 0.1 s / 0.5 s</text><text x="1402" y="235" text-anchor="middle" class="s">单事件、对齐网格、轮号、后端</text>
  <path d="M280 207H340M590 207H650M900 207H960M1220 207H1280" class="p"/><text x="800" y="278" text-anchor="middle" class="b">笛卡尔积：N = |M| × |C| × K = 3 × 35 × K（默认 525 次）</text>

  <rect x="35" y="330" width="1530" height="565" rx="18" class="box"/><rect x="565" y="345" width="470" height="48" rx="24" class="py"/><text x="800" y="376" text-anchor="middle" class="b">UnifiedNativeProcess / UnifiedNativeTask</text>
  <rect x="65" y="430" width="245" height="72" rx="8" class="prj"/><text x="188" y="458" text-anchor="middle" class="b">事件与标签</text><text x="188" y="482" text-anchor="middle" class="s">0 或 1 个 fault/degradation/constraint</text>
  <rect x="65" y="535" width="245" height="88" rx="8" class="prj"/><text x="188" y="563" text-anchor="middle" class="b">故障注入器</text><text x="188" y="586" text-anchor="middle" class="s">IMU bias/noise</text><text x="188" y="607" text-anchor="middle" class="s">RW jam/motor/drag/authority/speed</text>

  <rect x="365" y="420" width="255" height="92" rx="8" class="sim"/><text x="493" y="448" text-anchor="middle" class="b">整星动力学与环境</text><text x="493" y="472" text-anchor="middle" class="s">spacecraft · gravity · eclipse</text><text x="493" y="494" text-anchor="middle" class="s">轨道/姿态 6-DOF</text>
  <rect x="365" y="545" width="255" height="112" rx="8" class="sim"/><text x="493" y="574" text-anchor="middle" class="b">选定 ADCS 部件</text><text x="493" y="598" text-anchor="middle" class="s">4×HR16 四面体金字塔反作用轮</text><text x="493" y="620" text-anchor="middle" class="s">星敏 + IMU（精姿态）</text><text x="493" y="642" text-anchor="middle" class="s">太敏 + 地敏 TRIAD（粗姿态/备份）</text>
  <rect x="365" y="690" width="255" height="142" rx="8" class="sim"/><text x="493" y="718" text-anchor="middle" class="b">其余整星分系统</text><text x="493" y="742" text-anchor="middle" class="s">EPS：太阳阵 / 电池 / PDU</text><text x="493" y="764" text-anchor="middle" class="s">载荷 · 通信/数管 · 热控</text><text x="493" y="786" text-anchor="middle" class="s">推进器 / 贮箱（所有任务均实例化）</text><text x="493" y="808" text-anchor="middle" class="s">非推进任务推力命令为 0</text>

  <rect x="690" y="430" width="245" height="62" rx="8" class="fsw"/><text x="812" y="467" text-anchor="middle" class="b">inertial3D()</text>
  <rect x="690" y="525" width="245" height="75" rx="8" class="prj"/><text x="812" y="553" text-anchor="middle" class="b">Sensor Fusion</text><text x="812" y="578" text-anchor="middle" class="s">星敏+IMU ⊕ 太敏+地敏；无SimpleNav</text>
  <rect x="690" y="635" width="245" height="62" rx="8" class="fsw"/><text x="812" y="672" text-anchor="middle" class="b">attTrackingError()</text>
  <rect x="690" y="730" width="245" height="82" rx="8" class="fsw"/><text x="812" y="758" text-anchor="middle" class="b">mrpFeedback()</text><text x="812" y="782" text-anchor="middle" class="s">rwMotorTorque()</text>

  <rect x="1010" y="430" width="245" height="82" rx="8" class="prj"/><text x="1132" y="458" text-anchor="middle" class="b">资源耦合 Bridge</text><text x="1132" y="482" text-anchor="middle" class="s">ADCS/载荷/通信/推进→EPS/热</text>
  <rect x="1010" y="555" width="245" height="92" rx="8" class="prj"/><text x="1132" y="583" text-anchor="middle" class="b">模式与保护</text><text x="1132" y="607" text-anchor="middle" class="s">PDU · SOC · 温度 · 指向门控</text><text x="1132" y="629" text-anchor="middle" class="s">任务活动状态</text>
  <rect x="1010" y="690" width="245" height="90" rx="8" class="prj"/><text x="1132" y="718" text-anchor="middle" class="b">原生消息记录器</text><text x="1132" y="742" text-anchor="middle" class="s">全部轨迹字段 + 事件状态</text><text x="1132" y="764" text-anchor="middle" class="s">模块覆盖清单</text>

  <rect x="1320" y="470" width="205" height="102" rx="8" class="data"/><text x="1422" y="500" text-anchor="middle" class="b">telemetry.csv</text><text x="1422" y="525" text-anchor="middle" class="s">轨道 / ADCS / EPS</text><text x="1422" y="547" text-anchor="middle" class="s">载荷 / 通信 / 热 / 推进</text>
  <rect x="1320" y="640" width="205" height="110" rx="8" class="data"/><text x="1422" y="670" text-anchor="middle" class="b">元数据与清单</text><text x="1422" y="695" text-anchor="middle" class="s">pair_id / seeds / TaskSpec</text><text x="1422" y="717" text-anchor="middle" class="s">字段 / 模块 / 故障审计</text>

  <path d="M310 466H365M620 466H690M935 666H1010M1255 735H1320" class="p"/><path d="M310 579H365M620 601H690M935 771H1010M1255 471H1320" class="d"/>
  <path d="M812 492V525M812 600V635M812 697V730" class="p"/>

  <rect x="35" y="910" width="1530" height="145" rx="14" class="box"/><text x="65" y="938" class="b">时间窗口：</text><text x="190" y="938" class="s">0–84 s+ 正常基线 → 84–96 s 单异常注入 → 至 300 s 故障传播；每条约 601 个遥测点。</text>
  <text x="65" y="969" class="b">输出目录：</text><text x="190" y="969" class="s">mission_id / condition_id / sample_kk / {telemetry.csv, sample_metadata.json}</text>
  <text x="65" y="1000" class="b">配对规则：</text><text x="190" y="1000" class="s">pair_seed = base_seed + 100000·mission_index + k；正常与各异常共享所有任务/整星参数。</text>
  <text x="65" y="1031" class="b">审计边界：</text><text x="190" y="1031" class="s">目录声明但未接入统一运行时的故障只列入清单，不生成虚假的可执行样本。</text>
</svg>

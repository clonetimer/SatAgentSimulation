integration_contract:
  schema_version: sat-sim.capability-integration.v1
  source_modules_ref: implementation.model_modules
  implementation_class: mixed_native_project
  couplings:
    supported:
    - orbit_sun_attitude_eclipse_to_eps_solar_power
    - eps_pdu_to_payload_activity
    - eps_pdu_to_comm_activity
    - eps_pdu_to_thermal_heaters
    - payload_activity_to_eps_thermal
    - adcs_control_effort_to_eps_thermal
    - propulsion_activity_to_eps_thermal
    - propulsion_effector_to_spacecraft
    - adcs_pointing_to_payload_gate
    - adcs_pointing_to_comm_gate
    unsupported:
    - '*'
  limitations:
  - flight_data_calibration
  - certification_grade_digital_twin
  - full_fsw_in_the_loop
  - detailed_multi_station_contact_scheduler
  - calibrated_rf_propagation
  - finite_element_thermal
  - high_fidelity_battery_electrochemistry
  - detailed_payload_mission_planning
  - calibrated_mission_success_probability
  - Several cross-subsystem links are deliberate engineering proxies rather than calibrated native physical interfaces.
  - The thermal model is a lumped/network engineering model, not finite-element thermal analysis.
  - Communication uses a compact native/proxy link and mission gate, not full RF propagation and multi-station scheduling.
  - Payload operation is gate-based and does not include detailed mission planning or sensor phenomenology.
  - mission_success_score is an arithmetic deterministic gate fraction and must not be described as a probability.
  - Default parameter_profile=demo is unqualified until a suitable provenance registry is supplied.
  - Runtime fault support is limited to the explicitly registered subsystem/component routes listed in modes.fault.fault_types.
  - Whole-spacecraft degradation is build-time only in V37-B; nonzero degradation onset or finite duration is rejected.
  - Fault and degradation labels report requested event windows; physical effects may appear on the next scheduled subsystem
    sample at an exact onset boundary.

name: Continuous simulation browser smoke

on:
  pull_request:
    paths:
      - "src/sat_sim/web/**"
      - "src/sat_sim/interactive/api.py"
      - "src/sat_sim/interactive/supervised_native_runtime.py"
      - "tests/interactive/test_continuous_console_browser.py"
      - ".github/workflows/continuous-console-browser.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install browser and control-plane test dependencies
        run: >-
          python -m pip install
          "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0"
          "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6"
          "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0"
          "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
          "playwright>=1.56,<2"
      - name: Install Chromium for headless UI E2E
        run: python -m playwright install --with-deps chromium
      - name: Exercise live continuous Web console in real Chromium
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/interactive/test_continuous_console_browser.py

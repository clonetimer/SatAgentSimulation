name: P9-F genuine native UI to scene acceptance
on:
  push:
    branches: [audit/p9f-native-browser-20261114]
  pull_request:
    paths:
      - 'src/sat_sim/web/**'
      - 'src/sat_sim/interactive/**'
      - 'tests/test_p9f_native_browser.py'
      - 'tests/test_p9f_wheel_assets.py'
      - 'pyproject.toml'
      - '.github/workflows/p9f-native-scene-e2e.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: 'src:.'
      SAT_SIM_P9F_NATIVE_BROWSER_TEST: '1'
      SAT_SIM_P9F_EVIDENCE: reports/p9f-native
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align browser journey with existing supported controls
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_p9f_native_browser.py');s=p.read_text()
          old='set_control(page,"#interactiveQuantum","0.2")'
          assert s.count(old)==1
          s=s.replace(old,'set_control(page,"#interactiveQuantum","0.5")')
          old='                for _ in range(2):\n                    page.evaluate('
          new='                page.locator(\'[data-scene-action="track"]\').click()\n                for _ in range(2):\n                    if report["samples"]:\n                        page.wait_for_function("seq=>window.__p9fObservedGlobe.objectsData()[0].sequence>seq",arg=report["samples"][-1]["rendered"]["sequence"],timeout=20000)\n                    page.evaluate('
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
      - name: Install exact native browser and build dependencies
        run: >-
          python -m pip install bsk==2.11.0 sgp4==2.25 colorama==0.4.6
          numpy==2.3.5 pydantic==2.13.4 jsonschema==4.26.0 PyYAML==6.0.3
          joblib==1.5.3 scikit-learn==1.9.0 psutil==7.2.2 numba==0.63.1
          pytest==9.0.3 fastapi==0.139.2 starlette==1.3.1 httpx==0.28.1
          playwright==1.57.0 uvicorn==0.48.0 websockets==17.4
          build==1.5.0 setuptools==84.1.0 wheel==0.46.2
      - name: Reproduce missing module packaging before repair
        id: packaging_red
        continue-on-error: true
        run: python -m pytest -q tests/test_p9f_wheel_assets.py -k declared
      - name: Add the missing ES module package-data declaration
        env:
          RED_OUTCOME: ${{ steps.packaging_red.outcome }}
        run: |
          test "$RED_OUTCOME" = failure
          python - <<'PY'
          from pathlib import Path
          p=Path('pyproject.toml');s=p.read_text();old='"web/*.js", "web/vendor/globe/**/*"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'"web/*.js", "web/*.mjs", "web/vendor/globe/**/*"'))
          PY
          python -m pytest -q tests/test_p9f_wheel_assets.py -k declared
      - name: Stage pinned scene assets and real browser
        run: |
          python scripts/vendor_scene_assets.py
          python -m playwright install --with-deps chromium
      - name: Native bounded and supervised continuous UI journeys
        run: |
          python -c "import Basilisk; print(Basilisk.__version__)"
          python -m pytest -q tests/test_p9f_native_browser.py --junitxml=reports/p9f-native/junit.xml
      - name: Verify real wheel contains scene module
        env:
          SAT_SIM_P9F_WHEEL_DIR: dist-p9f
        run: |
          python -m build --wheel --no-isolation --outdir dist-p9f
          python -m pytest -q tests/test_p9f_wheel_assets.py
      - name: Store validated test and packaging blobs, no ref mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,os,json,urllib.request,hashlib
          out=[]
          for name in ['tests/test_p9f_native_browser.py','tests/test_p9f_wheel_assets.py','pyproject.toml']:
              text=pathlib.Path(name).read_text()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':text,'encoding':'utf-8'}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(request,timeout=30) as response: blob=json.load(response)
              out.append({'path':name,'sha':blob['sha'],'mode':'100644','type':'blob','sha256':hashlib.sha256(text.encode()).hexdigest()})
          pathlib.Path('reports/p9f-native/manifest.json').write_text(json.dumps({'run_id':os.environ['GITHUB_RUN_ID'],'base':'fa40657f832a0f97faa41a7f0abdf5b43dd630b2','files':out},indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: p9f-native-scene-evidence
          path: reports/p9f-native/

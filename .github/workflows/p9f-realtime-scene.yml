name: P9-F real-time telemetry driven satellite scene

on:
  pull_request:
    paths:
      - "src/sat_sim/interactive/api.py"
      - "src/sat_sim/interactive/scene_metadata.py"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/web/continuous.js"
      - "src/sat_sim/web/satellite-scene.js"
      - "src/sat_sim/web/realtime-orbit.mjs"
      - "src/sat_sim/web/index.html"
      - "tests/interactive/test_scene_metadata.py"
      - "tests/js/test_p9f_realtime_orbit.mjs"
      - "tests/test_p9f_realtime_scene.py"
      - "docs/superpowers/plans/2026-11-14-p9f-realtime-scene.md"
      - ".github/workflows/p9f-realtime-scene.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  realtime-scene:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install contract dependencies
        run: python -m pip install "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0" "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6" "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0" "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1" "setuptools==84.1.0" "wheel==0.46.2" "playwright==1.57.0"
      - name: Install Chromium for browser acceptance
        if: runner.os == 'Linux'
        run: python -m playwright install chromium
      - name: Verify P9-F coordinate transform and controller syntax
        run: |
          node --check src/sat_sim/web/realtime-orbit.mjs
          node --check src/sat_sim/web/satellite-scene.js
          node --check src/sat_sim/web/continuous.js
          node --check src/sat_sim/web/app.js
          node --test tests/js/test_p9f_realtime_orbit.mjs
      - name: Verify runtime epoch, stream ownership and realtime session bridge
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/interactive/test_scene_metadata.py tests/test_p9f_realtime_scene.py tests/test_p9e_object_run_results.py tests/test_p9d_object_config_panel.py tests/test_p9c_satellite_scene.py
      - name: Verify Chromium live-scene behavior for both realtime modes
        if: runner.os == 'Linux'
        env:
          PYTHONPATH: "src:."
          SAT_SIM_P9F_BROWSER_TEST: "1"
        run: python -m pytest -q tests/test_p9f_realtime_scene.py -k chromium

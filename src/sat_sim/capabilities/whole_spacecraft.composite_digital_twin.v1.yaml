capability_id: whole_spacecraft.composite_digital_twin.v1
schema_version: 0.1.0
name: Composite whole-spacecraft engineering model
level: whole_spacecraft
domain: whole_spacecraft
target: composite_digital_twin
trust_level: conformance_tested
status: agent_ready
summary: V37-B Agent-callable wrapper around the existing unified Basilisk whole-spacecraft graph. It assembles orbit/environment,
  spacecraft dynamics, closed-loop ADCS, EPS, thermal, communication/data, payload, and optional propulsion in one SimBaseClass.
  Runtime faults are routed through whole_spacecraft -> subsystem -> component handlers; degradations are mapped to subsystem-owned
  build-time configurations. This remains an engineering prototype, not a flight-data-calibrated or certification-grade digital
  twin.
adapter:
  class_path: sat_sim.adapters.whole_spacecraft_composite_digital_twin.WholeSpacecraftCompositeDigitalTwinAdapter
  script_export: true
  runtime_run: true
implementation:
  model_modules:
  - whole_spacecraft.builder
  - whole_spacecraft.runner
  - whole_spacecraft._mission_gate
  - subsystems.adcs_closed_loop
  - subsystems.eps
  - subsystems.thermal
  - subsystems.comm_data
  - subsystems.payload
  - subsystems.propulsion
  - whole_spacecraft.faults
  - whole_spacecraft.degradation
  - whole_spacecraft._runtime_fault_injector
  - sat_sim.whole_spacecraft_effects
  legacy_demo_runner: null
  uses_legacy_runner: false
  basilisk_required: true
modes:
  nominal:
    supported: true
  fault:
    supported: true
    execution: runtime_basilisk_event_subsystem_component_route
    fault_types:
    - eps_battery_capacity_loss
    - eps_battery_open_circuit
    - adcs_rw_jamming
    - adcs_rw_bearing_seizure
    - propulsion_thruster_ignition_failure
    - payload_instrument_off
    - comm_data_downlink_link_loss
    - comm_data_storage_capacity_loss
    - thermal_heater_stuck_off
    - thermal_heater_stuck_on
    - thermal_radiator_rejection_loss
  degradation:
    supported: true
    execution: build_time_subsystem_configuration
    timed_events_supported: false
    degradation_types:
    - battery_capacity_loss_30pct
    - solar_panel_efficiency_loss_20pct
    - thruster_thrust_loss_15pct
    - combined_degradation
    - adcs_rw_friction_and_sensor_noise
    - thermal_heater_and_radiator_degradation
    - fuel_leak_and_pressure_loss
    - multi_subsystem_end_of_life
  mixed:
    supported: true
    execution: build_time_degradation_plus_runtime_fault_events
scope_exclusions:
- flight_data_calibration
- certification_grade_digital_twin
- full_fsw_in_the_loop
- detailed_multi_station_contact_scheduler
- calibrated_rf_propagation
- finite_element_thermal
- high_fidelity_battery_electrochemistry
- detailed_payload_mission_planning
- calibrated_mission_success_probability

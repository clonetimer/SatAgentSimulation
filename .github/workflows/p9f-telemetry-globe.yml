name: P9-F Basilisk telemetry-driven globe

on:
  pull_request:
    paths:
      - "src/sat_sim/interactive/api.py"
      - "src/sat_sim/api.py"
      - "src/sat_sim/telemetry_overview.py"
      - "src/sat_sim/dataset_writer.py"
      - "src/sat_sim/web/app.js"
      - "src/sat_sim/web/continuous.js"
      - "src/sat_sim/web/satellite-scene.js"
      - "tests/js/test_p9c_scene_lifecycle.cjs"
      - "tests/test_p9f_telemetry_globe.py"
      - "tests/interactive/test_p9f_live_publication.py"
      - "tests/test_p9f_native_browser.py"
      - "docs/superpowers/plans/2026-11-14-p9f-telemetry-driven-globe.md"
      - ".github/workflows/p9f-telemetry-globe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p9f-telemetry-globe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  telemetry-contract:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify globe lifecycle and ECI telemetry conversion
        run: node --test tests/js/test_p9c_scene_lifecycle.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install Python contract dependencies
        run: >-
          python -m pip install
          "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0"
          "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6"
          "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0"
          "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
          "playwright==1.57.0"
      - name: Verify trace and real-time telemetry contracts
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/test_p9f_telemetry_globe.py -k "not browser"
  chromium-telemetry-scene:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify globe lifecycle and ECI telemetry conversion
        run: node --test tests/js/test_p9c_scene_lifecycle.cjs
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install browser and API dependencies
        run: >-
          python -m pip install
          "pytest==9.0.3" "pydantic==2.13.4" "jsonschema==4.26.0"
          "numpy==2.3.5" "PyYAML==6.0.3" "colorama==0.4.6"
          "sgp4==2.25" "joblib==1.5.3" "scikit-learn==1.9.0"
          "fastapi==0.139.2" "starlette==1.3.1" "httpx==0.28.1"
          "playwright==1.57.0"
      - name: Install local Globe.gl assets and Chromium
        run: |
          python scripts/vendor_scene_assets.py
          python -m playwright install chromium
      - name: Exercise real telemetry-driven satellite scene
        env:
          PYTHONPATH: "src:."
        run: |
          SAT_SIM_BROWSER_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" python -m pytest -q tests/test_p9f_telemetry_globe.py -k browser

  native-live-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Basilisk 2.11.0, API and browser dependencies
        run: >-
          python -m pip install
          "bsk==2.11.0" "sgp4==2.25" "colorama==0.4.6" "numpy==2.3.5"
          "pydantic==2.13.4" "jsonschema==4.26.0" "PyYAML==6.0.3"
          "joblib==1.5.3" "scikit-learn==1.9.0" "psutil==7.2.2"
          "numba==0.63.1" "pytest==9.0.3" "fastapi==0.139.2"
          "starlette==1.3.1" "httpx==0.28.1" "uvicorn[standard]==0.39.0"
          "playwright==1.57.0"
      - name: Require genuine Basilisk runtime
        run: python -c "import Basilisk; print('Basilisk', Basilisk.__version__)"
      - name: Verify actual native telemetry in bounded and continuous sessions
        env:
          PYTHONPATH: "src:."
        run: python -m pytest -q tests/interactive/test_p9f_live_publication.py
      - name: Install local Globe.gl assets and Chromium
        run: |
          python scripts/vendor_scene_assets.py
          python -m playwright install chromium
      - name: Exercise real user-created Basilisk sessions through Globe.gl
        env:
          PYTHONPATH: "src:."
          SAT_SIM_P9F_NATIVE_BROWSER_TEST: "1"
          SAT_SIM_P9F_EVIDENCE: "${{ runner.temp }}/p9f-native-browser"
        run: python -m pytest -q tests/test_p9f_native_browser.py -k native_user_created_session
      - name: Preserve real native browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p9f-native-browser-evidence
          path: ${{ runner.temp }}/p9f-native-browser
          if-no-files-found: ignore
